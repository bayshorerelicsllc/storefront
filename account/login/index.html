<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>
// Apply cached theme instantly to avoid flash of default styling
(function() {
  try {
    var cached = localStorage.getItem('bsr-theme-cache');
    if (cached) {
      var t = JSON.parse(cached);
      var root = document.documentElement.style;
      if (t.color_accent) root.setProperty('--accent', t.color_accent);
      if (t.color_bg) root.setProperty('--bg', t.color_bg);
      if (t.color_text) root.setProperty('--text', t.color_text);
      if (t.color_bg_soft) root.setProperty('--bg-soft', t.color_bg_soft);
      if (t.color_line) root.setProperty('--line', t.color_line);
      if (t.color_text_faint) root.setProperty('--text-faint', t.color_text_faint);
      if (t.font_heading && t.font_heading !== 'system') root.setProperty('--font-head', t.font_heading);
      if (t.font_body && t.font_body !== 'system') root.setProperty('--font-body', t.font_body);
    }
  } catch(e) {}
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=20260925b">
<script src="/assets/js/bsr.js?v=20260925c" defer></script>
<script src="/assets/js/login-modal.js?v=20260925f" defer></script>
<style>
/* Standalone Logitech-style sign-in page: minimal, centered, no site chrome. */
html, body { margin: 0; padding: 0; }
body { background: var(--bg, #f8f4e9); color: var(--text, #2a241b);
  font-family: var(--font-body, system-ui, -apple-system, "Segoe UI", sans-serif); }
.logi-page { min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 56px 20px 64px;
  box-sizing: border-box; }
.logi-page-inner { width: 100%; max-width: 400px; }
.logi-loading { text-align: center; color: #8a8172; font-size: .95rem; }
</style>
</head>
<body>
<main class="logi-page">
  <div class="logi-page-inner" id="login-form-root">
    <p class="logi-loading">Loading…</p>
  </div>
</main>
<script>
(function () {
  function render() {
    // Already signed in? Back to the homepage.
    if (window.BSR && BSR.me) {
      BSR.me().then(function (c) { if (c) window.location = '/'; }).catch(function () {});
    }
    // Cache the real theme object for instant application on next page load.
    if (window.BSR && BSR.loadTheme) {
      BSR.loadTheme().then(function (t) {
        try { if (t && t.color_bg) localStorage.setItem('bsr-theme-cache', JSON.stringify(t)); } catch (e) {}
      }).catch(function () {});
    }
    // Render the shared Logitech-style form inline (no modal on this page).
    if (window.BSR && BSR.renderLoginForm && !BSR.renderLoginForm._missing) {
      BSR.renderLoginForm('#login-form-root');
    } else if (window.BSR && BSR.showLogin) {
      // login-modal.js failed to load: fall back to the modal.
      BSR.showLogin();
      document.getElementById('login-form-root').innerHTML = '';
    }
  }
  // login-modal.js is deferred; poll briefly until BSR.renderLoginForm exists.
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    var ready = window.BSR && BSR.renderLoginForm && !BSR.renderLoginForm._missing;
    var root = document.getElementById('login-form-root');
    var stillLoading = root && root.querySelector('.logi-loading');
    if ((ready && stillLoading) || tries > 60) {
      clearInterval(iv);
      if (stillLoading) render();
    }
  }, 100);
  if (document.readyState === 'complete') { /* poller handles it */ }
})();
</script>
</body>
</html>
