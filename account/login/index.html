<script>
// Apply cached theme instantly to avoid flash of default styling
(function() {
  try {
    var cached = localStorage.getItem('bsr-theme-cache');
    if (cached) {
      var t = JSON.parse(cached);
      var root = document.documentElement.style;
      if (t.color_accent) root.setProperty('--accent', t.color_accent);
      if (t.color_bg) root.setProperty('--bg', t.color_bg);
      if (t.color_text) root.setProperty('--text', t.color_text);
      if (t.color_bg_soft) root.setProperty('--bg-soft', t.color_bg_soft);
      if (t.color_line) root.setProperty('--line', t.color_line);
      if (t.color_text_faint) root.setProperty('--text-faint', t.color_text_faint);
      if (t.font_heading && t.font_heading !== 'system') root.setProperty('--font-head', t.font_heading);
      if (t.font_body && t.font_body !== 'system') root.setProperty('--font-body', t.font_body);
    }
  } catch(e) {}
})();
</script>

<script>
function bsrOAuthError(msg) {
  var box = document.getElementById('oauth-error');
  if (box) { box.textContent = 'Sign-in failed: ' + msg; box.style.display = 'block'; }
}
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: 'account' });
  // Cache the real theme object for instant application on next page load.
  // (Uses loadTheme's promise so we never cache pre-theme defaults.)
  if (BSR.loadTheme) {
    BSR.loadTheme().then(function (t) {
      try { if (t && t.color_bg) localStorage.setItem('bsr-theme-cache', JSON.stringify(t)); } catch (e) {}
    });
  }
  // Already signed in? Go straight to the account page.
  BSR.me().then(function (c) { if (c) window.location = '/account/'; });
  // Surface OAuth failures (?error=... set by the worker's failure page redirect).
  var q = new URLSearchParams(window.location.search);
  var oerr = q.get('error');
  if (oerr) bsrOAuthError(oerr);
  var form = document.getElementById('login-form');
  var errBox = document.getElementById('form-error');
  var btn = document.getElementById('submit-btn');
  function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.style.display = 'none';
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }
    btn.disabled = true;
    BSR.api('/api/account/login', { method: 'POST', body: { email: email, password: password } })
      .then(function (j) {
        if (j && j.ok) {
          window.location = '/account/';
        } else {
          showError((j && j.error) || 'Sign in failed. Please try again.');
          btn.disabled = false;
        }
      });
  });
});
</script>
