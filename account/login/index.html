<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>
// Apply cached theme instantly to avoid flash of default styling
(function() {
  try {
    var cached = localStorage.getItem('bsr-theme-cache');
    if (cached) {
      var t = JSON.parse(cached);
      var root = document.documentElement.style;
      if (t.color_accent) root.setProperty('--accent', t.color_accent);
      if (t.color_bg) root.setProperty('--bg', t.color_bg);
      if (t.color_text) root.setProperty('--text', t.color_text);
      if (t.color_bg_soft) root.setProperty('--bg-soft', t.color_bg_soft);
      if (t.color_line) root.setProperty('--line', t.color_line);
      if (t.color_text_faint) root.setProperty('--text-faint', t.color_text_faint);
      if (t.font_heading && t.font_heading !== 'system') root.setProperty('--font-head', t.font_heading);
      if (t.font_body && t.font_body !== 'system') root.setProperty('--font-body', t.font_body);
    }
  } catch(e) {}
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=20260925b">
<script src="/assets/js/bsr.js?v=20260925b" defer></script>
<style>
.sdk-btn { display:flex; align-items:center; justify-content:center;
  width:100%; margin-bottom:12px; min-height:48px; }
.sdk-btn > div, .sdk-btn > a { display:flex; justify-content:center; }
#LoginWithAmazon img { display:block; }
.oauth-fallback-btn { display:flex; align-items:center; justify-content:center; width:100%;
  max-width:320px; margin:0 auto; padding:12px 16px; border:1px solid var(--line);
  border-radius:6px; background:var(--bg); color:var(--text); font-weight:600;
  font-size:15px; text-decoration:none; }
.oauth-fallback-btn:active { filter:brightness(0.94); }
.sdk-fallback { font-size:0.85rem; }
.sdk-fallback a { color:var(--accent); }
.oauth-divider { display:flex; align-items:center; gap:12px; margin:20px 0;
  color:var(--text-faint); font-size:0.85rem; }
.oauth-divider::before, .oauth-divider::after { content:""; flex:1; height:1px; background:var(--line); }
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
  <div class="auth-card">
    <h1>Sign in</h1>
    <div id="oauth-buttons">
      <div class="sdk-btn" id="sdk-google"><div id="gsi-button"></div></div>
      <div class="sdk-btn" id="sdk-facebook"><div id="fb-root"></div>
        <div class="fb-login-button" data-size="large" data-button-type="continue_with"
             data-width="300" data-scope="public_profile,email" data-onlogin="bsrOnFacebookLogin();"></div>
      </div>
      <div class="sdk-btn" id="sdk-amazon"><div id="amazon-root"></div>
        <a href="#" id="LoginWithAmazon" aria-label="Login with Amazon">
          <img border="0" alt="Login with Amazon"
               src="https://images-na.ssl-images-amazon.com/images/G/01/lwa/btnLWA_gold_312x64.png"
               width="156" height="32">
        </a>
      </div>
      <div class="sdk-btn" id="sdk-paypal"><div id="paypal-login-button"></div></div>
    </div>
    <div class="oauth-divider">or with email</div>
    <div class="error" id="oauth-error" role="alert" style="display:none;margin:0 0 16px;font-size:0.85rem;color:var(--danger)"></div>
    <form id="login-form" novalidate>
      <div class="error" id="form-error" role="alert" style="display:none;margin:0 0 16px;font-size:0.85rem;color:var(--danger)"></div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
    </form>
    <p style="margin-top:18px;text-align:center">
      <a href="/account/register/">New here? Create an account</a>
    </p>
    <p style="margin-top:6px;text-align:center">
      <a href="/shop/">Continue as guest</a>
    </p>
  </div>
</div>
</main>
<div id="bsr-footer"></div>
<script>
function bsrLoadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = src; s.async = true; s.defer = true;
    s.onload = resolve;
    s.onerror = function () { reject(new Error('load failed: ' + src)); };
    document.head.appendChild(s);
  });
}
function bsrOAuthError(msg) {
  var box = document.getElementById('oauth-error');
  if (box) { box.textContent = 'Sign-in failed: ' + msg; box.style.display = 'block'; }
}
function bsrOAuthFallback(containerId, provider, label) {
  var c = document.getElementById(containerId);
  if (!c || c.getAttribute('data-fb-done')) return;
  c.setAttribute('data-fb-done', '1');
  c.innerHTML = '<a class="oauth-fallback-btn" href="https://cm.bayshorerelicsllc.com/api/account/' +
    provider + '/start">' + label + '</a>';
}
function bsrVerify(provider, path, body) {
  bsrOAuthError(''); // clear
  var box = document.getElementById('oauth-error');
  if (box) { box.textContent = 'Signing you in with ' + provider + '\u2026'; box.style.display = 'block'; }
  BSR.api(path, { method: 'POST', body: body }).then(function (j) {
    if (j && j.ok) { window.location = '/account/'; }
    else bsrOAuthError((j && j.error) || 'Sign in failed. Please try again.');
  });
}
/* Facebook XFBML button callback (must be global for data-onlogin). */
function bsrOnFacebookLogin() {
  if (typeof FB === 'undefined') { bsrOAuthError('Facebook SDK did not load.'); return; }
  FB.getLoginStatus(function (resp) {
    if (resp && resp.status === 'connected' && resp.authResponse && resp.authResponse.accessToken) {
      bsrVerify('Facebook', '/api/account/facebook/verify', { access_token: resp.authResponse.accessToken });
    } else {
      bsrOAuthError('Facebook sign-in was cancelled.');
    }
  });
}
function bsrInitOAuth(cfg) {
  /* Google Identity Services: official rendered button. */
  if (cfg.google_client_id) {
    bsrLoadScript('https://accounts.google.com/gsi/client').then(function () {
      google.accounts.id.initialize({
        client_id: cfg.google_client_id,
        callback: function (resp) {
          if (resp && resp.credential) bsrVerify('Google', '/api/account/google/verify', { credential: resp.credential });
          else bsrOAuthError('Google sign-in was cancelled.');
        }
      });
      google.accounts.id.renderButton(document.getElementById('gsi-button'),
        { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', width: 300 });
      // GIS fails SILENTLY when the origin isn't authorized yet (no exception, no fallback).
      // Verify the button actually rendered; otherwise show the server-side fallback link.
      setTimeout(function () {
        var el = document.getElementById('gsi-button');
        if (el && !el.hasChildNodes()) bsrOAuthFallback('sdk-google', 'google', 'Continue with Google');
      }, 5000);
    }).catch(function () { bsrOAuthFallback('sdk-google', 'google', 'Continue with Google'); });
  } else { document.getElementById('sdk-google').style.display = 'none'; }

  /* Facebook SDK: official Continue with Facebook button (XFBML). */
  if (cfg.facebook_app_id) {
    window.fbAsyncInit = function () {
      FB.init({ appId: cfg.facebook_app_id, cookie: true, xfbml: true, version: 'v18.0' });
    };
    bsrLoadScript('https://connect.facebook.net/en_US/sdk.js')
      .catch(function () { bsrOAuthFallback('sdk-facebook', 'facebook', 'Continue with Facebook'); });
  } else { document.getElementById('sdk-facebook').style.display = 'none'; }

  /* Login with Amazon SDK + Amazon's official button image. */
  if (cfg.amazon_client_id) {
    window.onAmazonLoginReady = function () {
      amazon.Login.setClientId(cfg.amazon_client_id);
      document.getElementById('LoginWithAmazon').onclick = function (e) {
        if (e) e.preventDefault();
        amazon.Login.authorize({ scope: 'profile' }, function (resp) {
          if (resp && resp.error) { bsrOAuthError('Amazon sign-in failed.'); return; }
          if (resp && resp.access_token) bsrVerify('Amazon', '/api/account/amazon/verify', { access_token: resp.access_token });
          else bsrOAuthError('Amazon did not return an access token.');
        });
        return false;
      };
    };
    bsrLoadScript('https://api-cdn.amazon.com/sdk/login1.js')
      .catch(function () { bsrOAuthFallback('sdk-amazon', 'amazon', 'Login with Amazon'); });
  } else { document.getElementById('sdk-amazon').style.display = 'none'; }

  /* PayPal JS SDK: official Log in with PayPal button. */
  if (cfg.paypal_client_id) {
    bsrLoadScript('https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(cfg.paypal_client_id) + '&components=auth-button')
      .then(function () {
        var renderResult = paypal.AuthButton({
          scopes: ['openid', 'profile', 'email'],
          style: { label: 'login', color: 'blue', height: 40, shape: 'pill' },
          onApprove: function (data) {
            if (data && data.authCode) bsrVerify('PayPal', '/api/account/paypal/verify', { code: data.authCode });
            else bsrOAuthError('PayPal sign-in was cancelled.');
          },
          onError: function () { bsrOAuthError('PayPal sign-in failed.'); }
        }).render('#paypal-login-button');
        if (renderResult && typeof renderResult.catch === 'function') {
          renderResult.catch(function () { bsrOAuthFallback('sdk-paypal', 'paypal', 'Log in with PayPal'); });
        }
        // If the button never appears (slow/blocked SDK), fall back to server-side flow.
        setTimeout(function () {
          var el = document.getElementById('paypal-login-button');
          if (el && !el.hasChildNodes()) bsrOAuthFallback('sdk-paypal', 'paypal', 'Log in with PayPal');
        }, 8000);
      })
      .catch(function () { bsrOAuthFallback('sdk-paypal', 'paypal', 'Log in with PayPal'); });
  } else { document.getElementById('sdk-paypal').style.display = 'none'; }
  /* Global backstop: if any SDK script hung (no load, no error, no render),
     make sure a working fallback link is shown instead of empty space. */
  setTimeout(function () {
    try {
      var g = document.getElementById('gsi-button');
      if (g && !g.hasChildNodes()) bsrOAuthFallback('sdk-google', 'google', 'Continue with Google');
      var p = document.getElementById('paypal-login-button');
      if (p && !p.hasChildNodes()) bsrOAuthFallback('sdk-paypal', 'paypal', 'Log in with PayPal');
      if (typeof amazon === 'undefined' || !amazon.Login) bsrOAuthFallback('sdk-amazon', 'amazon', 'Login with Amazon');
      var f = document.getElementById('sdk-facebook');
      if (f && f.style.display !== 'none' && !f.querySelector('iframe'))
        bsrOAuthFallback('sdk-facebook', 'facebook', 'Continue with Facebook');
    } catch (e) {}
  }, 12000);
}
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: 'account' });
  // Cache the real theme object for instant application on next page load.
  // (Uses loadTheme's promise so we never cache pre-theme defaults.)
  if (BSR.loadTheme) {
    BSR.loadTheme().then(function (t) {
      try { if (t && t.color_bg) localStorage.setItem('bsr-theme-cache', JSON.stringify(t)); } catch (e) {}
    });
  }
  // Already signed in? Go straight to the account page.
  BSR.me().then(function (c) { if (c) window.location = '/account/'; });
  // Fetch public OAuth client IDs, then render each provider's official SDK button.
  BSR.api('/api/account/oauth-config').then(function (j) {
    if (j && j.ok) bsrInitOAuth(j);
    else {
      bsrOAuthFallback('sdk-google', 'google', 'Continue with Google');
      bsrOAuthFallback('sdk-facebook', 'facebook', 'Continue with Facebook');
      bsrOAuthFallback('sdk-amazon', 'amazon', 'Login with Amazon');
      bsrOAuthFallback('sdk-paypal', 'paypal', 'Log in with PayPal');
    }
  });
  // Surface OAuth failures (?error=... set by the worker's failure page redirect).
  var q = new URLSearchParams(window.location.search);
  var oerr = q.get('error');
  if (oerr) bsrOAuthError(oerr);
  var form = document.getElementById('login-form');
  var errBox = document.getElementById('form-error');
  var btn = document.getElementById('submit-btn');
  function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.style.display = 'none';
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }
    btn.disabled = true;
    BSR.api('/api/account/login', { method: 'POST', body: { email: email, password: password } })
      .then(function (j) {
        if (j && j.ok) {
          window.location = '/account/';
        } else {
          showError((j && j.error) || 'Sign in failed. Please try again.');
          btn.disabled = false;
        }
      });
  });
});
</script>
</body></script>
</body>
</html>
