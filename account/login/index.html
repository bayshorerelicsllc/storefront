<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>
// Apply cached theme instantly to avoid flash of default styling
(function() {
  try {
    var cached = localStorage.getItem('bsr-theme-cache');
    if (cached) {
      var t = JSON.parse(cached);
      var root = document.documentElement.style;
      if (t.color_accent) root.setProperty('--accent', t.color_accent);
      if (t.color_bg) root.setProperty('--bg', t.color_bg);
      if (t.color_text) root.setProperty('--text', t.color_text);
      if (t.color_bg_soft) root.setProperty('--bg-soft', t.color_bg_soft);
      if (t.color_line) root.setProperty('--line', t.color_line);
      if (t.color_text_faint) root.setProperty('--text-faint', t.color_text_faint);
      if (t.font_heading && t.font_heading !== 'system') root.setProperty('--font-head', t.font_heading);
      if (t.font_body && t.font_body !== 'system') root.setProperty('--font-body', t.font_body);
    }
  } catch(e) {}
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=20260925b">
<script src="/assets/js/bsr.js?v=20260925c" defer></script>
<script src="/assets/js/login-modal.js?v=20260925d" defer></script>
<style>
/* Standalone login page: centered card using the shared login-form styles. */
.login-page-wrap { max-width: 440px; margin: 40px auto; padding: 0 20px; }
.login-page-card { background: var(--bg-soft, #f8f4e9); border: 1px solid var(--line, #e7dfc9);
  border-radius: 16px; padding: 34px 30px 28px; box-shadow: 0 8px 28px rgba(30,77,51,.08); }
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
  <div class="login-page-wrap">
    <div class="login-page-card" id="login-form-root">
      <p class="muted">Loading…</p>
    </div>
  </div>
</main>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: 'account' });
  // Cache the real theme object for instant application on next page load.
  if (BSR.loadTheme) {
    BSR.loadTheme().then(function (t) {
      try { if (t && t.color_bg) localStorage.setItem('bsr-theme-cache', JSON.stringify(t)); } catch (e) {}
    });
  }
  // Already signed in? Go straight to the account page.
  BSR.me().then(function (c) { if (c) window.location = '/account/'; });
  // Render the shared email-first login form inline (no modal on this page).
  // login-modal.js defines BSR.renderLoginForm; fall back to the modal if it
  // failed to load for any reason.
  function render() {
    if (BSR.renderLoginForm && !BSR.renderLoginForm._missing) {
      BSR.renderLoginForm('#login-form-root', {
        heading: 'Sign in',
        sub: "Don't have an account yet? Enter your email and we'll help you create one!"
      });
    } else {
      BSR.showLogin().then(function () {
        // Modal opened as fallback; nothing inline to render.
        document.getElementById('login-form-root').innerHTML = '';
      });
    }
  }
  if (document.readyState === 'complete') render();
  else window.addEventListener('load', render);
  // If login-modal.js is deferred, it may not be ready at DOMContentLoaded.
  // Poll briefly for BSR.renderLoginForm.
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    if ((BSR.renderLoginForm && !BSR.renderLoginForm._missing) || tries > 40) {
      clearInterval(iv);
      var root = document.getElementById('login-form-root');
      if (root && root.querySelector('.muted')) render();
    }
  }, 100);
});
</script>
</body>
</html>
