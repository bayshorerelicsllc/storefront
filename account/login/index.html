<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css">
<script src="/assets/js/bsr.js" defer></script>
<style>
.oauth-btn { display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; padding:12px 16px; margin-bottom:10px;
  border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--bg); color:var(--text); font:inherit; font-weight:600;
  text-decoration:none; cursor:pointer; }
.oauth-btn:hover { background:var(--bg-soft); border-color:var(--text-faint); }
.oauth-divider { display:flex; align-items:center; gap:12px; margin:20px 0;
  color:var(--text-faint); font-size:0.85rem; }
.oauth-divider::before, .oauth-divider::after { content:""; flex:1; height:1px; background:var(--line); }
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
  <div class="auth-card">
    <h1>Sign in</h1>
    <div id="oauth-buttons">
      <a class="oauth-btn" href="https://cm.bayshorerelicsllc.com/api/account/google/start">Continue with Google</a>
      <a class="oauth-btn" href="https://cm.bayshorerelicsllc.com/api/account/amazon/start">Continue with Amazon</a>
      <a class="oauth-btn" href="https://cm.bayshorerelicsllc.com/api/account/facebook/start">Continue with Facebook</a>
      <a class="oauth-btn" href="https://cm.bayshorerelicsllc.com/api/account/paypal/start">Continue with PayPal</a>
    </div>
    <div class="oauth-divider">or with email</div>
    <div class="error" id="oauth-error" role="alert" style="display:none;margin:0 0 16px;font-size:0.85rem;color:var(--danger)"></div>
    <form id="login-form" novalidate>
      <div class="error" id="form-error" role="alert" style="display:none;margin:0 0 16px;font-size:0.85rem;color:var(--danger)"></div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
    </form>
    <p style="margin-top:18px;text-align:center">
      <a href="/account/register/">New here? Create an account</a>
    </p>
    <p style="margin-top:6px;text-align:center">
      <a href="/shop/">Continue as guest</a>
    </p>
  </div>
</div>
</main>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: 'account' });
  // Already signed in? Go straight to the account page.
  BSR.me().then(function (c) { if (c) window.location = '/account/'; });
  // Surface OAuth failures (?error=... set by the worker's failure page redirect).
  var q = new URLSearchParams(window.location.search);
  var oerr = q.get('error');
  if (oerr) {
    var box = document.getElementById('oauth-error');
    box.textContent = 'Sign-in failed: ' + oerr;
    box.style.display = 'block';
  }
  var form = document.getElementById('login-form');
  var errBox = document.getElementById('form-error');
  var btn = document.getElementById('submit-btn');
  function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errBox.style.display = 'none';
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }
    btn.disabled = true;
    BSR.api('/api/account/login', { method: 'POST', body: { email: email, password: password } })
      .then(function (j) {
        if (j && j.ok) {
          window.location = '/account/';
        } else {
          showError((j && j.error) || 'Sign in failed. Please try again.');
          btn.disabled = false;
        }
      });
  });
});
</script>
</body>
</html>
