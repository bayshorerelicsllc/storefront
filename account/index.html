<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods4">
<script src="/assets/js/bsr.js?v=20260925k" defer></script>
<script src="/assets/js/addr-validate.js?v=20260925a"></script>
<script src="https://js.stripe.com/v3/" defer></script>
<style>
.acct-nav-btn { display:flex; align-items:center; gap:10px; padding:10px 12px; width:100%;
  border-radius:var(--radius-sm); color:var(--text); background:none; border:0; font:inherit;
  cursor:pointer; text-align:left; }
.acct-nav-btn:hover { background:var(--bg-soft); }
.acct-nav-btn.active { background:var(--bg-soft); font-weight:600; }
.profile-head { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
.profile-head img { width:56px; height:56px; border-radius:50%; object-fit:cover;
  border:1px solid var(--line); }
.profile-head .ph-avatar-fallback { width:56px; height:56px; border-radius:50%;
  background:#1e4d33; color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; font-weight:700; }
.profile-head .ph-name { font-size:1.25rem; font-weight:700; }
.profile-head .ph-email { color:var(--text-soft); font-size:.92rem; }
.card-row { display:flex; align-items:center; gap:14px; padding:14px 0;
  border-top:1px solid var(--line); }
.card-row:first-child { border-top:0; }
.card-row .spacer { flex:1; }
.order-item { display:flex; justify-content:space-between; gap:14px; padding:8px 0;
  border-top:1px solid var(--line); }
.order-item .oi-name { font-size:.94rem; }
.order-item .oi-price { white-space:nowrap; font-weight:600; }
.order-track { display:flex; align-items:center; gap:8px; margin-top:10px;
  font-size:.9rem; color:var(--text-soft); }
.order-track .ic { flex:none; }
#stripe-card-element { padding:12px 14px; border:1px solid var(--line);
  border-radius:var(--radius-sm); background:var(--bg); margin:12px 0; }
.pm-error { color:var(--danger); font-size:.88rem; margin:8px 0; }
/* Forms */
.acct-form { max-width:520px; }
.acct-field { margin-bottom:16px; }
.acct-field label { display:block; font-size:.78rem; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; color:var(--text-soft); margin-bottom:6px; }
.acct-field input, .acct-field select { width:100%; padding:11px 13px; font-size:1rem;
  border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--bg);
  color:var(--text); box-sizing:border-box; font-family:inherit; }
.acct-field input:focus, .acct-field select:focus { outline:none; border-color:#1e4d33;
  box-shadow:0 0 0 2px rgba(30,77,51,.12); }
.acct-field input[readonly] { background:var(--bg-soft); color:var(--text-soft); }
.acct-field .hint { font-size:.82rem; color:var(--text-soft); margin-top:5px; }
.acct-actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.acct-msg { padding:11px 14px; border-radius:var(--radius-sm); font-size:.9rem; margin:0 0 16px; }
.acct-msg.ok { background:#e8f3ec; color:#1e4d33; border:1px solid #bcd8c4; }
.acct-msg.err { background:#fdecea; color:#9c2b1e; border:1px solid #f3c1b8; }
/* Toast notifications */
#acct-toast-wrap { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:9999;
  display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;
  width:calc(100% - 32px); max-width:420px; }
.acct-toast { background:#1e4d33; color:#fff; padding:12px 22px; border-radius:999px; font-size:.92rem;
  box-shadow:0 6px 20px rgba(0,0,0,.28); opacity:0; transform:translateY(12px);
  transition:opacity .25s ease, transform .25s ease; text-align:center; max-width:100%; }
.acct-toast.show { opacity:1; transform:translateY(0); }
.acct-toast.err { background:#9c2b1e; }
@media (prefers-reduced-motion:reduce) { .acct-toast { transition:none; } }
/* Address cards */
.addr-grid { display:grid; gap:12px; margin:0 0 8px; }
@media (min-width:640px) { .addr-grid { grid-template-columns:1fr 1fr; } }
.addr-card { border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:14px 15px; background:var(--bg); position:relative; }
.addr-card.is-default { border-color:#1e4d33; border-width:2px; }
.addr-card .addr-name { font-weight:700; margin-bottom:4px; }
.addr-card .addr-lines { font-size:.92rem; color:var(--text); line-height:1.5; }
.addr-card .addr-badge { display:inline-block; font-size:.72rem; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; background:#1e4d33; color:#fff;
  border-radius:999px; padding:3px 10px; margin-bottom:8px; }
.addr-badges { margin-bottom:8px; }
.addr-val-note { font-size:.88rem; color:var(--text-soft); margin:8px 0; }
.addr-val-ok { font-size:.88rem; color:#1e4d33; font-weight:600; margin:8px 0; }
.addr-val-suggest, .addr-val-warn { border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:12px 14px; margin:10px 0; background:var(--bg); font-size:.9rem; }
.addr-val-warn { border-color:#b98a2f; background:#fdf6e8; }
.addr-val-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.addr-card .addr-badge.addr-badge-bill { background:#8a6d3b; }
.addr-card .addr-actions { display:flex; gap:8px; margin-top:12px; }
.addr-card .addr-actions button { font-size:.84rem; padding:6px 12px; }
.addr-form-wrap { border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:18px; margin:14px 0; background:var(--bg-soft); }
.addr-form-grid { display:grid; gap:0 12px; }
@media (min-width:520px) {
  .addr-form-grid.two-col { grid-template-columns:1fr 1fr; }
}
.checkbox-row { display:flex; align-items:center; gap:9px; margin:4px 0 12px;
  font-size:.92rem; }
.checkbox-row input { width:18px; height:18px; accent-color:#1e4d33; }
/* Section headings */
.acct-section { margin-bottom:34px; }
.acct-section > h2 { font-family:var(--font-head); color:#1e4d33; font-size:1.15rem;
  margin:0 0 4px; }
.acct-section > .sec-desc { font-size:.9rem; color:var(--text-soft); margin:0 0 16px; }
.acct-section > h3.sub { font-size:1rem; margin:22px 0 10px; color:var(--text); }
/* Passkeys */
.pk-list { list-style:none; margin:0 0 14px; padding:0; }
.pk-list li { display:flex; align-items:center; justify-content:space-between; gap:12px;
  border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:11px 14px; margin-bottom:8px; background:var(--bg); }
.pk-list .pk-meta { font-size:.82rem; color:var(--text-soft); }
/* Layout */
.account-layout { display:block; }
@media (min-width:860px) {
  .account-layout { display:grid; grid-template-columns:220px 1fr; gap:32px; align-items:start; }
  .account-nav { position:sticky; top:20px; }
}
.account-nav { margin-bottom:20px; }
.empty { text-align:center; padding:36px 16px; color:var(--text-soft); }
.empty .ic { opacity:.5; margin-bottom:10px; }
.empty h2 { color:var(--text); margin:8px 0; }
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap" id="account-root"><p>Loading&hellip;</p></div>
</main>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: 'account' });
  var root = document.getElementById('account-root');
  var tab = 'profile';
  var customer = null;

  function esc(s) { return BSR.esc(s); }

  function showMsg(el, ok, text) {
    el.innerHTML = '<div class="acct-msg ' + (ok ? 'ok' : 'err') + '">' + esc(text) + '</div>';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function clearMsg(el) { el.innerHTML = ''; }
  /* Toast notification: small popup, ~3s, then fades. ok=false => red error toast. */
  function toast(text, ok) {
    var wrap = document.getElementById('acct-toast-wrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'acct-toast-wrap';
      document.body.appendChild(wrap);
    }
    var t = document.createElement('div');
    t.className = 'acct-toast' + (ok === false ? ' err' : '');
    t.textContent = text;
    wrap.appendChild(t);
    void t.offsetWidth; /* force reflow so the transition runs */
    t.classList.add('show');
    setTimeout(function () {
      t.classList.remove('show');
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 300);
    }, 3000);
  }

  /* ---------------- shell ---------------- */
  function shell(contentHtml) {
    var avatar = customer.avatar_url
      ? '<img src="' + esc(customer.avatar_url) + '" alt="">'
      : '<div class="ph-avatar-fallback">' + esc((customer.name || '?').trim().charAt(0).toUpperCase()) + '</div>';
    var tabs = [
      ['profile', 'user', 'Profile'],
      ['addresses', 'truck', 'Addresses'],
      ['security', 'shield', 'Security'],
      ['orders', 'package', 'Orders'],
      ['cards', 'card', 'Payment methods'],
    ];
    var nav = tabs.map(function (t) {
      return '<button type="button" class="acct-nav-btn' + (tab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' +
        BSR.icon(t[1], 'ic-sm') + esc(t[2]) + '</button>';
    }).join('') +
      '<button type="button" class="acct-nav-btn" id="signout-btn">' + BSR.icon('logout', 'ic-sm') + 'Sign out</button>';
    return '<div class="page-head"><div class="profile-head">' + avatar +
      '<div><div class="ph-name">' + esc(customer.name || 'Your account') + '</div>' +
      '<div class="ph-email">' + esc(customer.email || '') + '</div></div></div></div>' +
      '<div class="account-layout">' +
      '<nav class="account-nav" aria-label="Account">' + nav + '</nav>' +
      '<section id="acct-col" aria-label="Account details">' + contentHtml + '</section>' +
      '</div>';
  }
  function bindShell() {
    root.querySelectorAll('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () { tab = b.getAttribute('data-tab'); render(); });
    });
    document.getElementById('signout-btn').addEventListener('click', function () {
      BSR.api('/api/account/logout', { method: 'POST' }).then(function () {
        window.location = '/account/login/';
      });
    });
  }

  /* ---------------- profile ---------------- */
  function renderProfile() {
    return '<div class="acct-section"><h2>Profile</h2>' +
      '<p class="sec-desc">Your contact information. Your email is your login and can&rsquo;t be changed here.</p>' +
      '<div id="profile-msg"></div>' +
      '<form id="profile-form" class="acct-form" autocomplete="on">' +
      '<div class="acct-field"><label for="pf-name">Full name</label>' +
      '<input id="pf-name" name="name" type="text" required maxlength="120" autocomplete="name" value="' + esc(customer.name || '') + '"></div>' +
      '<div class="acct-field"><label for="pf-email">Email</label>' +
      '<input id="pf-email" type="email" readonly value="' + esc(customer.email || '') + '">' +
      '<div class="hint">This is your sign-in email.</div></div>' +
      '<div class="acct-field"><label for="pf-phone">Phone</label>' +
      '<input id="pf-phone" name="phone" type="tel" inputmode="numeric" maxlength="40" autocomplete="tel" required value="' + esc(customer.phone || '') + '">' +
      '<div class="hint">For order updates and delivery questions.</div></div>' +
      '<div class="acct-actions"><button type="submit" class="btn btn-primary" id="pf-save">Save changes</button></div>' +
      '</form></div>';
  }
  function bindProfile() {
    var form = document.getElementById('profile-form');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('profile-msg');
      clearMsg(msg);
      var btn = document.getElementById('pf-save');
      btn.disabled = true;
      BSR.api('/api/account/profile', {
        method: 'PATCH',
        body: {
          name: form.name.value.trim(),
          phone: form.phone.value.trim(),
        },
      }).then(function (j) {
        if (j && j._status === 401) { window.location = '/account/login/'; return; }
        if (j && j.ok) {
          customer.name = j.customer.name;
          customer.phone = j.customer.phone;
          showMsg(msg, true, 'Profile saved.');
          toast('Profile saved \u2713');
          render();
        } else {
          var em = (j && j.error) || 'Could not save. Please try again.';
          showMsg(msg, false, em);
          toast(em, false);
        }
      }).catch(function () {
        showMsg(msg, false, 'Could not save. Check your connection and try again.');
        toast('Could not save. Check your connection and try again.', false);
      }).finally(function () { btn.disabled = false; });
    });
  }

  /* ---------------- addresses ---------------- */
  function addrCard(a) {
    var lines = esc(a.address1 || '');
    if (a.address2) lines += '<br>' + esc(a.address2);
    lines += '<br>' + esc(a.city || '') + ', ' + esc(a.state || '') + ' ' + esc(a.postal || '');
    lines += '<br>' + esc(a.country || '');
    var badges = '';
    if (a.is_default_shipping) badges += '<span class="addr-badge">Default shipping</span> ';
    if (a.is_default_billing) badges += '<span class="addr-badge addr-badge-bill">Default billing</span> ';
    var isDef = a.is_default_shipping || a.is_default_billing;
    return '<div class="addr-card' + (isDef ? ' is-default' : '') + '" data-addr="' + esc(a.id) + '">' +
      (badges ? '<div class="addr-badges">' + badges + '</div>' : '') +
      '<div class="addr-lines">' + lines + '</div>' +
      '<div class="addr-actions">' +
      '<button type="button" class="btn btn-ghost btn-sm" data-addr-edit="' + esc(a.id) + '">Edit</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" data-addr-del="' + esc(a.id) + '" style="color:#9c2b1e">Remove</button>' +
      '</div></div>';
  }
  function addrFormHtml(a) {
    a = a || {};
    var isNew = !a.id;
    /* First address saved becomes default for both. */
    var checkShip = isNew ? (addrCache.length === 0) : !!a.is_default_shipping;
    var checkBill = isNew ? (addrCache.length === 0) : !!a.is_default_billing;
    return '<div class="addr-form-wrap"><form class="addr-form" data-addr-form="' + (a.id || 'new') + '">' +
      '<div class="addr-form-grid two-col">' +
      '<div class="acct-field"><label>Street address</label><input name="address1" required maxlength="200" autocomplete="street-address" value="' + esc(a.address1 || '') + '"></div>' +
      '<div class="acct-field"><label>Apt, suite, etc. (optional)</label><input name="address2" maxlength="200" value="' + esc(a.address2 || '') + '"></div>' +
      '<div class="acct-field"><label>City</label><input name="city" required maxlength="100" autocomplete="address-level2" value="' + esc(a.city || '') + '"></div>' +
      '<div class="acct-field"><label>State / Province</label><input name="state" maxlength="100" autocomplete="address-level1" value="' + esc(a.state || '') + '"></div>' +
      '<div class="acct-field"><label>ZIP / Postal code</label><input name="postal" required maxlength="20" autocomplete="postal-code" value="' + esc(a.postal || '') + '"></div>' +
      '<div class="acct-field"><label>Country</label><input name="country" maxlength="10" autocomplete="country-name" value="' + esc(a.country || 'US') + '"></div>' +
      '</div>' +
      '<div id="addr-validate-msg"></div>' +
      '<label class="checkbox-row"><input type="checkbox" name="is_default_shipping"' + (checkShip ? ' checked' : '') + '> Use as default shipping address</label>' +
      '<label class="checkbox-row"><input type="checkbox" name="is_default_billing"' + (checkBill ? ' checked' : '') + '> Use as default billing address</label>' +
      '<div class="acct-actions"><button type="submit" class="btn btn-primary btn-sm">Save address</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" data-addr-cancel>Cancel</button></div>' +
      '</form></div>';
  }
  function renderAddresses() {
    return '<div class="acct-section"><h2>Addresses</h2>' +
      '<p class="sec-desc">Saved addresses for faster checkout. Your defaults are pre-filled at checkout.</p>' +
      '<div id="addr-msg"></div>' +
      '<div class="addr-grid" id="addr-list"><p>Loading&hellip;</p></div>' +
      '<div id="addr-form-slot"></div>' +
      '<div class="acct-actions"><button type="button" class="btn btn-secondary btn-sm" id="addr-add">Add address</button></div>' +
      '</div>';
  }
  var addrCache = [];
  function loadAddresses() {
    BSR.api('/api/account/addresses').then(function (j) {
      if (j && j._status === 401) { window.location = '/account/login/'; return; }
      addrCache = (j && j.ok && Array.isArray(j.addresses)) ? j.addresses : [];
      paintAddrList();
    }).catch(function () {
      document.getElementById('addr-list').innerHTML = '<p>Could not load addresses.</p>';
    });
  }
  function paintAddrList() {
    var el = document.getElementById('addr-list');
    if (!el) return;
    el.innerHTML = addrCache.length ? addrCache.map(addrCard).join('')
      : '<p style="color:var(--text-soft);font-size:.92rem">No addresses saved yet.</p>';
    bindAddrButtons();
  }
  function bindAddrButtons() {
    root.querySelectorAll('[data-addr-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = addrCache.find(function (x) { return x.id === b.getAttribute('data-addr-edit'); });
        if (!a) return;
        var slot = document.getElementById('addr-form-slot');
        slot.innerHTML = addrFormHtml(a);
        bindAddrForm(slot);
        slot.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
    root.querySelectorAll('[data-addr-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-addr-del');
        var a = addrCache.find(function (x) { return x.id === id; });
        var roles = [];
        if (a) {
          if (a.is_default_shipping) roles.push('default shipping');
          if (a.is_default_billing) roles.push('default billing');
        }
        var msg = 'Remove this address?';
        if (roles.length && addrCache.length > 1) {
          msg = 'This is your ' + roles.join(' and ') + ' address. Removing it will make your oldest remaining address the new default. Continue?';
        }
        if (!window.confirm(msg)) return;
        BSR.api('/api/account/addresses/' + encodeURIComponent(id), { method: 'DELETE' })
          .then(function (j) {
            if (j && j.ok) {
              loadAddresses();
              if (j.promoted && j.promoted.length) {
                showAddrMsg(true, 'Address removed. Your oldest remaining address is now the default ' + j.promoted.join(' and ') + ' address.');
              }
              toast('Address removed');
            }
            else { var em3 = (j && j.error) || 'Could not remove the address.'; showAddrMsg(false, em3); toast(em3, false); }
          })
          .catch(function () { showAddrMsg(false, 'Could not remove. Check your connection.'); toast('Could not remove. Check your connection.', false); });
      });
    });
  }
  function showAddrMsg(ok, text) {
    var el = document.getElementById('addr-msg');
    if (el) showMsg(el, ok, text);
  }
  function bindAddrForm(slot) {
    var form = slot.querySelector('[data-addr-form]');
    if (!form) return;
    form.querySelector('[data-addr-cancel]').addEventListener('click', function () { slot.innerHTML = ''; });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var id = form.getAttribute('data-addr-form');
      var fd = new FormData(form);
      var payload = {
        address1: (fd.get('address1') || '').toString().trim(),
        address2: (fd.get('address2') || '').toString().trim(),
        city: (fd.get('city') || '').toString().trim(),
        state: (fd.get('state') || '').toString().trim(),
        postal: (fd.get('postal') || '').toString().trim(),
        country: (fd.get('country') || 'US').toString().trim() || 'US',
        is_default_shipping: !!fd.get('is_default_shipping'),
        is_default_billing: !!fd.get('is_default_billing'),
      };
      var doSave = function (p) {
        var url = id === 'new' ? '/api/account/addresses' : '/api/account/addresses/' + encodeURIComponent(id);
        BSR.api(url, { method: id === 'new' ? 'POST' : 'PUT', body: p })
          .then(function (j) {
            if (j && j.ok) {
              slot.innerHTML = ''; loadAddresses();
              var defChanged = (id === 'new');
              if (!defChanged) {
                for (var ai = 0; ai < addrCache.length; ai++) {
                  if (String(addrCache[ai].id) === String(id)) {
                    defChanged = (!!addrCache[ai].is_default_shipping !== !!p.is_default_shipping) ||
                                 (!!addrCache[ai].is_default_billing !== !!p.is_default_billing);
                    break;
                  }
                }
              }
              showAddrMsg(true, defChanged ? 'Address saved. Defaults updated.' : 'Address saved.');
              toast(defChanged ? 'Default updated \u2713' : 'Address saved \u2713');
            } else {
              var em2 = (j && j.error) || 'Could not save the address.';
              showAddrMsg(false, em2);
              toast(em2, false);
            }
          })
          .catch(function () { showAddrMsg(false, 'Could not save. Check your connection.'); toast('Could not save. Check your connection.', false); });
      };
      /* Validate the address before saving when the validator is available. */
      if (window.BSRAddrValidate && BSRAddrValidate.checkAndConfirm) {
        BSRAddrValidate.checkAndConfirm(form, payload, doSave);
      } else {
        doSave(payload);
      }
    });
  }
  function bindAddresses() {
    document.getElementById('addr-add').addEventListener('click', function () {
      var slot = document.getElementById('addr-form-slot');
      slot.innerHTML = addrFormHtml(null);
      bindAddrForm(slot);
      slot.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    loadAddresses();
  }

  /* ---------------- security ---------------- */
  function b64urlToBytes(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64url(bytes) {
    var bin = '', i;
    for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function pkSupported() {
    return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
  }
  function renderSecurity() {
    var pw = '';
    if (customer.has_password) {
      pw = '<h3 class="sub">Change password</h3>' +
        '<div id="pw-msg"></div>' +
        '<form id="pw-form" class="acct-form">' +
        '<div class="acct-field"><label for="pw-cur">Current password</label>' +
        '<input id="pw-cur" type="password" required autocomplete="current-password"></div>' +
        '<div class="acct-field"><label for="pw-new">New password</label>' +
        '<input id="pw-new" type="password" required minlength="8" autocomplete="new-password">' +
        '<div class="hint">At least 8 characters.</div></div>' +
        '<div class="acct-actions"><button type="submit" class="btn btn-primary btn-sm" id="pw-save">Update password</button></div>' +
        '</form>';
    } else {
      pw = '<h3 class="sub">Password</h3>' +
        '<p style="font-size:.92rem;color:var(--text-soft)">You sign in with ' +
        esc(socialProviderLabel()) + ', so there&rsquo;s no password on this account.</p>';
    }
    return '<div class="acct-section"><h2>Security</h2>' +
      '<p class="sec-desc">Manage how you sign in.</p>' + pw +
      '<h3 class="sub">Passkeys</h3>' +
      '<p style="font-size:.9rem;color:var(--text-soft);margin:0 0 12px">Sign in with your fingerprint, face, or security key — no password needed.</p>' +
      '<div id="pk-msg"></div>' +
      '<ul class="pk-list" id="pk-list"><li>Loading&hellip;</li></ul>' +
      '<div id="pk-add-slot"></div>' +
      '</div>';
  }
  function socialProviderLabel() {
    return 'a social account';
  }
  function bindSecurity() {
    var pwForm = document.getElementById('pw-form');
    if (pwForm) {
      pwForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var msg = document.getElementById('pw-msg');
        clearMsg(msg);
        var btn = document.getElementById('pw-save');
        btn.disabled = true;
        BSR.api('/api/account/change-password', {
          method: 'POST',
          body: {
            current_password: document.getElementById('pw-cur').value,
            new_password: document.getElementById('pw-new').value,
          },
        }).then(function (j) {
          if (j && j.ok) {
            showMsg(msg, true, 'Password updated.');
            toast('Password changed \u2713');
            pwForm.reset();
          } else {
            var em4 = (j && j.error) || 'Could not update password.';
            showMsg(msg, false, em4);
            toast(em4, false);
          }
        }).catch(function () {
          showMsg(msg, false, 'Could not update password. Check your connection.');
          toast('Could not update password. Check your connection.', false);
        }).finally(function () { btn.disabled = false; });
      });
    }
    loadPasskeys();
  }
  function loadPasskeys() {
    var list = document.getElementById('pk-list');
    var slot = document.getElementById('pk-add-slot');
    BSR.api('/api/account/passkeys').then(function (j) {
      if (j && j._status === 401) { window.location = '/account/login/'; return; }
      var pks = (j && j.ok && Array.isArray(j.passkeys)) ? j.passkeys : [];
      if (!pks.length) {
        list.innerHTML = '<li><span style="color:var(--text-soft);font-size:.92rem">No passkeys yet.</span></li>';
      } else {
        list.innerHTML = pks.map(function (p) {
          var d = '';
          try { d = new Date(p.created_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) {}
          return '<li><span><strong>' + esc(p.name || 'Passkey') + '</strong><br>' +
            '<span class="pk-meta">Added ' + esc(d) + '</span></span>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-pk-del="' + esc(p.id) + '" style="color:#9c2b1e">Remove</button></li>';
        }).join('');
        list.querySelectorAll('[data-pk-del]').forEach(function (b) {
          b.addEventListener('click', function () {
            if (!window.confirm('Remove this passkey?')) return;
            BSR.api('/api/account/passkeys/' + encodeURIComponent(b.getAttribute('data-pk-del')), { method: 'DELETE' })
              .then(function (r) {
                if (r && r.ok) { loadPasskeys(); toast('Passkey removed'); }
                else toast((r && r.error) || 'Could not remove the passkey.', false);
              })
              .catch(function () { toast('Could not remove the passkey. Check your connection.', false); });
          });
        });
      }
      if (pkSupported()) {
        slot.innerHTML = '<button type="button" class="btn btn-secondary btn-sm" id="pk-add-btn">Add a passkey</button>' +
          '<div id="pk-form-msg" style="font-size:.85rem;color:#8a6d3b;min-height:18px;margin-top:6px"></div>';
        document.getElementById('pk-add-btn').addEventListener('click', addPasskey);
      } else {
        slot.innerHTML = '<p style="font-size:.85rem;color:var(--text-soft)">This browser does not support passkeys.</p>';
      }
    }).catch(function () {
      list.innerHTML = '<li><span style="color:var(--text-soft)">Could not load passkeys.</span></li>';
    });
  }
  function pkFormMsg(t) {
    var el = document.getElementById('pk-form-msg');
    if (el) el.textContent = t || '';
  }
  function addPasskey() {
    pkFormMsg('');
    var name = window.prompt('Name this passkey (e.g. "Pixel 9", "MacBook"):');
    if (name === null) return;
    name = String(name || '').trim().slice(0, 60) || 'Passkey';
    pkFormMsg('Starting registration — follow your device prompt…');
    BSR.api('/api/account/passkey/register/start', { method: 'POST', body: {} })
      .then(function (start) {
        if (!start || !start.ok) throw new Error((start && start.error) || 'Could not start registration.');
        return navigator.credentials.create({
          publicKey: {
            challenge: b64urlToBytes(start.challenge),
            rp: start.rp,
            user: {
              id: b64urlToBytes(start.user.id),
              name: start.user.name,
              displayName: start.user.displayName,
            },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
            excludeCredentials: (start.excludeCredentials || []).map(function (c) {
              return { type: c.type || 'public-key', id: b64urlToBytes(c.id) };
            }),
            authenticatorSelection: start.authenticatorSelection,
            attestation: start.attestation || 'none',
            timeout: 60000,
          },
        }).then(function (cred) {
          if (!cred) throw new Error('cancelled');
          var resp = cred.response;
          return BSR.api('/api/account/passkey/register/finish', {
            method: 'POST',
            body: {
              id: cred.id,
              rawId: bytesToB64url(new Uint8Array(cred.rawId)),
              response: {
                attestationObject: bytesToB64url(new Uint8Array(resp.attestationObject)),
                clientDataJSON: bytesToB64url(new Uint8Array(resp.clientDataJSON)),
              },
              name: name,
            },
          });
        });
      })
      .then(function (fin) {
        if (fin && fin.ok) { pkFormMsg(''); loadPasskeys(); toast('Passkey added \u2713'); }
        else { var em5 = (fin && fin.error) || 'Registration failed.'; pkFormMsg(em5); toast(em5, false); }
      })
      .catch(function (e) {
        var m = String((e && e.message) || e);
        var cancelled = /notallowed|abort/i.test(m);
        pkFormMsg(cancelled ? 'Registration was cancelled.' : m);
        if (!cancelled) toast(m, false);
      });
  }

  /* ---------------- orders (existing) ---------------- */
  function shortId(id) {
    id = String(id == null ? '' : id);
    return id.length > 12 ? '…' + id.slice(-8) : id;
  }
  function fmtDate(d) {
    if (!d) return '';
    var t = new Date(d);
    return isNaN(t.getTime()) ? String(d) : t.toLocaleDateString();
  }
  function orderCard(o) {
    var paid = String(o.payment_status || '').toLowerCase() === 'paid';
    var shipped = String(o.fulfillment_status || '').toLowerCase() === 'shipped';
    var pills = '';
    if (paid) pills += '<span class="status-pill paid">Paid</span>';
    if (shipped) pills += '<span class="status-pill shipped">Shipped</span>';
    var items = '';
    (o.items || []).forEach(function (it) {
      var title = it.title || it.name || 'Item';
      items += '<div class="order-item"><span class="oi-name">' + esc(title) + '</span>' +
        '<span class="oi-price">' + BSR.money((it.price_cents || 0)) + '</span></div>';
    });
    var track = '';
    if (o.tracking_number) {
      track = '<div class="order-track">' + BSR.icon('truck', 'ic-sm') +
        '<span>Tracking: ' + esc((o.carrier || '') + ' ' + o.tracking_number).trim() + '</span></div>';
    }
    return '<div class="order-card">' +
      '<div class="oh"><strong>Order ' + esc(shortId(o.id)) + '</strong>' +
      '<span>' + esc(fmtDate(o.date)) + '</span>' +
      '<span>' + BSR.money(o.total || 0) + '</span>' + pills + '</div>' +
      items + track + '</div>';
  }
  function renderOrders() {
    return '<div class="acct-section"><h2>Orders</h2>' +
      '<p class="sec-desc">Your purchase history.</p>' +
      '<div id="orders-list"><p>Loading orders&hellip;</p></div></div>';
  }
  function bindOrders() {
    BSR.api('/api/account/orders').then(function (j) {
      if (j && j._status === 401) { window.location = '/account/login/'; return; }
      var col = document.getElementById('orders-list');
      if (!col) return;
      var orders = (j && j.ok && Array.isArray(j.orders)) ? j.orders : [];
      if (!orders.length) {
        col.innerHTML = '<div class="empty">' + BSR.icon('package') +
          '<h2>No orders yet</h2><p>When you buy a slide, it will show up here.</p>' +
          '<a class="btn btn-primary" href="/shop/" style="margin-top:14px">Start shopping</a></div>';
        return;
      }
      col.innerHTML = orders.map(orderCard).join('');
    });
  }

  /* ---------------- payment methods (existing Stripe) ---------------- */
  var stripe = null, cardEl = null, addingCard = false;
  function renderCards() {
    return '<div class="acct-section"><h2>Payment methods</h2>' +
      '<p class="sec-desc">Saved cards for faster checkout. Cards are stored securely by our payment processor — we never see your full card number.</p>' +
      '<div id="pm-list"><p>Loading saved cards&hellip;</p></div>' +
      '<div id="pm-add" style="margin-top:18px">' +
      '<button type="button" class="btn btn-secondary" id="pm-add-btn">Add a card</button>' +
      '<div id="pm-form" style="display:none">' +
      '<div id="stripe-card-element"></div>' +
      '<div class="pm-error" id="pm-error" role="alert" style="display:none"></div>' +
      '<button type="button" class="btn btn-primary" id="pm-save-btn">Save card</button> ' +
      '<button type="button" class="btn btn-ghost" id="pm-cancel-btn">Cancel</button>' +
      '</div></div></div>';
  }
  function loadStripe() {
    if (stripe) return Promise.resolve(stripe);
    return BSR.api('/api/catalog/config').then(function (j) {
      var pk = j && j.stripe_publishable_key;
      if (!pk) throw new Error('Card saving is not available right now.');
      if (typeof Stripe === 'undefined') throw new Error('Could not load the card form. Check your connection and try again.');
      stripe = Stripe(pk);
      return stripe;
    });
  }
  function showPmError(msg) {
    var box = document.getElementById('pm-error');
    if (!box) return;
    box.textContent = msg;
    box.style.display = 'block';
  }
  function resetAddForm() {
    addingCard = false;
    if (cardEl) { try { cardEl.destroy(); } catch (e) {} cardEl = null; }
    var form = document.getElementById('pm-form');
    var addBtn = document.getElementById('pm-add-btn');
    var errBox = document.getElementById('pm-error');
    if (form) form.style.display = 'none';
    if (addBtn) addBtn.style.display = '';
    if (errBox) errBox.style.display = 'none';
    var saveBtn = document.getElementById('pm-save-btn');
    if (saveBtn) saveBtn.disabled = false;
  }
  function refreshCards() {
    var list = document.getElementById('pm-list');
    BSR.api('/api/account/payment-methods').then(function (j) {
      if (j && j._status === 401) { window.location = '/account/login/'; return; }
      if (!list) return;
      if (!j || !j.ok) {
        list.innerHTML = '<p>' + esc((j && j.error) || 'Could not load saved cards.') + '</p>';
        return;
      }
      var cards = Array.isArray(j.cards) ? j.cards : [];
      if (!cards.length) {
        list.innerHTML = '<p style="color:var(--text-soft)">No saved cards yet. Add one for faster checkout.</p>';
        return;
      }
      list.innerHTML = cards.map(function (c) {
        var brand = { visa: 'Visa', mastercard: 'Mastercard', amex: 'Amex',
          discover: 'Discover', diners: 'Diners', jcb: 'JCB', unionpay: 'UnionPay' }
          [String(c.brand || '').toLowerCase()] ||
          (c.brand ? c.brand.charAt(0).toUpperCase() + c.brand.slice(1) : 'Card');
        var exp = (c.exp_month && c.exp_year)
          ? 'Expires ' + String(c.exp_month).padStart(2, '0') + '/' + String(c.exp_year).slice(-2) : '';
        return '<div class="card-row" data-pm="' + esc(c.id) + '">' +
          '<span class="card-brand">' + esc(brand) + '</span>' +
          '<span class="card-meta">&bull;&bull;&bull;&bull; ' + esc(c.last4) + '</span>' +
          '<span class="card-meta">' + esc(exp) + '</span>' +
          '<span class="spacer"></span>' +
          '<button type="button" class="btn btn-secondary btn-sm pm-delete">Remove</button>' +
          '</div>';
      }).join('');
      list.querySelectorAll('.pm-delete').forEach(function (b) {
        b.addEventListener('click', function () {
          var row = b.closest('.card-row');
          var pmId = row.getAttribute('data-pm');
          if (!window.confirm('Remove this card?')) return;
          b.disabled = true;
          BSR.api('/api/account/payment-methods/' + encodeURIComponent(pmId), { method: 'DELETE' })
            .then(function (r) {
              if (r && r._status === 401) { window.location = '/account/login/'; return; }
              if (r && r.ok) { refreshCards(); toast('Card removed'); }
              else {
                b.disabled = false;
                var em7 = (r && r.error) || 'Could not remove the card.';
                showPmError(em7);
                toast(em7, false);
              }
            })
            .catch(function () { b.disabled = false; toast('Could not remove the card. Check your connection.', false); });
        });
      });
    });
  }
  function saveCard() {
    var errBox = document.getElementById('pm-error');
    if (errBox) errBox.style.display = 'none';
    if (!cardEl) { showPmError('Card form is not ready yet.'); return; }
    var saveBtn = document.getElementById('pm-save-btn');
    saveBtn.disabled = true;
    BSR.api('/api/account/payment-methods/setup', { method: 'POST' }).then(function (j) {
      if (j && j._status === 401) { window.location = '/account/login/'; return null; }
      if (!j || !j.ok || !j.client_secret) throw new Error((j && j.error) || 'Could not start card setup.');
      return stripe.confirmCardSetup(j.client_secret, { payment_method: { card: cardEl } });
    }).then(function (res) {
      if (!res) return;
      if (res.error) throw new Error(res.error.message || 'Card could not be saved.');
      resetAddForm();
      refreshCards();
      toast('Card saved \u2713');
    }).catch(function (e) {
      saveBtn.disabled = false;
      var em6 = e.message || 'Could not save the card.';
      showPmError(em6);
      toast(em6, false);
    });
  }
  function bindCards() {
    refreshCards();
    document.getElementById('pm-add-btn').addEventListener('click', function () {
      if (addingCard) return;
      addingCard = true;
      var form = document.getElementById('pm-form');
      form.style.display = 'block';
      this.style.display = 'none';
      loadStripe().then(function (st) {
        var elements = st.elements();
        cardEl = elements.create('card');
        cardEl.mount('#stripe-card-element');
      }).catch(function (e) {
        showPmError(e.message || 'Could not load the card form. Check your connection and try again.');
      });
    });
    document.getElementById('pm-cancel-btn').addEventListener('click', resetAddForm);
    document.getElementById('pm-save-btn').addEventListener('click', saveCard);
  }

  /* ---------------- render dispatch ---------------- */
  function render() {
    var html = '';
    if (tab === 'profile') html = renderProfile();
    else if (tab === 'addresses') html = renderAddresses();
    else if (tab === 'security') html = renderSecurity();
    else if (tab === 'orders') html = renderOrders();
    else if (tab === 'cards') html = renderCards();
    root.innerHTML = shell(html);
    bindShell();
    if (tab === 'profile') bindProfile();
    else if (tab === 'addresses') bindAddresses();
    else if (tab === 'security') bindSecurity();
    else if (tab === 'orders') bindOrders();
    else if (tab === 'cards') bindCards();
  }

  /* ---------------- boot ---------------- */
  BSR.api('/api/account/me').then(function (j) {
    if (j && j._status === 401) { window.location = '/account/login/'; return; }
    if (j && j.ok && j.customer) { customer = j.customer; render(); }
    else { window.location = '/account/login/'; }
  });
});
</script>

<script>
/* Phone field (id pf-phone): digits only. */
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t && t.id === 'pf-phone') {
    var v = t.value.replace(/[^0-9]/g, '').slice(0, 15);
    if (t.value !== v) t.value = v;
  }
});
</script>
