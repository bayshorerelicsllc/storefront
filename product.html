<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide details — Bay Shore Relics LLC</title>
<meta name="description" id="meta-desc" content="Vintage 35mm railroad slide — a single physical item, sold once.">
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods5">
<script src="/assets/js/bsr.js?v=20260926j" defer></script>
<style>.gallery-wrap{position:relative}</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap" id="page"></div>
</main>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: 'shop' });

  var pageEl = document.getElementById('page');
  var params = new URLSearchParams(location.search);
  var slug = params.get('slug');

  function cardHtml(p) {
    var url = '/product.html?slug=' + encodeURIComponent(p.slug);
    var img = p.image
      ? '<img src="' + BSR.esc(p.image) + '" alt="' + BSR.esc(p.title) + '" loading="lazy">'
      : '<span class="no-photo">' + BSR.icon('eye', 'ic-lg') + '</span>';
    var meta = [p.railroad, p.item_number ? '#' + p.item_number : '']
      .filter(Boolean).map(BSR.esc).join(' · ');
    var onSale = p.compare_at_cents && p.compare_at_cents > p.price_cents;
    var price = BSR.money(p.price_cents) +
      (onSale ? '<s>' + BSR.money(p.compare_at_cents) + '</s>' : '');
    var badge = onSale ? ' <span class="badge badge-sale">Sale</span>' : '';
    return '<article class="card"><a class="card-link" href="' + url + '">' +
      '<div class="card-img">' + img + BSR.wishToggleHtml(p.slug) + '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title">' + BSR.esc(p.title) + '</h3>' +
        (meta ? '<div class="card-meta">' + meta + '</div>' : '') +
        '<div class="card-price">' + price + badge + '</div>' +
      '</div></a></article>';
  }

  function unavailable() {
    pageEl.innerHTML =
      '<div class="empty">' +
        BSR.icon('box', 'ic-lg') +
        '<h2>This slide isn\'t available</h2>' +
        '<p>It may have been sold, or the link isn\'t quite right.</p>' +
        '<a class="btn btn-primary" href="/shop/">Browse the shop</a>' +
      '</div>';
  }

  function renderProduct(p) {
    var imgs = (p.images && p.images.length ? p.images : (p.image ? [{ url: p.image, alt: p.title }] : []));
    var galleryInner = imgs.length
      ? '<div class="gallery-main" id="gallery-main"><img src="' + BSR.esc(imgs[0].url) +
        '" alt="' + BSR.esc(imgs[0].alt || p.title) + '"></div>' +
        (imgs.length > 1
          ? '<div class="gallery-thumbs" id="gallery-thumbs">' +
            imgs.map(function (im, i) {
              return '<button data-i="' + i + '"' + (i === 0 ? ' class="active"' : '') +
                ' aria-label="View photo ' + (i + 1) + '">' +
                '<img src="' + BSR.esc(im.url) + '" alt=""></button>';
            }).join('') + '</div>'
          : '')
      : '<div class="gallery-main"><span class="no-photo">' + BSR.icon('eye', 'ic-lg') + '</span></div>';
    /* Heart sits top-right of the product image, exactly like the preview cards. */
    var gallery = '<div class="gallery-wrap">' + BSR.wishToggleHtml(p.slug) + galleryInner + '</div>';

    var onSale = p.compare_at_cents && p.compare_at_cents > p.price_cents;
    var price = BSR.money(p.price_cents) +
      (onSale ? '<s>' + BSR.money(p.compare_at_cents) + '</s>' : '') +
      (onSale ? ' <span class="badge badge-sale">Sale</span>' : '');

    var metaRows =
      '<tr><th>Item #</th><td>' + BSR.esc(p.item_number || '—') + '</td></tr>' +
      '<tr><th>Railroad</th><td>' + BSR.esc(p.railroad || '—') + '</td></tr>' +
      (p.collection_id ? '<tr><th>Collection</th><td>' + BSR.esc(p.collection_id) + '</td></tr>' : '');

    var desc = p.description
      ? '<div class="prose"><h2>About this slide</h2><p>' +
        BSR.esc(p.description).replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>') + '</p></div>'
      : '';

    pageEl.innerHTML =
      '<nav class="crumbs" aria-label="Breadcrumb">' +
        '<a href="/shop/">Shop</a> <span aria-hidden="true">/</span> ' + BSR.esc(p.title) +
      '</nav>' +
      '<div class="product-layout">' +
        '<div>' + gallery + '</div>' +
        '<div class="product-info">' +
          '<span class="badge badge-one">One of a kind</span>' +
          '<h1>' + BSR.esc(p.title) + '</h1>' +
          '<div class="price">' + price + '</div>' +
          '<table class="meta-table"><tbody>' + metaRows + '</tbody></table>' +
          '<p class="stock-note">' + BSR.icon('check', 'ic-sm') +
            ' Only 1 available — when it\'s gone, it\'s gone</p>' +
          '<div class="buy-row" id="buy-row"></div>' +
          '<div class="trust-row">' +
            '<span>' + BSR.icon('shield', 'ic-sm') + ' Secure checkout</span>' +
            '<span>' + BSR.icon('truck', 'ic-sm') + ' Ships from Wisconsin</span>' +
            '<span>' + BSR.icon('box', 'ic-sm') + ' Carefully packed</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      desc +
      '<div id="related"></div>';

    // Gallery thumbs
    var thumbs = document.getElementById('gallery-thumbs');
    if (thumbs) {
      thumbs.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          var i = parseInt(b.getAttribute('data-i'), 10);
          var main = document.getElementById('gallery-main');
          main.innerHTML = '<img src="' + BSR.esc(imgs[i].url) + '" alt="' + BSR.esc(imgs[i].alt || p.title) + '">';
          thumbs.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
        });
      });
    }

    renderBuyRow(p);
    /* If this slide's reservation lapses while the page is open, refresh the buy row. */
    BSR._onCartDrop = function (slug) { if (slug === p.slug) renderBuyRow(p); };

    // Related slides: same railroad, excluding self
    BSR.api('/api/catalog/products?per=12').then(function (j) {
      if (!j || !j.ok || !p.railroad) return;
      var rel = (j.products || []).filter(function (x) {
        return x.slug !== p.slug && x.railroad === p.railroad;
      }).slice(0, 4);
      if (!rel.length) return;
      document.getElementById('related').innerHTML =
        '<h2>You may also like</h2><div class="grid">' + rel.map(cardHtml).join('') + '</div>';
    });
  }

  function renderBuyRow(p) {
    var row = document.getElementById('buy-row');
    if (BSR.cart.has(p.slug)) { showInCart(); return; }
    row.innerHTML = '<div class="sk" style="height:42px;width:220px"></div>';
    BSR.api('/api/cart/status', { method: 'POST', body: { slugs: [p.slug], tokens: BSR.cart.tokens() } }).then(function (j) {
      var st = (j && j.ok && j.status) ? j.status[p.slug] : 'available';
      if (BSR.cart.has(p.slug)) { showInCart(); return; }
      if (st === 'sold') {
        if (BSR.wishlist.has(p.slug)) { BSR.wishlist.remove(p.slug); BSR.paintWishToggles(document); }
        row.innerHTML = '<div class="held-note">' + BSR.icon('info', 'ic-sm') + '<span><strong>Sold.</strong> This one-of-a-kind slide has found a new home.</span></div>';
      } else if (st === 'held') { showHeld(); }
      else if (st === 'gone') {
        if (BSR.wishlist.has(p.slug)) { BSR.wishlist.remove(p.slug); BSR.paintWishToggles(document); }
        row.innerHTML = '<div class="held-note">' + BSR.icon('info', 'ic-sm') + '<span>This slide is no longer available.</span></div>';
      } else { showAdd(); }
    }).catch(function () { if (!BSR.cart.has(p.slug)) showAdd(); });

    function showInCart() {
      row.innerHTML =
        '<a class="btn btn-primary" href="/cart/">' + BSR.icon('check', 'ic-sm') + ' In your cart \u2014 view cart</a>';
    }
    function showAdd() {
      row.innerHTML =
        '<button class="btn btn-primary" id="add-btn">' + BSR.icon('cart', 'ic-sm') + ' Add to cart</button>' +
        '<a class="btn btn-secondary" href="/cart/">View cart</a>';
      document.getElementById('add-btn').addEventListener('click', function () {
        var btn = document.getElementById('add-btn');
        btn.disabled = true;
        btn.textContent = 'Reserving\u2026';
        BSR.cart.add(p.slug).then(function (res) {
          if (res && res.ok) {
            BSR.toast('Added \u2014 reserved for 30 minutes');
            showInCart();
          } else {
            BSR.toast((res && res.error) || 'Could not add to cart', 'err');
            renderBuyRow(p);
          }
        });
      });
    }
    function showHeld() {
      row.innerHTML =
        '<div class="notify-panel" id="notify-box">' +
        '<div class="notify-head"><span class="notify-ic">' + BSR.icon('bell', 'ic-sm') + '</span>' +
        '<div><strong>Someone else is holding this slide</strong>' +
        '<span class="notify-sub">If their reservation ends, it\u2019s yours to grab.</span></div></div>' +
        '<button class="btn btn-primary notify-full" id="wl-btn" type="button">' + BSR.icon('bell', 'ic-sm') + ' Notify me</button>' +
        '<p class="notify-hint">We\u2019ll pop up an alert here and notify this browser the moment it\u2019s available.</p>' +
        '</div>';
      document.getElementById('wl-btn').addEventListener('click', function () {
        var btn = document.getElementById('wl-btn');
        btn.disabled = true;
        btn.innerHTML = 'Setting you up\u2026';
        /* Browser/popup alerts always: create the watcher first (bell alerts work
           even if push permission is denied), then request push as a bonus. */
        BSR.api('/api/waitlist', { method: 'POST', body: { slug: p.slug, bid: BSR.bid(), watch: true } }).then(function () {
          return BSR.enableBrowserNotifications('');
        }).then(function () {
          BSR.pollNotifications();
          showEmailStep();
        }).catch(function () {
          btn.disabled = false;
          btn.innerHTML = BSR.icon('bell', 'ic-sm') + ' Notify me';
          BSR.toast('Could not set up notifications', 'err');
        });
      });

      /* Step 2: offer email too. Signed-in shoppers get one-tap with their
         account email (no typing); guests must enter an email. */
      function showEmailStep() {
        BSR.me().then(function (me) { renderEmailStep(me && me.email ? me.email : ''); })
          .catch(function () { renderEmailStep(''); });
      }
      function renderEmailStep(accountEmail) {
        var box = document.getElementById('notify-box');
        if (!box) return;
        var emailBlock;
        if (accountEmail) {
          emailBlock =
            '<div class="notify-email">' +
            '<strong>Want an email too?</strong>' +
            '<span class="notify-sub">One tap \u2014 we\u2019ll use your account email, <b>' + BSR.esc(accountEmail) + '</b>.</span>' +
            '<div class="notify-row"><button class="btn btn-primary" id="wl-email-btn" type="button">Email me too</button>' +
            '<button class="btn btn-secondary" id="wl-skip" type="button">No thanks</button></div>' +
            '</div>';
        } else {
          emailBlock =
            '<div class="notify-email">' +
            '<label class="notify-label" for="wl-email"><strong>Want an email too?</strong></label>' +
            '<div class="field"><input type="email" id="wl-email" placeholder="you@example.com" aria-label="Email address" autocomplete="email"></div>' +
            '<div class="notify-row"><button class="btn btn-primary" id="wl-email-btn" type="button">Email me too</button>' +
            '<button class="btn btn-secondary" id="wl-skip" type="button">No thanks</button></div>' +
            '</div>';
        }
        box.innerHTML =
          '<div class="notify-panel">' +
          '<div class="notify-done"><span class="notify-ic">' + BSR.icon('check', 'ic-sm') + '</span>' +
          '<div><strong>You\u2019re watching this slide.</strong>' +
          '<span class="notify-sub">We\u2019ll pop up an alert here if it frees up.</span></div></div>' +
          emailBlock +
          '</div>';
        document.getElementById('wl-skip').addEventListener('click', function () {
          var nb = document.getElementById('notify-box');
          if (nb) nb.querySelector('.notify-email').remove();
        });
        document.getElementById('wl-email-btn').addEventListener('click', function () {
          var em = accountEmail;
          if (!em) {
            em = document.getElementById('wl-email').value.trim();
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) {
              BSR.toast('Enter a valid email address', 'err');
              document.getElementById('wl-email').focus();
              return;
            }
          }
          var eb = document.getElementById('wl-email-btn');
          eb.disabled = true;
          BSR.api('/api/waitlist', { method: 'POST', body: { slug: p.slug, email: em, bid: BSR.bid() } }).then(function (j) {
            var nb = document.getElementById('notify-box');
            if (j && j.ok) {
              if (nb) nb.innerHTML =
                '<div class="notify-panel">' +
                '<div class="notify-done"><span class="notify-ic">' + BSR.icon('check', 'ic-sm') + '</span>' +
                '<div><strong>You\u2019re all set.</strong>' +
                '<span class="notify-sub">We\u2019ll alert you here, in this browser, and at ' + BSR.esc(em) + '.</span></div></div>' +
                '</div>';
            } else {
              eb.disabled = false;
              BSR.toast((j && j.error) || 'Could not add email alerts', 'err');
            }
          });
        });
      }
    }
  }

  if (!slug) { unavailable(); return; }

  pageEl.innerHTML =
    '<div class="product-layout">' +
      '<div><div class="sk" style="aspect-ratio:1"></div></div>' +
      '<div class="product-info"><div class="sk" style="height:24px;margin-bottom:16px"></div>' +
      '<div class="sk" style="height:42px;width:70%;margin-bottom:16px"></div>' +
      '<div class="sk" style="height:90px"></div></div>' +
    '</div>';

  BSR.api('/api/catalog/products/' + encodeURIComponent(slug)).then(function (j) {
    if (!j || !j.ok || !j.product) { unavailable(); return; }
    var p = j.product;
    document.title = (p.seo_title || p.title) + ' — Bay Shore Relics LLC';
    var meta = document.getElementById('meta-desc');
    if (meta) meta.setAttribute('content', p.seo_description || (p.description || '').slice(0, 155) || 'Vintage 35mm railroad slide — a single physical item, sold once.');
    renderProduct(p);
  });
});
</script>
</body>
</html>
