<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Bay Shore Relics LLC</title>
<meta name="description" content="This page ran off the rails. Find your way back to the Bay Shore Relics LLC shop.">
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods2">
<script src="/assets/js/bsr.js" defer></script>
<style>
.nf { max-width: 560px; margin: 60px auto 80px; text-align: center; }
.nf .ic-lg { width: 64px; height: 64px; color: var(--text-faint); margin-bottom: 10px; }
.nf form { display: flex; gap: 10px; margin: 22px 0; }
.nf form input { flex: 1; padding: 12px 16px; border: 1px solid var(--line);
  border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 1rem; }
.nf .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
<div class="nf">
<div id="nf-icon"></div>
<h1>This page ran off the rails</h1>
<p style="color:var(--text-soft)">The page you're looking for doesn't exist, moved, or was never here. Let's get you back on track.</p>
<form action="/search/" method="get">
<input type="search" name="q" placeholder="Search slides…" aria-label="Search slides" required>
<button class="btn btn-primary" type="submit">Search</button>
</form>
<div class="row">
<a class="btn btn-primary" href="/shop/">Back to shop</a>
<a class="btn btn-secondary" href="/contact/">Contact us</a>
</div>
</div>
</div>
</main>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: '' });
  document.getElementById('nf-icon').innerHTML = BSR.icon('train', 'ic-lg');
});
</script>
</body>
</html>
