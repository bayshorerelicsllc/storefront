<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods9">
<script src="/assets/js/bsr.js?v=20260926b" defer></script>
<script src="/assets/js/addr-validate.js?v=20260925m" defer></script>
<script src="/assets/js/checkout-common.js?v=20260926a" defer></script>

<style>
.bsr-val-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow-y:auto;}
.bsr-val-modal{background:var(--bg-card);border-radius:16px;max-width:680px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:24px;box-shadow:0 12px 48px rgba(0,0,0,0.35);box-sizing:border-box;margin:auto;position:relative;}
.bsr-val-modal h3{margin:0 0 8px 0;font-size:1.2rem;color:var(--accent-deep);font-family:var(--font-head);}
.bsr-val-modal .val-kind{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px;}
.bsr-val-modal .val-addr{background:var(--bg-soft);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;margin:12px 0;font-size:14px;line-height:1.5;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;}
.bsr-val-modal .val-actions{display:flex;gap:10px;margin-top:16px;}
.bsr-val-modal .val-actions button{flex:1;padding:12px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;border:none;}
.bsr-val-modal .val-use{background:var(--accent);color:var(--accent-ink);}
.bsr-val-modal .val-keep{background:var(--bg-soft);color:var(--text);border:1px solid var(--line);}
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
<div class="page-head">
<h1>Checkout</h1>
<p>Each slide is a single physical item, sold once.</p>
<div id="login-prompt" style="display:none;background:#f0f7f0;border:1px solid #1a3c22;border-radius:8px;padding:12px 16px;margin:16px 0;text-align:center;">Have an account? <a href="/account/login/" style="color:#1a3c22;font-weight:700;">Log in</a> to use your saved addresses.</div>
</div>

<div class="checkout-layout">
<div class="checkout-main">
<section class="card" id="bill-section">
<h2><span class="step-num">1</span> Billing address</h2>
<div id="bill-addr-picker"></div>
<div class="addr-validate-msg" id="bill-val-msg"></div>
<div class="field"><label for="f-bill-name">Full name</label><input type="text" id="f-bill-name" class="input" required></div>
<div class="field"><label for="f-bill-company">Company</label><input type="text" id="f-bill-company" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-bill-email">Email</label><input type="email" id="f-bill-email" class="input" required></div>
<div class="field"><label for="f-bill-phone">Phone</label><input type="tel" id="f-bill-phone" class="input" required></div>
</div>
<div class="field"><label for="f-bill-line1">Street address</label><input type="text" id="f-bill-line1" name="address1" class="input" required></div>
<div class="field"><label for="f-bill-line2">Apt, suite, etc. <span class="opt">(optional)</span></label><input type="text" id="f-bill-line2" name="address2" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-bill-city">City</label><input type="text" id="f-bill-city" name="city" class="input" required></div>
<div class="field"><label for="f-bill-state">State / Province</label><input type="text" id="f-bill-state" name="state" class="input" required></div>
</div>
<div class="field-row">
<div class="field"><label for="f-bill-postal">ZIP / Postal code</label><input type="text" id="f-bill-postal" name="postal" class="input" required></div>
<div class="field"><label for="f-bill-country">Country</label><input type="text" id="f-bill-country" name="country" class="input" value="US" required></div>
</div>
</section>

<section class="card" style="text-align:center">
<button type="button" id="continue-to-shipping" class="btn btn-primary" style="width:100%;padding:16px;font-size:1.1rem">Continue to shipping &rarr;</button>
<div class="error" id="continue-err" style="display:none;color:#c00;margin-top:10px"></div>
</section>
</div>

<aside class="card summary">
<h2>Order summary</h2>
<div id="sum-lines"></div>
<div id="sum-rows"></div>
<div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)">
<span>Total</span><span id="sum-total">$0.00</span>
</div>
</aside>
</div>

</div>
</main>
<div id="bsr-footer"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
if (window.BSR && BSR.init) BSR.init();
// Retry the billing address picker until BSR.api is ready (up to 5s)
var _addrTries = 0;
var _addrTimer = setInterval(function(){
  _addrTries++;
  if ((window.BSR && BSR.api) || _addrTries > 25) {
    clearInterval(_addrTimer);
    try { initBillPicker(); } catch(e) {}
  }
}, 200);
// Address validator: live street suggestions (same as account address book)
var _valTries = 0;
var _valTimer = setInterval(function(){
  _valTries++;
  if ((window.BSRAddrValidate && BSRAddrValidate.attachLive) || _valTries > 25) {
    clearInterval(_valTimer);
    try {
      var billSec = document.getElementById('bill-section');
      if (window.BSRAddrValidate && BSRAddrValidate.attachLive && billSec) {
        BSRAddrValidate.attachLive(billSec);
      }
    } catch(e) {}
  }
}, 200);

// ---- Order summary ----
var cart=[]; try{cart=(window.BSR&&BSR.cart)?BSR.cart.list():JSON.parse(localStorage.getItem('bsr-cart-v1')||'[]');}catch(e){}
var sumLines=document.getElementById('sum-lines');
sumLines.innerHTML='<p>Loading&hellip;</p>';
(function(){
  if(!cart.length){sumLines.innerHTML='<p>Cart empty</p>';document.getElementById('sum-total').textContent='$0.00';return;}
  BSR.api('/api/catalog/products').then(function(j){
    var all=(j&&j.ok&&j.products)?j.products:[];
    var bySlug={};
    all.forEach(function(p){bySlug[p.slug]=p;});
    var t=0,html='';
    cart.forEach(function(slug){
      var p=bySlug[slug]||{slug:slug,title:slug,price_cents:0,image:''};
      var cents=p.price_cents||0;t+=cents;
      var img=p.image?'<img src="'+BSR.esc(p.image)+'" alt="'+BSR.esc(p.title||p.slug)+'" style="width:60px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0;">':'<div style="width:60px;height:60px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#999;">No image</div>';
      html+='<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eee;align-items:center;">'+img+
        '<div style="flex:1;min-width:0;"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+BSR.esc(p.title||p.slug)+'</div>'+
        '<div style="font-size:12px;color:#666;">Qty 1 &middot; '+BSR.esc(p.slug)+'</div></div>'+
        '<div style="font-weight:600;white-space:nowrap;">'+BSR.money(cents)+'</div></div>';
    });
    sumLines.innerHTML=html;
    document.getElementById('sum-total').textContent=BSR.money(t);
  }).catch(function(){
    var html=cart.map(function(slug){
      return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>'+BSR.esc(slug)+'</span><span>&mdash;</span></div>';
    }).join('');
    sumLines.innerHTML=html;
  });
})();

// ---- Saved billing addresses (signed-in only) ----
function fillBillForm(a) {
  BSRCheckout.setV('f-bill-name', a.name); BSRCheckout.setV('f-bill-company', a.company);
  BSRCheckout.setV('f-bill-email', a.email); BSRCheckout.setV('f-bill-phone', a.phone);
  BSRCheckout.setV('f-bill-line1', a.address1); BSRCheckout.setV('f-bill-line2', a.address2);
  BSRCheckout.setV('f-bill-city', a.city); BSRCheckout.setV('f-bill-state', a.state);
  BSRCheckout.setV('f-bill-postal', a.postal); BSRCheckout.setSel('f-bill-country', a.country);
}
function clearBillForm() {
  ['f-bill-name','f-bill-company','f-bill-email','f-bill-phone','f-bill-line1','f-bill-line2','f-bill-city','f-bill-state','f-bill-postal'].forEach(function(id){ BSRCheckout.setV(id,''); });
  BSRCheckout.setSel('f-bill-country','US');
}
function addrLabel(a) {
  var street = [a.address1, a.address2].filter(Boolean).join(', ');
  var city = [a.city, a.state].filter(Boolean).join(', ');
  if (a.postal) city += (city ? ' ' : '') + a.postal;
  var loc = [street, city].filter(Boolean).join(', ');
  var who = ((a.nickname || '').trim()) || ((a.name || '').trim());
  return (who ? who + ' \u2014 ' : '') + loc;
}
function initBillPicker() {
  if (!window.BSR || !BSR.api) return;
  BSR.api('/api/account/addresses').then(function(j) {
    if (!(j && j.ok && Array.isArray(j.addresses) && j.addresses.length)) {
      var lp = document.getElementById('login-prompt');
      if (lp && !(j && j.ok)) lp.style.display = '';
      return;
    }
    var list = j.addresses, byId = {};
    list.forEach(function(a){ byId[String(a.id)] = a; });
    var defBill = null;
    list.forEach(function(a){
      if (a.is_default_billing && !defBill) defBill = a;
    });
    var opts = function(selId) {
      return '<option value="">Use a new address\u2026</option>' + list.map(function(a){
        return '<option value="' + String(a.id).replace(/"/g,'&quot;') + '"' +
          (selId && String(a.id) === String(selId) ? ' selected' : '') + '>' +
          addrLabel(a).replace(/</g,'&lt;') + '</option>';
      }).join('');
    };
    document.getElementById('bill-addr-picker').innerHTML =
      '<div class="field"><label for="bill-saved">Saved addresses</label>' +
      '<select id="bill-saved" class="input">' + opts(defBill && defBill.id) + '</select></div>';
    if (defBill) fillBillForm(defBill);
    document.getElementById('bill-saved').addEventListener('change', function(){
      var a = byId[String(this.value)]; clearBillForm(); if (a) fillBillForm(a);
    });
  }).catch(function(){});
}

// ---- Postal code autofill (1-second polling, country auto-detect) ----
(function(){
  var countryMap={'united states':'us','usa':'us','canada':'ca','united kingdom':'gb','uk':'gb','great britain':'gb','germany':'de','france':'fr','australia':'au','mexico':'mx','japan':'jp','ireland':'ie','netherlands':'nl','spain':'es','italy':'it'};
  var lastBillZip='';
  function detectCountry(zip){
    var z=zip.trim().toUpperCase();
    if(/^[A-Z]\d[A-Z]\s?\d[A-Z]\d$/.test(z)) return 'ca';
    if(/^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/.test(z)) return 'gb';
    if(/^\d{4}$/.test(z)) return 'au';
    if(/^\d{5}(-?\d{4})?$/.test(z)) return 'us';
    return null;
  }
  function lookup(zip){
    var countryEl=document.getElementById('f-bill-country');
    var countryRaw=countryEl?countryEl.value.trim().toLowerCase():'us';
    var countryCode=countryMap[countryRaw]||countryRaw;
    if(!/^[a-z]{2}$/.test(countryCode)) countryCode='us';
    var detected=detectCountry(zip);
    if(detected&&detected!==countryCode){
      countryCode=detected;
      if(countryEl) countryEl.value=detected.toUpperCase();
    }
    var apiZip=zip;
    if(countryCode==='us'){
      var m5=/^(\d{5})(-?\d{4})?$/.exec(zip.trim());
      if(m5) apiZip=m5[1];
    }
    fetch('https://api.zippopotam.us/'+countryCode+'/'+encodeURIComponent(apiZip))
      .then(function(r){ if(!r.ok) throw new Error('not found'); return r.json(); })
      .then(function(data){
        var place=data.places&&data.places[0];
        if(!place) return;
        var cityEl=document.getElementById('f-bill-city');
        var stateEl=document.getElementById('f-bill-state');
        if(cityEl) cityEl.value=place['place name']||'';
        if(stateEl) stateEl.value=place['state abbreviation']||place['state']||'';
        if(countryEl&&data['country abbreviation']) countryEl.value=data['country abbreviation'];
      })
      .catch(function(){});
  }
  setInterval(function(){
    var bZipEl=document.getElementById('f-bill-postal');
    if(!bZipEl) return;
    var bZip=bZipEl.value.trim();
    if(bZip&&bZip!==lastBillZip){ lastBillZip=bZip; lookup(bZip); }
    if(!bZip) lastBillZip='';
  }, 1000);
})();

// ---- Validation + Continue to shipping ----
function validateBillFields(){
  var err=document.getElementById('continue-err');
  BSRCheckout.clearFieldErrs('#bill-section');
  var required=[
    ['f-bill-name','Full name'],
    ['f-bill-email','Email'],
    ['f-bill-phone','Phone'],
    ['f-bill-line1','Street address'],
    ['f-bill-city','City'],
    ['f-bill-state','State'],
    ['f-bill-postal','ZIP'],
    ['f-bill-country','Country']
  ];
  for(var i=0;i<required.length;i++){
    var id=required[i][0], label=required[i][1];
    var el=document.getElementById(id);
    if(el && !el.value.trim()){
      BSRCheckout.fieldErr(id, label+' is required');
      err.textContent='Please fill in all required fields';
      err.style.display='block';
      el.focus();
      return false;
    }
  }
  var bEmail=BSRCheckout.val('f-bill-email');
  if(!BSRCheckout.emailOk(bEmail)){
    BSRCheckout.fieldErr('f-bill-email','Enter a valid email');
    err.textContent='Please fix the highlighted fields';
    err.style.display='block';
    return false;
  }
  return true;
}

function readBillAddr(){
  return {
    address1: BSRCheckout.val('f-bill-line1'),
    address2: BSRCheckout.val('f-bill-line2'),
    city: BSRCheckout.val('f-bill-city'),
    state: BSRCheckout.val('f-bill-state'),
    postal: BSRCheckout.val('f-bill-postal'),
    country: BSRCheckout.val('f-bill-country') || 'US'
  };
}

function writeBackBill(addr){
  if(!addr) return;
  var set=function(id, v){ if(v!==undefined) BSRCheckout.setV(id, v); };
  set('f-bill-line1', addr.address1); set('f-bill-line2', addr.address2);
  set('f-bill-city', addr.city); set('f-bill-state', addr.state);
  set('f-bill-postal', addr.postal || addr.zip); set('f-bill-country', addr.country);
}

function saveBillingAndGo(){
  var b={
    name: BSRCheckout.val('f-bill-name'),
    company: BSRCheckout.val('f-bill-company'),
    email: BSRCheckout.val('f-bill-email'),
    phone: BSRCheckout.cleanPhone(BSRCheckout.val('f-bill-phone')),
    address: readBillAddr()
  };
  try{ sessionStorage.setItem('bsr-billing', JSON.stringify(b)); }catch(e){}
  window.location.href='/checkout/shipping/';
}

document.getElementById('continue-to-shipping').addEventListener('click',function(){
  var btn=this;
  var err=document.getElementById('continue-err'); err.style.display='none';
  if(!cart.length){ err.textContent='Cart is empty'; err.style.display='block'; return; }
  if(!validateBillFields()){ return; }
  var resetBtn=function(){ btn.disabled=false; btn.innerHTML='Continue to shipping &rarr;'; };
  var billAddr=readBillAddr();
  // Always run our address validator and always show its confirmation
  // modal for every address — then navigate only after the modal decision.
  // Validator outages never block checkout.
  if (window.BSRAddrValidate && BSRAddrValidate.validate) {
    btn.disabled=true; btn.textContent='Validating address\u2026';
    BSRCheckout.runValidationFlow('bill', billAddr, { continueLabel: 'Continue to shipping \u2192' }, function(finalAddr){
      writeBackBill(finalAddr);
      resetBtn();
      saveBillingAndGo();
    }, resetBtn);
  } else {
    saveBillingAndGo();
  }
});
});
</script>
<div id="bsr-val-modal-root"></div></body>
</html>
