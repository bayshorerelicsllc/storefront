<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods9">
<link rel="preconnect" href="https://js.stripe.com">
<link rel="preload" href="https://js.stripe.com/v3/" as="script">
<script src="https://js.stripe.com/v3/" async></script>
<script src="/assets/js/bsr.js?v=acceptbadge1" defer></script>
<script src="/assets/js/addr-validate.js?v=20260925m"></script>
<style>
.addr-val-note { font-size:.88rem; color:var(--text-soft, #6b6353); margin:8px 0; }
.addr-val-ok { font-size:.88rem; color:#1e4d33; font-weight:600; margin:8px 0; }
.addr-val-suggest, .addr-val-warn { border:1px solid var(--line, #e2d9c3); border-radius:8px;
  padding:12px 14px; margin:10px 0; background:var(--bg, #fff); font-size:.9rem; }
.addr-val-warn { border-color:#b98a2f; background:#fdf6e8; }
.addr-val-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
<div class="page-head">
<h1>Checkout</h1>
<p>Each slide is a single physical item, sold once.</p>
</div>
<div id="checkout-root"></div>
</div>
</main>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: '' });
  var root = document.getElementById('checkout-root');
  var slugs = BSR.cart.list();
  if (!slugs.length) {
    root.innerHTML =
      '<div class="empty"><div class="empty-icon">' + BSR.icon('cart') + '</div>' +
      '<h2>Your cart is empty</h2>' +
      '<p>Add a slide to your cart before checking out.</p>' +
      '<a class="btn btn-primary" href="/shop/">Browse slides</a></div>';
    return;
  }

  var COUNTRIES = [
    ['US', 'United States'], ['CA', 'Canada'], ['GB', 'United Kingdom'], ['AU', 'Australia'],
    ['DE', 'Germany'], ['FR', 'France'], ['JP', 'Japan'], ['AT', 'Austria'], ['BE', 'Belgium'],
    ['BR', 'Brazil'], ['BG', 'Bulgaria'], ['HR', 'Croatia'], ['CY', 'Cyprus'], ['CZ', 'Czechia'],
    ['DK', 'Denmark'], ['EE', 'Estonia'], ['FI', 'Finland'], ['GR', 'Greece'], ['HU', 'Hungary'],
    ['IS', 'Iceland'], ['IE', 'Ireland'], ['IT', 'Italy'], ['LV', 'Latvia'], ['LI', 'Liechtenstein'],
    ['LT', 'Lithuania'], ['LU', 'Luxembourg'], ['MT', 'Malta'], ['MX', 'Mexico'], ['NL', 'Netherlands'],
    ['NZ', 'New Zealand'], ['NO', 'Norway'], ['PL', 'Poland'], ['PT', 'Portugal'], ['RO', 'Romania'],
    ['SG', 'Singapore'], ['SK', 'Slovakia'], ['SI', 'Slovenia'], ['KR', 'South Korea'], ['ES', 'Spain'],
    ['SE', 'Sweden'], ['CH', 'Switzerland'], ['TW', 'Taiwan'], ['UA', 'Ukraine'], ['IN', 'India'],
    ['IL', 'Israel'], ['ZA', 'South Africa'], ['AR', 'Argentina'], ['CL', 'Chile'], ['CO', 'Colombia'],
    ['PE', 'Peru'], ['TH', 'Thailand'], ['MY', 'Malaysia'], ['PH', 'Philippines'], ['HK', 'Hong Kong'],
    ['CN', 'China']
  ];

  function savedPromo() {
    try {
      var p = JSON.parse(sessionStorage.getItem('bsr-promo') || 'null');
      return (p && p.code) ? p : null;
    } catch (e) { return null; }
  }

  root.innerHTML =
    '<div class="checkout-layout">' +
    '<div class="checkout-main">' +
    '<section class="card" id="express-checkout-card"><h2>Express checkout</h2>' +
    '<p class="hint" style="margin-bottom:12px">Pay instantly — your wallet fills in shipping and billing.</p>' +
    '<div style="max-width:250px;margin:0 auto"><div id="pay-paypal-top"><div id="paypal-buttons"></div><div id="venmo-buttons" style="margin-top:8px"></div><div id="paylater-buttons" style="margin-top:8px"></div><div class="hint" id="paypal-msg"></div></div>' +
    '<div id="pay-wallets-top" style="margin-top:8px"><div id="express-checkout-element"><div id="wallets-loading" style="display:flex;gap:8px;justify-content:center;padding:12px;color:#8a7d5f;font-size:.85rem">Loading payment options…</div></div></div></div>' +
    '</section>' +
    '<div class="pay-divider" style="margin:4px 0 16px"><span>or</span></div>' +
    '<div style="margin-bottom:16px;max-width:250px;margin-left:auto;margin-right:auto">' +
    '<p class="hint" style="text-align:center;margin-bottom:10px">Prefer to pay with a credit or debit card? Click below to enter your card details securely.</p>' +
    '<button id="show-card-form" type="button" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:#1e4d33;color:#fff;border:none;border-radius:8px;height:44px;box-sizing:border-box;padding:0 14px;font-size:1.02rem;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(30,77,51,.35)"><span style="display:flex;align-items:center;gap:10px;white-space:nowrap"><img src="/assets/img/payments/stripe-mark.svg" alt="Stripe" style="height:26px;width:auto;border-radius:5px;flex-shrink:0"><span>Pay with credit or debit</span></span><span id="stripe-btn-price" style="font-weight:800;white-space:nowrap;flex-shrink:0">$0.00</span></button></div>' +
    '<div id="manual-form-wrap" style="display:none">' +
    '<section class="card"><h2><span class="step-num">1</span> Contact</h2>' +
    '<div class="field"><label for="f-email">Email</label>' +
    '<input type="email" id="f-email" name="email" autocomplete="bsr-no-autofill" placeholder="you@example.com">' +
    '<div class="error" id="e-email" style="display:none"></div></div></section>' +
    '<section class="card"><h2><span class="step-num">2</span> Billing address</h2>' +
    '<div id="bill-addr-picker"></div>' +
    
    '<div id="bill-fields" style="display:none">' +
    '<div class="field"><label for="f-bill-name">Billing name</label>' +
    '<input type="text" id="f-bill-name" name="name" autocomplete="cc-name">' +
    '<div class="error" id="e-bill-name" style="display:none"></div></div>' +
    '<div class="field"><label for="f-bill-company">Company <span class="opt">(optional)</span></label>' +
    '<input type="text" id="f-bill-company" name="company" autocomplete="organization"></div>' +
    '<div class="field"><label for="f-bill-line1">Address</label>' +
    '<input type="text" id="f-bill-line1" name="address1" autocomplete="billing street-address">' +
    '<div class="addr-validate-msg" id="bill-val-msg"></div>' +
    '<div class="error" id="e-bill-line1" style="display:none"></div></div>' +
    '<div class="form-row"><div class="field"><label for="f-bill-city">City</label>' +
    '<input type="text" id="f-bill-city" name="city" autocomplete="billing address-level2">' +
    '<div class="error" id="e-bill-city" style="display:none"></div></div>' +
    '<div class="field"><label for="f-bill-state">State / Province</label>' +
    '<input type="text" id="f-bill-state" name="state" autocomplete="billing address-level1">' +
    '<div class="error" id="e-bill-state" style="display:none"></div></div></div>' +
    '<div class="form-row"><div class="field"><label for="f-bill-postal">Postal code</label>' +
    '<input type="text" id="f-bill-postal" name="postal" autocomplete="billing postal-code">' +
    '<div class="error" id="e-bill-postal" style="display:none"></div></div>' +
    '<div class="field"><label for="f-bill-country">Country</label>' +
    '<select id="f-bill-country" name="country">' + COUNTRIES.map(function (cc) {
      return '<option value="' + cc[0] + '"' + (cc[0] === 'US' ? ' selected' : '') + '>' + BSR.esc(cc[1]) + '</option>';
    }).join('') + '</select></div></div>' +
    '<div class="form-row"><div class="field"><label for="f-bill-phone">Phone</label>' +
    '<input type="tel" id="f-bill-phone" name="phone" autocomplete="tel">' +
    '<div class="error" id="e-bill-phone" style="display:none"></div></div>' +
    '<div class="field"><label for="f-bill-email">Email <span class="opt">(optional)</span></label>' +
    '<input type="email" id="f-bill-email" name="email" autocomplete="email">' +
    '<div class="error" id="e-bill-email" style="display:none"></div></div></div>' +
    '</div></section>' +
'<section class="card"><h2><span class="step-num">3</span> Shipping address</h2>' +
    '<div class="field"><label class="mkt-toggle"><input type="checkbox" id="f-ship-same" checked>' +
    '<span>Same as billing address</span></label></div>' +
    '<div id="ship-fields">' +
    '<div id="ship-addr-picker"></div>' +
    '<div class="field"><label for="f-name">Full name</label>' +
    '<input type="text" id="f-name" name="name" autocomplete="name">' +
    '<div class="error" id="e-name" style="display:none"></div></div>' +
    '<div class="field"><label for="f-company">Company <span class="opt">(optional)</span></label>' +
    '<input type="text" id="f-company" name="company" autocomplete="organization">' +
    '</div>' +
    '<div class="form-row"><div class="field"><label for="f-ship-phone">Phone</label>' +
    '<input type="tel" id="f-ship-phone" name="phone" autocomplete="tel" placeholder="(555) 123-4567">' +
    '<div class="error" id="e-ship-phone" style="display:none"></div></div>' +
    '<div class="field"><label for="f-ship-email">Email for tracking <span class="opt">(optional)</span></label>' +
    '<input type="email" id="f-ship-email" name="email" autocomplete="email" placeholder="Leave blank to use contact email">' +
    '<div class="error" id="e-ship-email" style="display:none"></div>' +
    '<div class="hint">Order updates go here if different.</div></div></div>' +
    '<div class="field"><label for="f-line1">Address</label>' +
    '<input type="text" id="f-line1" name="address1" autocomplete="street-address">' +
    '<div class="addr-validate-msg" id="ship-val-msg"></div>' +
    '<div class="error" id="e-line1" style="display:none"></div></div>' +
    '<div class="form-row"><div class="field"><label for="f-city">City</label>' +
    '<input type="text" id="f-city" name="city" autocomplete="address-level2">' +
    '<div class="error" id="e-city" style="display:none"></div></div>' +
    '<div class="field"><label for="f-state">State / Province</label>' +
    '<input type="text" id="f-state" name="state" autocomplete="address-level1">' +
    '<div class="error" id="e-state" style="display:none"></div></div></div>' +
    '<div class="form-row"><div class="field"><label for="f-postal">Postal code</label>' +
    '<input type="text" id="f-postal" name="postal" autocomplete="postal-code">' +
    '<div class="error" id="e-postal" style="display:none"></div></div>' +
    '<div class="field"><label for="f-country">Country</label>' +
    '<select id="f-country" name="country">' + COUNTRIES.map(function (c) {
      return '<option value="' + c[0] + '"' + (c[0] === 'US' ? ' selected' : '') + '>' + BSR.esc(c[1]) + '</option>';
    }).join('') + '</select></div></div>' +
    '</div><div id="ship-method-wrap" style="margin-top:16px">' +
    '<button class="btn btn-secondary" id="ship-find" type="button" style="height:44px;box-sizing:border-box">Show shipping options</button>' +
    '<div class="error" id="e-ship" style="display:none;margin-top:8px"></div>' +
    '<div id="ship-options" style="margin-top:12px"></div></div></section>' +
    
    '<section class="card"><h2><span class="step-num">4</span> Promo code</h2>' +
    '<div class="promo-row"><input type="text" id="f-promo" class="field" placeholder="Promo code" aria-label="Promo code" value="' + BSR.esc(savedPromo() ? savedPromo().code : '') + '">' +
    '<button class="btn btn-secondary btn-sm" id="promo-apply" type="button" style="height:44px;box-sizing:border-box">Apply</button></div>' +
    '<div class="hint" id="promo-ok" style="display:none"></div>' +
    '<div class="error" id="promo-err" style="display:none"></div></section>' +
    '</div>' +
    '<section class="card" id="card-payment-section" style="display:none"><h2><span class="step-num">5</span> Payment</h2>' +
    '<div class="pay-divider" id="card-divider"><span>pay with card</span></div>' +
    '<div style="display:flex;gap:8px;margin-bottom:14px" role="tablist" aria-label="Card processor">' +
    '<button type="button" id="proc-stripe" class="proc-btn proc-active" style="flex:1;height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid #635BFF;border-radius:8px;background:#635BFF;color:#fff;font-weight:700;cursor:pointer"><img src="/assets/img/payments/stripe-mark.svg" alt="Stripe" style="height:22px;width:auto;border-radius:4px"><span>Card</span></button>' +
    '<button type="button" id="proc-paypal" class="proc-btn" style="flex:1;height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid #ddd;border-radius:8px;background:#003087;color:#fff;font-weight:700;cursor:pointer;opacity:0.55"><img src="/assets/img/payments/paypal.svg" alt="PayPal" style="height:16px;width:auto;filter:brightness(0) invert(1)"><span style="display:inline-flex;gap:4px;align-items:center;background:#fff;border-radius:4px;padding:3px 6px"><img src="/assets/img/payments/visa.svg" alt="Visa" style="height:10px;width:auto"><img src="/assets/img/payments/mastercard.svg" alt="Mastercard" style="height:11px;width:auto"><img src="/assets/img/payments/amex.svg" alt="Amex" style="height:10px;width:auto"><img src="/assets/img/payments/discover.svg" alt="Discover" style="height:10px;width:auto"></span></button>' +
    '</div>' +
    '<div id="pay-card-stripe"><div id="stripe-element"></div>' +
    '<div class="error" id="stripe-err" style="display:none"></div>' +
    '<button id="stripe-pay" type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;box-sizing:border-box;background:#635BFF;color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:1.02rem;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(99,91,255,.35)">Pay <span id="stripe-pay-amount" style="font-weight:800">$0.00</span></button></div>' +
    '<div id="pay-card-paypal" style="display:none">' +
    '<div class="field"><label>Card number</label><div id="pp-card-number" style="border:1px solid #ccc;border-radius:6px;padding:10px;min-height:20px"></div></div>' +
    '<div class="form-row"><div class="field"><label>Expiry</label><div id="pp-card-expiry" style="border:1px solid #ccc;border-radius:6px;padding:10px;min-height:20px"></div></div>' +
    '<div class="field"><label>Security code</label><div id="pp-card-cvv" style="border:1px solid #ccc;border-radius:6px;padding:10px;min-height:20px"></div></div></div>' +
    '<div class="error" id="pp-card-err" style="display:none"></div>' +
    '<button id="pp-card-pay" type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;box-sizing:border-box;background:#003087;color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:1.02rem;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,48,135,.35)">Pay with <span style="font-weight:800;letter-spacing:-.02em">PayPal</span></button></div>' +
    '<div class="secure-note">' + BSR.icon('lock', 'ic-sm') + '<span>Payments are encrypted. We never see your card number.</span></div>' +
    '</section></div>' +
    '<aside class="card summary"><h2>Order summary</h2>' +
    '<div class="cart-lines" id="sum-lines"></div>' +
    '<div id="sum-rows"></div></aside></div>';

  /* ---------- summary lines ---------- */
  var sumLines = document.getElementById('sum-lines');
  var sumRows = document.getElementById('sum-rows');
  var products = [];
  var pending = slugs.length;
  var stripeBreakdown = null;

  function renderTotals(breakdown) {
    var subtotal = products.reduce(function (a, p) { return a + (p.price_cents || 0); }, 0);
    var saved = savedPromo();
    var discount = saved ? (saved.discount_cents || 0) : 0;
    var html = '<div class="sum-row"><span>Subtotal</span><span>' + BSR.money(subtotal) + '</span></div>';
    if (discount) html += '<div class="sum-row"><span>Discount</span><span>−' + BSR.money(discount) + '</span></div>';
    if (breakdown) {
      if (breakdown.ship_cents != null) html += '<div class="sum-row"><span>Shipping</span><span>' + BSR.money(breakdown.ship_cents) + '</span></div>';
      if (breakdown.tax_cents != null) html += '<div class="sum-row"><span>Tax</span><span>' + BSR.money(breakdown.tax_cents) + '</span></div>';
      if (breakdown.total_cents != null) html += '<div class="sum-row total"><span>Total</span><span>' + BSR.money(breakdown.total_cents) + '</span></div>';
    } else {
      html += '<div class="sum-row"><span>Shipping &amp; tax</span><span>Calculated at payment</span></div>';
      html += '<div class="sum-row total"><span>Total</span><span>' + BSR.money(Math.max(0, subtotal - discount)) + '</span></div>';
    }
    sumRows.innerHTML = html;
    var priceEl = document.getElementById('stripe-btn-price');
    if (priceEl) {
      var total = breakdown && breakdown.total_cents != null ? breakdown.total_cents : Math.max(0, subtotal - discount);
      priceEl.textContent = BSR.money(total);
      var payAmt = document.getElementById('stripe-pay-amount');
      if (payAmt) payAmt.textContent = BSR.money(total);
    }
  }

  slugs.forEach(function (slug) {
    BSR.api('/api/catalog/products/' + encodeURIComponent(slug)).then(function (j) {
      products.push((j && j.ok && j.product) ? j.product : { slug: slug, title: slug, price_cents: 0, image: '' });
      if (--pending === 0) {
        products.sort(function (a, b) { return slugs.indexOf(a.slug) - slugs.indexOf(b.slug); });
        sumLines.innerHTML = products.map(function (p) {
          var img = p.image
            ? '<img src="' + BSR.esc(p.image) + '" alt="' + BSR.esc(p.title) + '" loading="lazy">'
            : '<div class="empty-icon">' + BSR.icon('box') + '</div>';
          return '<div class="cart-line"><a class="t" href="/product.html?slug=' + encodeURIComponent(p.slug) + '">' + img + '</a>' +
            '<div class="m"><div class="t">' + BSR.esc(p.title) + '</div><div class="hint">Qty 1</div></div>' +
            '<div class="p">' + BSR.money(p.price_cents) + '</div></div>';
        }).join('');
        renderTotals(stripeBreakdown);
      }
    });
  });

  /* ---------- promo ---------- */
  document.getElementById('promo-apply').addEventListener('click', function () {
    var code = document.getElementById('f-promo').value.trim();
    var okEl = document.getElementById('promo-ok');
    var errEl = document.getElementById('promo-err');
    okEl.style.display = 'none'; errEl.style.display = 'none';
    if (!code) { errEl.textContent = 'Enter a promo code.'; errEl.style.display = ''; return; }
    var subtotal = products.reduce(function (a, p) { return a + (p.price_cents || 0); }, 0);
    var btn = document.getElementById('promo-apply');
    btn.disabled = true; btn.textContent = 'Checking…';
    BSR.api('/api/catalog/discounts/validate', {
      method: 'POST',
      body: { code: code, subtotal_cents: subtotal, item_count: products.length }
    }).then(function (j) {
      btn.disabled = false; btn.textContent = 'Apply';
      if (j.ok) {
        try { sessionStorage.setItem('bsr-promo', JSON.stringify({ code: j.code, discount_cents: j.discount_cents, label: j.label || '' })); } catch (e) {}
        okEl.textContent = j.code + ' applied' + (j.label ? ' — ' + j.label : '') + '.';
        okEl.style.display = '';
        BSR.toast('Promo applied.');
        renderTotals(stripeBreakdown);
      } else {
        errEl.textContent = j.error || 'That code is not valid.';
        errEl.style.display = '';
      }
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Apply';
      errEl.textContent = 'Could not validate the code right now.';
      errEl.style.display = '';
    });
  });

  /* ---------- validation ---------- */
  /* Phone numbers are stored as plain digits (leading + kept for intl). */
  function cleanPhone(v) {
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';
    var plus = s.charAt(0) === '+' ? '+' : '';
    return (plus + s.replace(/\D/g, '')).slice(0, 41);
  }
  function setV(id, v) {
    var el = document.getElementById(id);
    if (el && v != null && v !== '') el.value = v;
  }
  function setSel(id, v) {
    var el = document.getElementById(id);
    if (el && v) el.value = v;
  }
  function addrLabel(a) {
    var street = [a.address1, a.address2].filter(Boolean).join(', ');
    var city = [a.city, a.state].filter(Boolean).join(', ');
    if (a.postal) city += (city ? ' ' : '') + a.postal;
    var loc = [street, city].filter(Boolean).join(', ');
    var who = ((a.nickname || '').trim()) || ((a.name || '').trim());
    return (who ? who + ' \u2014 ' : '') + loc;
  }
  function fillShipForm(a) {
    setV('f-name', a.name); setV('f-company', a.company);
    setV('f-ship-phone', a.phone); setV('f-ship-email', a.email);
    setV('f-line1', a.address1); setV('f-city', a.city);
    setV('f-state', a.state); setV('f-postal', a.postal);
    setSel('f-country', a.country || 'US');
  }
  function clearShipForm() {
    ['f-name', 'f-company', 'f-ship-phone', 'f-ship-email',
     'f-line1', 'f-city', 'f-state', 'f-postal'].forEach(function (id) {
      var el = document.getElementById(id); if (el) el.value = '';
    });
    setSel('f-country', 'US');
  }
  function fillBillForm(a) {
    setV('f-bill-name', a.name); setV('f-bill-company', a.company);
    setV('f-bill-line1', a.address1); setV('f-bill-city', a.city);
    setV('f-bill-state', a.state); setV('f-bill-postal', a.postal);
    setSel('f-bill-country', a.country || 'US');
    setV('f-bill-phone', a.phone); setV('f-bill-email', a.email);
  }
  function clearBillForm() {
    ['f-bill-name', 'f-bill-company', 'f-bill-line1', 'f-bill-city',
     'f-bill-state', 'f-bill-postal', 'f-bill-phone', 'f-bill-email'].forEach(function (id) {
      var el = document.getElementById(id); if (el) el.value = '';
    });
    setSel('f-bill-country', 'US');
  }
  /* Saved-address dropdowns on the ship-to and bill-to sections (signed-in only).
     Guests see no picker and get the blank form as before. */
  function initAddressPickers() {
    if (!window.BSR || !BSR.api) return;
    BSR.api('/api/account/addresses').then(function (j) {
      if (!(j && j.ok && Array.isArray(j.addresses) && j.addresses.length)) return;
      var list = j.addresses;

  function onExpressConfirm(event) {
    var errEl = document.getElementById('stripe-err');
    errEl.style.display = 'none';
    /* The wallet (Amazon Pay, PayPal, …) is the source of truth for the
       address: when it provides a complete shipping address it overrides
       anything typed in the form. Billing comes from the wallet too. */
    var wa = (event && event.shippingAddress) || {};
    var wAddr = wa.address || {};
    var ship = null, billing = null;
    if (wAddr.postal_code) {
      var wEmail = (event && event.payerEmail) || document.getElementById('f-email').value.trim();
      var wLine1 = ((wAddr.line1 || '') + (wAddr.line2 ? ' ' + wAddr.line2 : '')).trim();
      ship = {

          line1: wLine1,

          state: wAddr.state || '',
          postal: wAddr.postal_code || '',
          country: wAddr.country || 'US'
        },
        // Wallet flow: use default shipping rate (calculated server-side)
        rate_ref: null, provider: null, carrier: null, service: null,
        wallet_provided: true
      };
      var bd = (event && event.billingDetails) || {};
      var ba = bd.address || {};
      if (ba.postal_code || ba.line1) {
        billing = {
          name: bd.name || wa.name || '',
          email: bd.email || wEmail,
          phone: bd.phone || '',
          address: {
            line1: ((ba.line1 || '') + (ba.line2 ? ' ' + ba.line2 : '')).trim(),
            city: ba.city || '',
            state: ba.state || '',
            postal: ba.postal_code || '',
            country: ba.country || 'US'
          }
        };
      } else {
        // Wallet gave no billing address — ship-to doubles as bill-to
        billing = { name: ship.name, email: ship.email, phone: '',
                    address: ship.address, same_as_shipping: true };
      }
      if (window.BSR && BSR.toast) BSR.toast('Using the address from your wallet.', 'info');
    } else {
      /* No wallet address — no fallback to the form. A wallet payment without
         a wallet address is declined; the buyer checks out with a card or
         PayPal instead. */
      event.paymentFailed({ reason: 'fail' });
      errEl.textContent = 'Your wallet did not provide a shipping address. Please check out with a card or PayPal instead.';
      errEl.style.display = '';
      return;

    expressElements.submit().then(function (submitResult) {
      if (submitResult && submitResult.error) { event.paymentFailed({ reason: 'fail' }); return; }
      return BSR.api('/api/stripe/create-intent', {
        method: 'POST',
        body: { slugs: slugs, promo_code: promoCode(), shipping: ship, billing: billing }
      });

      if (!j || !j.ok) throw new Error((j && j.error) || 'Could not start the wallet payment.');
      stripeIntent = j;
      stripeBreakdown = j.breakdown || { total_cents: j.amount_cents };
      renderTotals(stripeBreakdown);
      return stripe.confirmPayment({
        elements: expressElements,
        clientSecret: j.client_secret,
        confirmParams: { return_url: window.location.origin + '/thank-you/' },
        redirect: 'if_required'
      });
    }).then(function (result) {
      var err = result && result.error;
      if (err) { event.paymentFailed({ reason: 'fail' }); return; }
      var pi = result && result.paymentIntent;
      if (pi && pi.status === 'succeeded') {
        event.paymentSucceeded();
        try { sessionStorage.setItem('bsr-last-order', stripeIntent.order_token || pi.id); } catch (e) {}
        finishOrder(stripeIntent.order_token || pi.id);
      } else {
        event.paymentFailed({ reason: 'fail' });
      }
    }).catch(function (e) {
      event.paymentFailed({ reason: 'fail' });
      errEl.textContent = (e && e.message) || 'The wallet payment failed.';
      errEl.style.display = '';

        tries++;
        if (window.Stripe) { clearInterval(iv); setup(); }
        else if (tries > 50) { clearInterval(iv); setPayEnabled('card', false, 'Card payments could not load — please try PayPal.'); }
      }, 100);
    }
  }
  /* ---------- Card processor toggle (Stripe / PayPal) ---------- */
  var cardProc = 'stripe';
  var stripeCard = { elements: null, intent: null, fingerprint: '' };
  var ppCardFields = null, ppCardRendered = false;
  function setCardProc(which) {
    cardProc = which;
    var sBtn = document.getElementById('proc-stripe');
    var pBtn = document.getElementById('proc-paypal');
    var sPane = document.getElementById('pay-card-stripe');
    var pPane = document.getElementById('pay-card-paypal');
    if (which === 'stripe') {
      sBtn.style.border = '2px solid #635BFF'; sBtn.style.opacity = '1';
      pBtn.style.border = '2px solid #ddd'; pBtn.style.opacity = '0.55';
      sPane.style.display = ''; pPane.style.display = 'none';
    } else {
      pBtn.style.border = '2px solid #003087'; pBtn.style.opacity = '1';
      sBtn.style.border = '2px solid #ddd'; sBtn.style.opacity = '0.55';
      pPane.style.display = ''; sPane.style.display = 'none';
      initPayPalCard();
    }
  }
  document.getElementById('proc-stripe').addEventListener('click', function () { setCardProc('stripe'); });
  document.getElementById('proc-paypal').addEventListener('click', function () { setCardProc('paypal'); });

  /* Fingerprint of the order state the PaymentIntent was built from. If the
     buyer changes shipping/promo after the element mounts, we rebuild. */
  function cardFingerprint(ship, billing) {
    return JSON.stringify({
      slugs: slugs.slice().sort(),
      promo: (promoCode() && promoCode().code) || '',
      rate: ship ? (ship.rate_ref || '') : '',
      bill: billing ? [billing.name, billing.address.line1, billing.address.postal].join('|') : ''
    });
  }
  function collectCardInputs() {
    var errEl = document.getElementById(cardProc === 'stripe' ? 'stripe-err' : 'pp-card-err');
    errEl.style.display = 'none';
    var billing = collectBilling();
    if (!billing) {
      errEl.textContent = 'Please complete the billing address above.';
      errEl.style.display = '';
      return null;
    }
    var ship = collectShipping(billing);
    if (!ship) {
      errEl.textContent = 'Please complete the shipping address and select a shipping option above.';
      errEl.style.display = '';
      document.getElementById('f-email').focus();
      return null;
    }
    return { ship: ship, billing: billing, errEl: errEl };
  }

  /* ---------- Stripe Payment Element (embedded card form) ----------
     Two-step: first click validates the form, creates the PaymentIntent and
     mounts the card form; second click confirms with the bill-to address
     attached for AVS. */
  function mountStripeElement(inputs, done) {
    var errEl = inputs.errEl;
    stripeCard.fingerprint = cardFingerprint(inputs.ship, inputs.billing);
    BSR.api('/api/stripe/create-intent', {
      method: 'POST',
      body: { slugs: slugs, promo_code: promoCode(), shipping: inputs.ship, billing: inputs.billing }
    }).then(function (j) {
      if (!j.ok || !j.client_secret) throw new Error((j && j.error) || 'Could not start the card payment.');
      stripeCard.intent = j;
      stripeCard.billing = inputs.billing;
      if (!stripe) throw new Error('Card payments are still loading — please wait a moment and try again.');
      stripeCard.elements = stripe.elements({ clientSecret: j.client_secret });
      stripeCard.elements.create('payment').mount('#stripe-element');
      stripeMounted = true;
      if (done) done();
    }).catch(function (e) {
      errEl.textContent = e.message || 'The card payment failed to load.';
      errEl.style.display = '';
      var btn = document.getElementById('stripe-pay');
      btn.disabled = false; btn.innerHTML = 'Pay with <span style="font-weight:800;letter-spacing:-.02em">Stripe</span>';
    });
  }
  function onStripePay() {
    var btn = document.getElementById('stripe-pay');
    var errEl = document.getElementById('stripe-err');
    if (!stripe) {
      if (errEl) { errEl.textContent = 'Card payments are still loading — please wait a moment and try again.'; errEl.style.display = ''; }
      return;
    }
    /* Step 2: card form is mounted — confirm the payment. */
    if (stripeCard.elements && stripeCard.intent) {
      /* If the form changed since the intent was built, rebuild first. */
      var chk = collectCardInputs();
      if (!chk) { btn.disabled = false; btn.textContent = 'Confirm payment'; return; }
      if (cardFingerprint(chk.ship, chk.billing) !== stripeCard.fingerprint) {
        btn.textContent = 'Updating…';
        document.getElementById('stripe-element').innerHTML = '';
        stripeCard.elements = null; stripeCard.intent = null;
        mountStripeElement(chk, function () {
          btn.disabled = false; btn.textContent = 'Confirm payment';
        });
        return;
      }
      var bd = stripeCard.billing;
      btn.disabled = true; btn.textContent = 'Processing…';
      stripe.confirmPayment({
        elements: stripeCard.elements,
        clientSecret: stripeCard.intent.client_secret,
        redirect: 'if_required',
        confirmParams: {
          return_url: 'https://bayshorerelicsllc.com/thank-you/?order_token=' + encodeURIComponent(stripeCard.intent.order_token),
          payment_method_data: {
            billing_details: {
              name: bd.name || '',
              email: document.getElementById('f-email').value.trim(),
              phone: bd.phone || '',
              address: {
                line1: bd.address.line1 || '',
                city: bd.address.city || '',
                state: bd.address.state || '',
                postal_code: bd.address.postal || '',
                country: bd.address.country || 'US'
              }
            }
          }
        }
      }).then(function (result) {
        var errEl = document.getElementById('stripe-err');
        if (result.error) throw new Error(result.error.message || 'The card payment failed.');
        var pi = result.paymentIntent;
        if (pi && pi.status === 'succeeded') {
          finishOrder(stripeCard.intent.order_token);
        } else {
          errEl.textContent = 'Payment is processing — please wait…';
          errEl.style.display = '';
          setTimeout(function () { finishOrder(stripeCard.intent.order_token); }, 4000);
        }
      }).catch(function (e) {
        var errEl = document.getElementById('stripe-err');
        errEl.textContent = e.message || 'The card payment failed.';
        errEl.style.display = '';
        btn.disabled = false; btn.textContent = 'Confirm payment';
      });
      return;
    }
    /* Step 1: validate the form, create the intent, mount the card form. */
    var inputs = collectCardInputs();
    if (!inputs) return;
    btn.disabled = true; btn.textContent = 'Loading secure card form…';
    mountStripeElement(inputs, function () {
      btn.disabled = false; btn.textContent = 'Confirm payment';
      document.getElementById('stripe-element').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  /* ---------- PayPal Card Fields (embedded card form) ---------- */
  function initPayPalCard() {
    if (ppCardRendered) return;
    if (!window.paypal || !paypal.CardFields) {
      var errEl = document.getElementById('pp-card-err');
      errEl.textContent = 'PayPal is still loading — please wait a moment and try again.';
      errEl.style.display = '';
      return;
    }
    try {
      ppCardFields = paypal.CardFields({
        createOrder: function () {
          var inputs = collectCardInputs();
          if (!inputs) throw new Error('Please complete the addresses above.');
          return BSR.api('/api/checkout/create', {
            method: 'POST',
            body: { slugs: slugs, promo_code: promoCode(), shipping: inputs.ship, billing: inputs.billing }
          }).then(function (j) {
            if (!j.ok || !j.orderID) throw new Error(j.error || 'Could not create the PayPal order.');
            return j.orderID;
          });
        },
        onApprove: function (data) {
          return BSR.api('/api/checkout/capture', {
            method: 'POST',
            body: { orderID: data.orderID }
          }).then(function (j) {
            if (j.ok) { finishOrder(data.orderID); }
            else {
              var errEl = document.getElementById('pp-card-err');
              errEl.textContent = j.error || 'Payment could not be captured.';
              errEl.style.display = '';
            }
          });
        },
        onError: function (err) {
          var errEl = document.getElementById('pp-card-err');
          errEl.textContent = (err && err.message) || 'The PayPal card payment failed.';
          errEl.style.display = '';
          var btn = document.getElementById('pp-card-pay');
          btn.disabled = false; btn.innerHTML = 'Pay with <span style="font-weight:800;letter-spacing:-.02em">PayPal</span>';
        }
      });
      if (!ppCardFields.isEligible()) {
        document.getElementById('pp-card-err').textContent = 'Card payments via PayPal are not available — please use Stripe.';
        document.getElementById('pp-card-err').style.display = '';
        return;
      }
      ppCardFields.NumberField().render('#pp-card-number');
      ppCardFields.ExpiryField().render('#pp-card-expiry');
      ppCardFields.CVVField().render('#pp-card-cvv');
      ppCardRendered = true;
    } catch (e) {
      var errEl = document.getElementById('pp-card-err');
      errEl.textContent = 'PayPal card fields could not load — please use Stripe.';
      errEl.style.display = '';
    }
  }
  document.getElementById('pp-card-pay').addEventListener('click', function () {
    var inputs = collectCardInputs();
    if (!inputs) return;
    if (!ppCardFields) {
      initPayPalCard();
      if (!ppCardFields) return;
    }
    var errEl = inputs.errEl;
    var btn = document.getElementById('pp-card-pay');
    btn.disabled = true; btn.textContent = 'Processing…';
    var b = inputs.billing;
    ppCardFields.submit({
      billingAddress: {
        addressLine1: b.address.line1 || '',
        addressLine2: '',
        adminArea2: b.address.city || '',
        adminArea1: b.address.state || '',
        postalCode: b.address.postal || '',
        countryCode: b.address.country || 'US'
      }
    }).catch(function (e) {
      errEl.textContent = (e && e.message) || 'The PayPal card payment failed.';
      errEl.style.display = '';
      btn.disabled = false; btn.innerHTML = 'Pay with <span style="font-weight:800;letter-spacing:-.02em">PayPal</span>';
    });
  });
});
</script>
</body>
