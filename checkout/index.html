<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods9">
<script src="/assets/js/bsr.js?v=acceptbadge1" defer></script>
<style>
.checkout-layout { display: grid !important; grid-template-columns: minmax(0,1fr) 300px !important; gap: 24px !important; }
@media (max-width: 900px) {
  .checkout-layout { grid-template-columns: minmax(0,1fr) 300px !important; }
}
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
<div class="page-head">
<h1>Checkout</h1>
<p>Each slide is a single physical item, sold once.</p>
</div>

<div class="checkout-layout">
<div class="checkout-main">
<section class="card">
<h2><span class="step-num">1</span> Contact</h2>
<div class="field"><label for="f-email">Email</label><input type="email" id="f-email" class="input"></div>
<div class="field"><label for="f-name">Full name</label><input type="text" id="f-name" class="input"></div>
<div class="field"><label for="f-phone">Phone</label><input type="tel" id="f-phone" class="input"></div>
</section>

<section class="card">
<h2><span class="step-num">2</span> Billing address</h2>
<div class="field"><label for="f-bill-name">Full name</label><input type="text" id="f-bill-name" class="input"></div>
<div class="field"><label for="f-bill-line1">Street address</label><input type="text" id="f-bill-line1" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-bill-city">City</label><input type="text" id="f-bill-city" class="input"></div>
<div class="field"><label for="f-bill-state">State</label><input type="text" id="f-bill-state" class="input"></div>
</div>
<div class="field-row">
<div class="field"><label for="f-bill-postal">ZIP</label><input type="text" id="f-bill-postal" class="input"></div>
<div class="field"><label for="f-bill-country">Country</label><input type="text" id="f-bill-country" class="input" value="US"></div>
</div>
</section>

<section class="card">
<h2><span class="step-num">3</span> Shipping address</h2>
<div class="field"><label><input type="checkbox" id="f-ship-same" checked> Same as billing</label></div>
<div id="ship-fields" style="display:none">
<div class="field"><label for="f-line1">Street address</label><input type="text" id="f-line1" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-city">City</label><input type="text" id="f-city" class="input"></div>
<div class="field"><label for="f-state">State</label><input type="text" id="f-state" class="input"></div>
</div>
<div class="field-row">
<div class="field"><label for="f-postal">ZIP</label><input type="text" id="f-postal" class="input"></div>
<div class="field"><label for="f-country">Country</label><input type="text" id="f-country" class="input" value="US"></div>
</div>
</div>
</section>

<section class="card" style="text-align:center">
<button type="button" id="continue-to-payment" class="btn btn-primary" style="width:100%;padding:16px;font-size:1.1rem">Continue to payment →</button>
<div class="error" id="continue-err" style="display:none;color:#c00;margin-top:10px"></div>
</section>
</div>

<aside class="card summary">
<h2>Order summary</h2>
<div id="sum-lines"></div>
<div id="sum-rows"></div>
<div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)">
<span>Total</span><span id="sum-total">$0.00</span>
</div>
</aside>
</div>

</div>
</main>
<div id="bsr-footer"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
if (window.BSR && BSR.init) BSR.init();
var cart=[]; try{cart=JSON.parse(localStorage.getItem('bsr-cart')||'[]');}catch(e){}
var html='',t=0;
cart.forEach(function(i){var p=parseFloat(i.price||0);t+=p;html+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>'+(i.title||i.slug)+'</span><span>$'+p.toFixed(2)+'</span></div>';});
document.getElementById('sum-lines').innerHTML=html||'<p>Cart empty</p>';
document.getElementById('sum-total').textContent='$'+t.toFixed(2);
document.getElementById('f-ship-same').addEventListener('change',function(){document.getElementById('ship-fields').style.display=this.checked?'none':'block';});
document.getElementById('continue-to-payment').addEventListener('click',function(){
var err=document.getElementById('continue-err');err.style.display='none';
if(!cart.length){err.textContent='Cart is empty';err.style.display='block';return;}
var email=document.getElementById('f-email').value.trim();
if(!email){err.textContent='Enter email';err.style.display='block';return;}
var same=document.getElementById('f-ship-same').checked;
var p={slugs:cart.map(function(i){return i.slug;}),email:email,name:document.getElementById('f-name').value,phone:document.getElementById('f-phone').value,
bill:{name:document.getElementById('f-bill-name').value,street:document.getElementById('f-bill-line1').value,city:document.getElementById('f-bill-city').value,state:document.getElementById('f-bill-state').value,zip:document.getElementById('f-bill-postal').value,country:document.getElementById('f-bill-country').value},
ship:null};
if(same){p.ship=p.bill;}else{p.ship={street:document.getElementById('f-line1').value,city:document.getElementById('f-city').value,state:document.getElementById('f-state').value,zip:document.getElementById('f-postal').value,country:document.getElementById('f-country').value};}
sessionStorage.setItem('bsr-checkout-payload',JSON.stringify(p));
location.href='/checkout/payment/';
});
});
</script>
</body>
</html>
