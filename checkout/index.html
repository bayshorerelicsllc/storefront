<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Bay Shore Relics LLC</title>
<link rel="stylesheet" href="/assets/css/theme.css">
<script src="/assets/js/bsr.js" defer></script>

<style>
.checkout-grid { display: grid; grid-template-columns: 1fr 360px; gap: 30px; align-items: start; }
@media (max-width: 800px) { .checkout-grid { grid-template-columns: 1fr; } }
.field { margin: 10px 0; }
.field label { display: block; margin-bottom: 4px; font-weight: 600; }
.field input, .field select { width: 100%; padding: 10px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="bsr-header"></div>
<div class="wrap"><div class="page-head"><h1>Checkout</h1><p>Each slide is a single physical item, sold once.</p></div>
<h1>Checkout</h1>
<div class="checkout-grid">
<div>
<div class="card"><h2>1. Contact</h2>
<label>Email <input type="email" id="email"></label>
<label>Name <input type="text" id="name"></label>
<label>Phone <input type="tel" id="phone"></label>
</div>
<div class="card"><h2>2. Billing Address</h2>
<label>Name <input type="text" id="b_name"></label>
<label>Street <input type="text" id="b_street"></label>
<div class="row2"><label>City <input type="text" id="b_city"></label><label>State <input type="text" id="b_state"></label></div>
<div class="row2"><label>ZIP <input type="text" id="b_zip"></label><label>Country <input type="text" id="b_country" value="US"></label></div>
</div>
<div class="card"><h2>3. Shipping Address</h2>
<label><input type="checkbox" id="same" checked style="width:auto"> Same as billing</label>
<div id="sfields" style="display:none">
<label>Street <input type="text" id="s_street"></label>
<div class="row2"><label>City <input type="text" id="s_city"></label><label>State <input type="text" id="s_state"></label></div>
<div class="row2"><label>ZIP <input type="text" id="s_zip"></label><label>Country <input type="text" id="s_country" value="US"></label></div>
</div>
</div>
<div class="card"><button class="btn btn-primary" id="go" style="width:100%">Continue to payment →</button><p id="err" style="color:red"></p></div>
</div>
<div><div class="card summary"><h2>Order Summary</h2><div id="lines"></div><div class="total"><span>Total</span><span id="tot">$0.00</span></div></div></div>
</div>
</div>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function() {
if (window.BSR && BSR.init) BSR.init();
var cart=[]; try{cart=JSON.parse(localStorage.getItem('bsr-cart')||'[]');}catch(e){}
var html='',t=0;
cart.forEach(function(i){var p=parseFloat(i.price||0);t+=p;html+='<div class="line"><span>'+(i.title||i.slug)+'</span><span>$'+p.toFixed(2)+'</span></div>';});
document.getElementById('lines').innerHTML=html||'<p>Cart empty</p>';
document.getElementById('tot').textContent='$'+t.toFixed(2);
document.getElementById('same').onchange=function(){document.getElementById('sfields').style.display=this.checked?'none':'block';};
document.getElementById('go').onclick=function(){
if(!cart.length){document.getElementById('err').textContent='Cart is empty';return;}
var email=document.getElementById('email').value.trim();
if(!email){document.getElementById('err').textContent='Enter email';return;}
var same=document.getElementById('same').checked;
var p={slugs:cart.map(function(i){return i.slug;}),email:email,name:document.getElementById('name').value,phone:document.getElementById('phone').value,
bill:{name:document.getElementById('b_name').value,street:document.getElementById('b_street').value,city:document.getElementById('b_city').value,state:document.getElementById('b_state').value,zip:document.getElementById('b_zip').value,country:document.getElementById('b_country').value},
ship:same?null:{street:document.getElementById('s_street').value,city:document.getElementById('s_city').value,state:document.getElementById('s_state').value,zip:document.getElementById('s_zip').value,country:document.getElementById('s_country').value}};
if(same){p.ship=p.bill;}
sessionStorage.setItem('bsr-checkout-payload',JSON.stringify(p));
location.href='/checkout/payment/';
};
});
</script>
</body>
</html>
