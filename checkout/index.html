<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods9">
<script src="/assets/js/bsr.js?v=acceptbadge1" defer></script>
<script src="/assets/js/addr-validate.js?v=20260925m" defer></script>

<style>
.bsr-val-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow-y:auto;}
.bsr-val-modal{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:24px;box-shadow:0 12px 48px rgba(0,0,0,0.35);box-sizing:border-box;margin:auto;position:relative;}
.bsr-val-modal h3{margin:0 0 8px 0;font-size:1.2rem;color:#1a3c22;}
.bsr-val-modal .val-kind{display:inline-block;background:#1a3c22;color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px;}
.bsr-val-modal .val-addr{background:#f8f6f0;border:1px solid #e0dccf;border-radius:8px;padding:12px;margin:12px 0;font-size:14px;line-height:1.5;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;}
.bsr-val-modal .val-actions{display:flex;gap:10px;margin-top:16px;}
.bsr-val-modal .val-actions button{flex:1;padding:12px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;border:none;}
.bsr-val-modal .val-use{background:#1a3c22;color:#fff;}
.bsr-val-modal .val-keep{background:#f0f0f0;color:#333;}
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
<div class="page-head">
<h1>Checkout</h1>
<p>Each slide is a single physical item, sold once.</p>
</div>

<div class="checkout-layout">
<div class="checkout-main">
<section class="card" id="bill-section">
<h2><span class="step-num">1</span> Billing address</h2>
<div id="bill-addr-picker"></div>
<div class="addr-validate-msg" id="bill-val-msg"></div>
<div class="field"><label for="f-bill-name">Full name</label><input type="text" id="f-bill-name" class="input" required></div>
<div class="field"><label for="f-bill-company">Company</label><input type="text" id="f-bill-company" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-bill-email">Email</label><input type="email" id="f-bill-email" class="input" required></div>
<div class="field"><label for="f-bill-phone">Phone</label><input type="tel" id="f-bill-phone" class="input" required></div>
</div>
<div class="field"><label for="f-bill-line1">Street address</label><input type="text" id="f-bill-line1" name="address1" class="input" required></div>
<div class="field"><label for="f-bill-line2">Address line 2</label><input type="text" id="f-bill-line2" name="address2" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-bill-city">City</label><input type="text" id="f-bill-city" name="city" class="input" required></div>
<div class="field"><label for="f-bill-state">State</label><input type="text" id="f-bill-state" name="state" class="input" required></div>
</div>
<div class="field-row">
<div class="field"><label for="f-bill-postal">ZIP</label><input type="text" id="f-bill-postal" name="postal" class="input" required></div>
<div class="field"><label for="f-bill-country">Country</label><input type="text" id="f-bill-country" name="country" class="input" value="US" required></div>
</div>
</section>

<section class="card" id="ship-section">
<h2><span class="step-num">2</span> Shipping address</h2>
<div id="ship-addr-picker"></div>
<div class="addr-validate-msg" id="ship-val-msg"></div>
<div class="field"><label><input type="checkbox" id="f-ship-same" checked> Same as billing</label></div>
<div id="ship-fields" style="display:none">
<div class="field"><label for="f-ship-name">Full name</label><input type="text" id="f-ship-name" class="input" data-ship-req></div>
<div class="field"><label for="f-ship-company">Company</label><input type="text" id="f-ship-company" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-ship-email">Email</label><input type="email" id="f-ship-email" class="input" data-ship-req></div>
<div class="field"><label for="f-ship-phone">Phone</label><input type="tel" id="f-ship-phone" class="input" data-ship-req></div>
</div>
<div class="field"><label for="f-line1">Street address</label><input type="text" id="f-line1" name="address1" class="input" data-ship-req></div>
<div class="field"><label for="f-line2">Address line 2</label><input type="text" id="f-line2" name="address2" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-city">City</label><input type="text" id="f-city" name="city" class="input" data-ship-req></div>
<div class="field"><label for="f-state">State</label><input type="text" id="f-state" name="state" class="input" data-ship-req></div>
</div>
<div class="field-row">
<div class="field"><label for="f-postal">ZIP</label><input type="text" id="f-postal" name="postal" class="input" data-ship-req></div>
<div class="field"><label for="f-country">Country</label><input type="text" id="f-country" name="country" class="input" value="US" data-ship-req></div>
</div>
</div>
</section>

<section class="card" style="text-align:center">
<button type="button" id="continue-to-payment" class="btn btn-primary" style="width:100%;padding:16px;font-size:1.1rem">Continue to payment →</button>
<div class="error" id="continue-err" style="display:none;color:#c00;margin-top:10px"></div>
</section>
</div>

<aside class="card summary">
<h2>Order summary</h2>
<div id="sum-lines"></div>
<div id="sum-rows"></div>
<div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)">
<span>Total</span><span id="sum-total">$0.00</span>
</div>
</aside>
</div>

</div>
</main>
<div id="bsr-footer"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
if (window.BSR && BSR.init) BSR.init();
// Retry address pickers until BSR.api is ready (up to 5s)
var _addrTries = 0;
var _addrTimer = setInterval(function(){
  _addrTries++;
  if ((window.BSR && BSR.api) || _addrTries > 25) {
    clearInterval(_addrTimer);
    try { initAddressPickers(); } catch(e) {}
  }
}, 200);
// Address validator: Geoapify live suggestions (same as account address book)
var _valTries = 0;
var _valTimer = setInterval(function(){
  _valTries++;
  if ((window.BSRAddrValidate && BSRAddrValidate.attachLive) || _valTries > 25) {
    clearInterval(_valTimer);
    try {
      var billSec = document.getElementById('bill-section');
      var shipSec = document.getElementById('ship-section');
      if (window.BSRAddrValidate && BSRAddrValidate.attachLive) {
        if (billSec) BSRAddrValidate.attachLive(billSec);
        if (shipSec) BSRAddrValidate.attachLive(shipSec);
      }
    } catch(e) {}
  }
}, 200);
var cart=[]; try{cart=(window.BSR&&BSR.cart)?BSR.cart.list():JSON.parse(localStorage.getItem('bsr-cart-v1')||'[]');}catch(e){}
var sumLines=document.getElementById('sum-lines');
sumLines.innerHTML='<p>Loading…</p>';
(function(){
  if(!cart.length){sumLines.innerHTML='<p>Cart empty</p>';document.getElementById('sum-total').textContent='$0.00';return;}
  // Fetch all products once, then match by slug
  BSR.api('/api/catalog/products').then(function(j){
    var all=(j&&j.ok&&j.products)?j.products:[];
    var bySlug={};
    all.forEach(function(p){bySlug[p.slug]=p;});
    var t=0,html='';
    cart.forEach(function(slug){
      var p=bySlug[slug]||{slug:slug,title:slug,price_cents:0,image:''};
      var cents=p.price_cents||0;t+=cents;
      var img=p.image?'<img src="'+BSR.esc(p.image)+'" alt="'+BSR.esc(p.title||p.slug)+'" style="width:60px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0;">':'<div style="width:60px;height:60px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#999;">No image</div>';
      html+='<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eee;align-items:center;">'+img+
        '<div style="flex:1;min-width:0;"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+BSR.esc(p.title||p.slug)+'</div>'+
        '<div style="font-size:12px;color:#666;">Qty 1 · '+BSR.esc(p.slug)+'</div></div>'+
        '<div style="font-weight:600;white-space:nowrap;">'+BSR.money(cents)+'</div></div>';
    });
    sumLines.innerHTML=html;
    document.getElementById('sum-total').textContent=BSR.money(t);
  }).catch(function(){
    // Fallback: show slugs only
    var html=cart.map(function(slug){
      return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>'+BSR.esc(slug)+'</span><span>—</span></div>';
    }).join('');
    sumLines.innerHTML=html;
  });
})();
document.getElementById('f-ship-same').addEventListener('change',function(){document.getElementById('ship-fields').style.display=this.checked?'none':'block';});


function cleanPhone(v){
  var s=String(v==null?'':v).trim();
  if(!s) return '';
  var plus=s.charAt(0)==='+'?'+':'';
  return (plus+s.replace(/\D/g,'')).slice(0,41);
}
function fieldErr(inputId, msg){
  var input=document.getElementById(inputId);
  if(!input) return;
  var errId='e-'+inputId;
  var errEl=document.getElementById(errId);
  if(!errEl){
    errEl=document.createElement('div');
    errEl.id=errId;
    errEl.className='field-error';
    errEl.style.cssText='color:#c00;font-size:12px;margin-top:4px;display:none;';
    input.parentNode.appendChild(errEl);
  }
  if(msg){
    errEl.textContent=msg;
    errEl.style.display='block';
    input.style.borderColor='#c00';
  } else {
    errEl.style.display='none';
    input.style.borderColor='';
  }
}
function clearAllFieldErrs(){
  var errs=document.querySelectorAll('.field-error');
  for(var i=0;i<errs.length;i++) errs[i].style.display='none';
  var inputs=document.querySelectorAll('#bill-section input, #ship-section input');
  for(var j=0;j<inputs.length;j++) inputs[j].style.borderColor='';
}


function unitAlreadyInAddress(suggUnit, origAddr1, origAddr2){
  // Smarter check: extract the unit identifier (number/letter combo) from the
  // suggested unit and see if it appears as a standalone token in the original
  // address. Handles "Apt 4" vs "#4", "Suite 200" vs "Ste 200", etc.
  if(!suggUnit) return false;
  var origFull=((origAddr1||'')+' '+(origAddr2||'')).toLowerCase();
  var suggLower=suggUnit.toLowerCase().trim();
  // First try: exact match (case-insensitive)
  if(origFull.indexOf(suggLower)!==-1) return true;
  // Second try: extract the unit identifier (alphanumeric token at the end)
  // e.g. "PMB 116" -> "116", "Apt 4B" -> "4b", "Suite 200" -> "200"
  var m=suggLower.match(/([a-z]*\d+[a-z]*|\d+)\s*$/);
  if(m){
    var unitId=m[1]||m[0];
    // Check with word boundaries to avoid false positives (e.g. "4" in "1234")
    var re=new RegExp('\\b'+unitId.replace(/[^a-z0-9]/g,'')+'\\b');
    if(re.test(origFull)) return true;
  }
  return false;
}

function showWarningPopup(results, warnings, onDone){
  // results: all [{kind, original, ...}], warnings: [{kind, message}, ...]
  var root=document.getElementById('bsr-val-modal-root');
  var fmtAddr=function(a){
    var lines=[];
    if(a.address1||a.street) lines.push(a.address1||a.street);
    if(a.address2||a.street2) lines.push(a.address2||a.street2);
    var csz='';
    if(a.city&&a.state) csz=a.city+', '+a.state+' '+(a.postal||a.zip||'');
    else csz=[a.city||'',a.state||'',a.postal||a.zip||''].filter(Boolean).join(' ');
    if(csz) lines.push(csz);
    if(a.country) lines.push(a.country);
    return lines.join('<br>');
  };
  var warnByKind={};
  warnings.forEach(function(w){warnByKind[w.kind]=w.message;});
  // Check if billing and shipping are identical
  var billRes=results.find(function(r){return r.kind==='bill';});
  var shipRes=results.find(function(r){return r.kind==='ship';});
  var identical=false;
  if(billRes&&shipRes){
    var b=billRes.original,s=shipRes.original;
    identical=(b.address1===s.address1&&(b.address2||'')===(s.address2||'')&&b.city===s.city&&b.state===s.state&&(b.postal||b.zip)===(s.postal||s.zip));
  }
  var cols='';
  if(identical&&billRes){
    // Single consolidated view with both labels
    var warnMsg=warnByKind['bill']||warnByKind['ship']||'';
    var warnHtml=warnMsg?'<div style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:12px;font-size:14px;color:#856404;margin:8px 0;">'+
      '<strong>⚠ Heads up:</strong> '+warnMsg+'</div>':'';
    cols='<div class="val-col" style="flex:1;">'+
      '<div><span class="val-kind">Bill to</span> <span class="val-kind">Ship to</span></div>'+
      '<div class="val-addr" style="margin:8px 0;">'+fmtAddr(billRes.original)+'</div>'+
      warnHtml+'</div>';
  } else {
    cols=results.map(function(r){
      var kindLabel=r.kind==='bill'?'Bill to':'Ship to';
      var warnHtml='';
      if(warnByKind[r.kind]){
        warnHtml='<div style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:12px;font-size:14px;color:#856404;margin:8px 0;">'+
        '<strong>⚠ Heads up:</strong> '+warnByKind[r.kind]+'</div>';
      }
      return '<div class="val-col" style="flex:1;min-width:220px;">'+
      '<div class="val-kind">'+kindLabel+'</div>'+
      '<div class="val-addr" style="margin:8px 0;">'+fmtAddr(r.original)+'</div>'+
      warnHtml+'</div>';
    }).join('');
  }
  root.innerHTML=
    '<div class="bsr-val-modal-overlay" id="warn-overlay">'+
    '<div class="bsr-val-modal" style="max-width:720px;position:relative;">'+
    '<button type="button" id="warn-close-btn" style="position:absolute;top:12px;right:12px;background:none;border:none;font-size:24px;cursor:pointer;color:#666;line-height:1;">&times;</button>'+
    '<h3>Address issue'+(warnings.length>1?'s':'')+'</h3>'+
    '<div style="display:flex;gap:16px;flex-wrap:wrap;">'+cols+'</div>'+
    '<div class="val-actions" style="margin-top:16px;">'+
    '<button type="button" class="val-use" id="warn-ok-btn" style="width:100%;">I understand</button>'+
    '</div></div></div>';
  var closeWarn=function(){root.innerHTML='';resetBtn();};
  document.getElementById('warn-close-btn').addEventListener('click',closeWarn);
  document.getElementById('warn-overlay').addEventListener('click',function(e){
    if(e.target.id==='warn-overlay') closeWarn();
  });
  document.getElementById('warn-ok-btn').addEventListener('click',function(){
    root.innerHTML='';onDone();
  });
}

function showValidationModal(results, onDone){
  var root=document.getElementById('bsr-val-modal-root');
  var fmtAddr=function(a){
    var lines=[];
    if(a.address1||a.street) lines.push(a.address1||a.street);
    if(a.address2||a.street2) lines.push(a.address2||a.street2);
    var csz=[a.city||'',a.state||'',a.postal||a.zip||''].filter(Boolean).join(' ').trim();
    if(a.city&&a.state) csz=a.city+', '+a.state+' '+(a.postal||a.zip||'');
    if(csz) lines.push(csz);
    if(a.country) lines.push(a.country);
    return lines.join('<br>');
  };
  var billR=results.find(function(r){return r.kind==='bill';});
  var shipR=results.find(function(r){return r.kind==='ship';});
  var sameAddr=false;
  if(billR&&shipR){
    var bb=billR.original,ss=shipR.original;
    sameAddr=(bb.address1===ss.address1&&(bb.address2||'')===(ss.address2||'')&&bb.city===ss.city&&bb.state===ss.state&&(bb.postal||bb.zip)===(ss.postal||ss.zip));
  }
  var displayResults=sameAddr?[billR]:results;
  // Simple flex layout: two equal columns, each with stacked content
  // Use flexbox with stretch to keep boxes aligned
  var isMobile=window.innerWidth<600;
  var cols=displayResults.map(function(r, idx){
    var kindLabel;
    if(sameAddr){kindLabel='<span class="val-kind">Bill to</span> <span class="val-kind">Ship to</span>';}
    else{kindLabel='<span class="val-kind">'+(r.kind==='bill'?'Bill to':'Ship to')+'</span>';}
    var unitWarning='';
    var suggUnit=(r.suggested&&r.suggested.address2?r.suggested.address2:'').trim();
    var unitInOrig=unitAlreadyInAddress(suggUnit, r.original.address1||r.original.street, r.original.address2||r.original.street2);
    if(r.suggested&&suggUnit&&!unitInOrig){
      unitWarning='<div class="val-warn" style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:10px;margin:0 0 12px 0;font-size:13px;color:#856404;">'+
      '<strong>⚠ Unit number detected:</strong> Our address validator found a unit/apartment number for this address. Without it, you may not receive your item.</div>';
    }
    var suggestedHtml='';
    if(r.suggested){
      suggestedHtml='<div class="val-addr" style="margin:0 0 12px 0;"><strong>Suggested:</strong><br>'+fmtAddr(r.suggested)+'</div>'+
      '<div class="val-choice" style="display:flex;gap:8px;margin:0 0 12px 0;">'+
      '<button type="button" class="val-use" data-use="'+idx+'" style="flex:1;">Use suggested</button>'+
      '<button type="button" class="val-keep" data-keep="'+idx+'" style="flex:1;">Keep mine</button></div>';
    }
    var yoursHtml='<div class="val-addr" style="margin:0;"><strong>'+(r.suggested?'Yours:':'Address:')+'</strong><br>'+fmtAddr(r.original)+'</div>';
    return '<div data-idx="'+idx+'" style="flex:1;min-width:0;display:flex;flex-direction:column;">'+
      '<div style="margin-bottom:12px;">'+kindLabel+'</div>'+
      unitWarning+suggestedHtml+yoursHtml+
      '</div>';
  }).join('');
  var containerStyle=isMobile?
    'display:flex;flex-direction:column;gap:20px;':
    'display:flex;gap:20px;align-items:stretch;';
  cols='<div style="'+containerStyle+'">'+cols+'</div>';
  var hasSuggestions=results.some(function(r){return r.suggested;});
  root.innerHTML=
    '<div class="bsr-val-modal-overlay" id="val-overlay">'+
    '<div class="bsr-val-modal" style="max-width:720px;max-height:90vh;overflow-y:auto;position:relative;">'+
    '<button type="button" id="val-close-btn" style="position:absolute;top:12px;right:12px;background:none;border:none;font-size:24px;cursor:pointer;color:#666;line-height:1;">&times;</button>'+
    '<h3>Confirm your addresses</h3>'+
    '<p>'+(hasSuggestions?'Our address validator suggests corrections below. Review':'Please confirm')+' your billing and shipping addresses:</p>'+
    '<div style="display:flex;gap:16px;flex-wrap:wrap;">'+cols+'</div>'+
    '<div class="val-actions" style="margin-top:16px;display:flex;justify-content:center;">'+
    '<button type="button" class="val-use" id="val-continue-btn" style="padding:12px 32px;min-width:280px;">Continue to payment →</button>'+
    '</div></div></div>';
  var choices={};
  results.forEach(function(r, idx){choices[idx]=r.suggested?'keep':'keep';});
  root.querySelectorAll('[data-use]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var idx=btn.getAttribute('data-use');
      choices[idx]='use';
      btn.style.background='#1a3c22';btn.style.color='#fff';
      var kb=root.querySelector('[data-keep="'+idx+'"]');
      if(kb){kb.style.background='#f0f0f0';kb.style.color='#333';}
    });
  });
  root.querySelectorAll('[data-keep]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var idx=btn.getAttribute('data-keep');
      choices[idx]='keep';
      btn.style.background='#1a3c22';btn.style.color='#fff';
      var ub=root.querySelector('[data-use="'+idx+'"]');
      if(ub){ub.style.background='#f0f0f0';ub.style.color='#333';}
    });
  });
  root.querySelectorAll('[data-keep]').forEach(function(btn){
    btn.style.background='#1a3c22';btn.style.color='#fff';
  });
  var closeModal=function(){root.innerHTML='';resetBtn();};
  document.getElementById('val-close-btn').addEventListener('click',closeModal);
  document.getElementById('val-overlay').addEventListener('click',function(e){
    if(e.target.id==='val-overlay') closeModal();
  });
  document.getElementById('val-continue-btn').addEventListener('click',function(){
    root.innerHTML='';
    var fixed=results.map(function(r, idx){
      if(r.suggested&&choices[idx]==='use'){
        var out={};for(var k in r.original) out[k]=r.original[k];
        var c=r.suggestedRaw;
        if(c.street) out.address1=c.street;
        if(c.street2) out.address2=c.street2;
        if(c.city) out.city=c.city;
        if(c.state) out.state=c.state;
        if(c.zip) out.postal=c.zip;
        if(c.country) out.country=c.country;
        return {kind:r.kind, address:out};
      }
      return {kind:r.kind, address:r.original};
    });
    onDone(fixed);
  });
}
function validateRequiredFields(){
  var err=document.getElementById('continue-err');
  clearAllFieldErrs();
  var same=document.getElementById('f-ship-same').checked;
  var required=[
    ['f-bill-name','Full name (billing)'],
    ['f-bill-email','Email (billing)'],
    ['f-bill-phone','Phone (billing)'],
    ['f-bill-line1','Street address (billing)'],
    ['f-bill-city','City (billing)'],
    ['f-bill-state','State (billing)'],
    ['f-bill-postal','ZIP (billing)'],
    ['f-bill-country','Country (billing)']
  ];
  if(!same){
    required=required.concat([
      ['f-ship-name','Full name (shipping)'],
      ['f-ship-email','Email (shipping)'],
      ['f-ship-phone','Phone (shipping)'],
      ['f-line1','Street address (shipping)'],
      ['f-city','City (shipping)'],
      ['f-state','State (shipping)'],
      ['f-postal','ZIP (shipping)'],
      ['f-country','Country (shipping)']
    ]);
  }
  for(var i=0;i<required.length;i++){
    var id=required[i][0], label=required[i][1];
    var el=document.getElementById(id);
    if(el && !el.value.trim()){
      fieldErr(id, label+' is required');
      err.textContent='Please fill in all required fields';
      err.style.display='block';
      el.focus();
      return false;
    } else {
      fieldErr(id, null);
    }
  }
  // Email format check
  var emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var bEmail=document.getElementById('f-bill-email').value.trim();
  if(!emailRe.test(bEmail)){fieldErr('f-bill-email','Enter a valid email');err.textContent='Please fix the highlighted fields';err.style.display='block';return false;}
  if(!same){
    var sEmail=document.getElementById('f-ship-email').value.trim();
    if(!emailRe.test(sEmail)){fieldErr('f-ship-email','Enter a valid email');err.textContent='Please fix the highlighted fields';err.style.display='block';return false;}
  }
  return true;
}

document.getElementById('continue-to-payment').addEventListener('click',function(){
var btn=this;
var err=document.getElementById('continue-err');err.style.display='none';
if(!cart.length){err.textContent='Cart is empty';err.style.display='block';return;}
if(!validateRequiredFields()){return;}
// Shippo address validation before proceeding
if (window.BSRAddrValidate && BSRAddrValidate.validate) {
  btn.disabled=true; btn.textContent='Validating addresses…';
  var resetBtn=function(){btn.disabled=false;btn.textContent='Continue to payment →';};
  var billSection=document.getElementById('bill-section');
  var shipSection=document.getElementById('ship-section');
  var same=document.getElementById('f-ship-same').checked;
  var billPayload={
    address1:document.getElementById('f-bill-line1').value.trim(),
    address2:document.getElementById('f-bill-line2').value.trim(),
    city:document.getElementById('f-bill-city').value.trim(),
    state:document.getElementById('f-bill-state').value.trim(),
    postal:document.getElementById('f-bill-postal').value.trim(),
    country:document.getElementById('f-bill-country').value
  };
  var shipPayload={
    address1:document.getElementById('f-line1').value.trim(),
    address2:document.getElementById('f-line2').value.trim(),
    city:document.getElementById('f-city').value.trim(),
    state:document.getElementById('f-state').value.trim(),
    postal:document.getElementById('f-postal').value.trim(),
    country:document.getElementById('f-country').value
  };
  var writeBack=function(fixed, prefix){
    if(!fixed) return;
    var set=function(id, v){var el=document.getElementById(prefix+id); if(el&&v!==undefined) el.value=v;};
    set('line1', fixed.address1); set('line2', fixed.address2);
    set('city', fixed.city); set('state', fixed.state);
    set('postal', fixed.postal||fixed.zip); set('country', fixed.country);
  };
  var doProceed=function(){
    resetBtn();
    proceedToPayment();
  };
  // Validate both addresses, then show single combined modal
  var validateOne=function(kind, payload){
    return new Promise(function(resolve){
      if(!window.BSRAddrValidate||!BSRAddrValidate.validate){resolve({kind:kind,original:payload,suggested:null,suggestedRaw:null,undeliverable:!(j&&j.deliverable)});return;}
      BSRAddrValidate.validate(payload).then(function(j){
        if(!j||!j.ok){resolve({kind:kind,original:payload,suggested:null,suggestedRaw:null,undeliverable:false}).catch(function(){
        if(timedOut) return;
        clearTimeout(timer);
        resolve({kind:kind,original:payload,suggested:null,suggestedRaw:null,undeliverable:false});
      });return;}
        var corrected=j.address||null;
        var hasSuggestion=(j.corrected||(j.corrections&&j.corrections.length));
        if(!hasSuggestion||!corrected){resolve({kind:kind,original:payload,suggested:null,suggestedRaw:null,undeliverable:!(j&&j.deliverable)});return;}
        var diff=false;
        [['street','address1'],['city','city'],['state','state'],['zip','postal']].forEach(function(pair){
          if(corrected[pair[0]]&&String(corrected[pair[0]]).toLowerCase()!==String(payload[pair[1]]||'').toLowerCase()) diff=true;
        });
        if(!diff){resolve({kind:kind,original:payload,suggested:null,suggestedRaw:null,undeliverable:!(j&&j.deliverable)});return;}
        var suggestedAddr={address1:corrected.street,address2:corrected.street2,city:corrected.city,state:corrected.state,postal:corrected.zip,country:corrected.country||payload.country};
        resolve({kind:kind,original:payload,suggested:suggestedAddr,suggestedRaw:corrected});
      }).catch(function(){resolve({kind:kind,original:payload,suggested:null,suggestedRaw:null});});
    });
  };
  var promises=[validateOne('bill', billPayload)];
  // Always validate shipping too, so both appear in the popup
  var shipPayloadForVal=same?
    {name:document.getElementById('f-bill-name').value,company:document.getElementById('f-bill-company').value,email:document.getElementById('f-bill-email').value,phone:cleanPhone(document.getElementById('f-bill-phone').value),address1:document.getElementById('f-bill-line1').value,address2:document.getElementById('f-bill-line2').value,city:document.getElementById('f-bill-city').value,state:document.getElementById('f-bill-state').value,postal:document.getElementById('f-bill-postal').value,country:document.getElementById('f-bill-country').value}:
    shipPayload;
  promises.push(validateOne('ship', shipPayloadForVal));
  Promise.all(promises).then(function(results){
    // Check for warnings (missing unit, undeliverable, etc.)
    var warnings=[];
    results.forEach(function(r){
      var suggUnit=(r.suggested&&r.suggested.address2?r.suggested.address2:'').trim();
      var unitInOrig=unitAlreadyInAddress(suggUnit, r.original.address1, r.original.address2);
      if(r.suggested&&suggUnit&&!unitInOrig){
        warnings.push({kind:r.kind, address:r.original,
          message:'Our address validator detected a unit/apartment number ('+suggUnit+') for this address that you did not include. Without it, you may not receive your item.'});
      }
      if(r.undeliverable){
        warnings.push({kind:r.kind, address:r.original,
          message:'Our address validator could not verify this address as deliverable. Please double-check it.'});
      }
    });
    var showConfirm=function(){
      showValidationModal(results, function(fixed){
        fixed.forEach(function(f){
          if(f.kind==='bill') writeBack(f.address, 'f-bill-');
          else writeBack(f.address, 'f-');
        });
        doProceed();
      });
    };
    if(warnings.length){
      showWarningPopup(results, warnings, showConfirm);
    } else {
      showConfirm();
    }
  });
  return; // Don't proceed yet, wait for validation
}
// Fallback if validator not available
proceedToPayment();
});
function proceedToPayment(){
var _cart=[]; try{_cart=(window.BSR&&BSR.cart)?BSR.cart.list():JSON.parse(localStorage.getItem('bsr-cart-v1')||'[]');}catch(e){}
var same=document.getElementById('f-ship-same').checked;
var p={slugs:_cart,
billing:{name:document.getElementById('f-bill-name').value,company:document.getElementById('f-bill-company').value,email:document.getElementById('f-bill-email').value,phone:cleanPhone(document.getElementById('f-bill-phone').value),same_as_shipping:same,address:{line1:document.getElementById('f-bill-line1').value,line2:document.getElementById('f-bill-line2').value,city:document.getElementById('f-bill-city').value,state:document.getElementById('f-bill-state').value,postal:document.getElementById('f-bill-postal').value,country:document.getElementById('f-bill-country').value}},
shipping:null};
if(same){
  p.shipping={name:document.getElementById('f-bill-name').value,company:document.getElementById('f-bill-company').value,email:document.getElementById('f-bill-email').value,phone:cleanPhone(document.getElementById('f-bill-phone').value),address:{line1:document.getElementById('f-bill-line1').value,line2:document.getElementById('f-bill-line2').value,city:document.getElementById('f-bill-city').value,state:document.getElementById('f-bill-state').value,postal:document.getElementById('f-bill-postal').value,country:document.getElementById('f-bill-country').value}};
}else{
  p.shipping={name:document.getElementById('f-ship-name').value,company:document.getElementById('f-ship-company').value,email:document.getElementById('f-ship-email').value,phone:cleanPhone(document.getElementById('f-ship-phone').value),address:{line1:document.getElementById('f-line1').value,line2:document.getElementById('f-line2').value,city:document.getElementById('f-city').value,state:document.getElementById('f-state').value,postal:document.getElementById('f-postal').value,country:document.getElementById('f-country').value}};
}
sessionStorage.setItem('bsr-checkout-payload',JSON.stringify(p));
location.href='/checkout/payment/';
}
});

// Saved address dropdowns (signed-in only)
function setV(id, v) { var el = document.getElementById(id); if (el) el.value = v || ''; }
function setSel(id, v) { var el = document.getElementById(id); if (el) el.value = v || 'US'; }
function addrLabel(a) {
  var street = [a.address1, a.address2].filter(Boolean).join(', ');
  var city = [a.city, a.state].filter(Boolean).join(', ');
  if (a.postal) city += (city ? ' ' : '') + a.postal;
  var loc = [street, city].filter(Boolean).join(', ');
  var who = ((a.nickname || '').trim()) || ((a.name || '').trim());
  return (who ? who + ' \u2014 ' : '') + loc;
}
function fillShipForm(a) {
  setV('f-ship-name', a.name); setV('f-ship-company', a.company);
  setV('f-ship-email', a.email); setV('f-ship-phone', a.phone);
  setV('f-line1', a.address1); setV('f-line2', a.address2); setV('f-city', a.city);
  setV('f-state', a.state); setV('f-postal', a.postal);
  setSel('f-country', a.country);
}
function fillBillForm(a) {
  setV('f-bill-name', a.name); setV('f-bill-company', a.company);
  setV('f-bill-email', a.email); setV('f-bill-phone', a.phone);
  setV('f-bill-line1', a.address1); setV('f-bill-line2', a.address2); setV('f-bill-city', a.city);
  setV('f-bill-state', a.state); setV('f-bill-postal', a.postal);
  setSel('f-bill-country', a.country);
}
function clearShipForm() {
  ['f-ship-name','f-ship-company','f-ship-email','f-ship-phone','f-line1','f-line2','f-city','f-state','f-postal'].forEach(function(id){ setV(id,''); });
  setSel('f-country','US');
}
function clearBillForm() {
  ['f-bill-name','f-bill-company','f-bill-email','f-bill-phone','f-bill-line1','f-bill-line2','f-bill-city','f-bill-state','f-bill-postal'].forEach(function(id){ setV(id,''); });
  setSel('f-bill-country','US');
}
function initAddressPickers() {
  if (!window.BSR || !BSR.api) return;
  BSR.api('/api/account/addresses').then(function(j) {
    if (!(j && j.ok && Array.isArray(j.addresses) && j.addresses.length)) return;
    var list = j.addresses, byId = {};
    list.forEach(function(a){ byId[String(a.id)] = a; });
    var defShip = null, defBill = null;
    list.forEach(function(a){
      if (a.is_default_shipping && !defShip) defShip = a;
      if (a.is_default_billing && !defBill) defBill = a;
    });
    var opts = function(selId) {
      return '<option value="">Use a new address\u2026</option>' + list.map(function(a){
        return '<option value="' + String(a.id).replace(/"/g,'&quot;') + '"' +
          (selId && String(a.id) === String(selId) ? ' selected' : '') + '>' +
          addrLabel(a).replace(/</g,'&lt;') + '</option>';
      }).join('');
    };
    document.getElementById('ship-addr-picker').innerHTML =
      '<div class="field"><label for="ship-saved">Saved addresses</label>' +
      '<select id="ship-saved" class="input">' + opts(defShip && defShip.id) + '</select></div>';
    document.getElementById('bill-addr-picker').innerHTML =
      '<div class="field"><label for="bill-saved">Saved addresses</label>' +
      '<select id="bill-saved" class="input">' + opts(defBill && defBill.id) + '</select></div>';
    if (defShip) fillShipForm(defShip);
    if (defBill) {
      fillBillForm(defBill);
      var sameRec = defShip && String(defBill.id) === String(defShip.id);
      if (!sameRec) {
        document.getElementById('f-ship-same').checked = false;
        document.getElementById('ship-fields').style.display = 'block';
      }
    }
    document.getElementById('ship-saved').addEventListener('change', function(){
      var a = byId[String(this.value)]; clearShipForm(); if (a) fillShipForm(a);
    });
    document.getElementById('bill-saved').addEventListener('change', function(){
      var a = byId[String(this.value)]; clearBillForm(); if (a) fillBillForm(a);
    });
  }).catch(function(){});
}
