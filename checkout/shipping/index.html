<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods9">
<script src="/assets/js/bsr.js?v=20260926g" defer></script>
<script src="/assets/js/addr-validate.js?v=20260925m" defer></script>
<script src="/assets/js/checkout-common.js?v=20260926a" defer></script>

<style>
.bsr-val-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow-y:auto;}
.bsr-val-modal{background:var(--bg-card);border-radius:16px;max-width:680px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:24px;box-shadow:0 12px 48px rgba(0,0,0,0.35);box-sizing:border-box;margin:auto;position:relative;}
.bsr-val-modal h3{margin:0 0 8px 0;font-size:1.2rem;color:var(--accent-deep);font-family:var(--font-head);}
.bsr-val-modal .val-kind{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px;}
.bsr-val-modal .val-addr{background:var(--bg-soft);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;margin:12px 0;font-size:14px;line-height:1.5;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;}
.bsr-val-modal .val-actions{display:flex;gap:10px;margin-top:16px;}
.bsr-val-modal .val-actions button{flex:1;padding:12px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;border:none;}
.bsr-val-modal .val-use{background:var(--accent);color:var(--accent-ink);}
.bsr-val-modal .val-keep{background:var(--bg-soft);color:var(--text);border:1px solid var(--line);}
.ship-opt input[type=radio]{width:18px;height:18px;flex-shrink:0;}
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
<div class="page-head">
<h1>Shipping</h1>
<p>Where should we send your slides?</p>
<div id="login-prompt" style="display:none;background:#f0f7f0;border:1px solid #1a3c22;border-radius:8px;padding:12px 16px;margin:16px 0;text-align:center;">Have an account? <a href="/account/login/" style="color:#1a3c22;font-weight:700;">Log in</a> to use your saved addresses.</div>
</div>

<div class="checkout-layout">
<div class="checkout-main">
<section class="card" id="ship-section">
<h2><span class="step-num">2</span> Shipping address</h2>
<div id="ship-addr-picker"></div>
<div class="addr-validate-msg" id="ship-val-msg"></div>
<div class="field"><label style="display:flex;gap:8px;align-items:center;font-weight:normal"><input type="checkbox" id="f-ship-same" style="width:18px;height:18px;"> Same as billing address</label></div>
<div id="ship-fields">
<div class="field"><label for="f-ship-name">Full name</label><input type="text" id="f-ship-name" class="input" required></div>
<div class="field"><label for="f-ship-company">Company</label><input type="text" id="f-ship-company" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-ship-email">Email</label><input type="email" id="f-ship-email" class="input" required></div>
<div class="field"><label for="f-ship-phone">Phone</label><input type="tel" id="f-ship-phone" class="input" required></div>
</div>
<div class="field"><label for="f-ship-line1">Street address</label><input type="text" id="f-ship-line1" name="address1" class="input" required></div>
<div class="field"><label for="f-ship-line2">Apt, suite, etc. <span class="opt">(optional)</span></label><input type="text" id="f-ship-line2" name="address2" class="input"></div>
<div class="field-row">
<div class="field"><label for="f-ship-city">City</label><input type="text" id="f-ship-city" name="city" class="input" required></div>
<div class="field"><label for="f-ship-state">State / Province</label><input type="text" id="f-ship-state" name="state" class="input" required></div>
</div>
<div class="field-row">
<div class="field"><label for="f-ship-postal">ZIP / Postal code</label><input type="text" id="f-ship-postal" name="postal" class="input" required></div>
<div class="field"><label for="f-ship-country">Country</label><input type="text" id="f-ship-country" name="country" class="input" value="US" required></div>
</div>
</div>
</section>

<section class="card" id="ship-method-section">
<h2><span class="step-num">3</span> Shipping method</h2>
<p class="hint" style="margin-top:-6px;">Rates load automatically for your address.</p>
<div id="ship-methods-loading" style="display:none;text-align:center;padding:20px;">Loading shipping rates&hellip;</div>
<div id="ship-methods-error" class="error" style="display:none;color:#c00;margin:10px 0"></div>
<div id="ship-methods-list"></div>
</section>

<section class="card" style="text-align:center">
<div style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;">
<a href="/checkout/" class="btn" style="text-decoration:none;">&larr; Back to billing</a>
<button type="button" id="continue-to-payment" class="btn btn-primary" style="padding:14px 28px;font-size:1.05rem">Continue to payment &rarr;</button>
</div>
<div class="error" id="continue-err" style="display:none;color:#c00;margin-top:10px"></div>
</section>
</div>

<aside class="card summary">
<h2>Order summary</h2>
<div id="sum-lines"></div>
<div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)">
<span>Items</span><span id="sum-total">$0.00</span>
</div>
<div style="display:flex;justify-content:space-between;margin-top:8px;color:#666;">
<span>Shipping</span><span id="sum-ship">Calculated below</span>
</div>
</aside>
</div>

</div>
</main>
<div id="bsr-footer"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
if (window.BSR && BSR.init) BSR.init();
// Retry the shipping address picker until BSR.api is ready (up to 5s)
var _addrTries = 0;
var _addrTimer = setInterval(function(){
  _addrTries++;
  if ((window.BSR && BSR.api) || _addrTries > 25) {
    clearInterval(_addrTimer);
    try { initShipPicker(); } catch(e) {}
  }
}, 200);
// Address validator: live street suggestions for the shipping form
var _valTries = 0;
var _valTimer = setInterval(function(){
  _valTries++;
  if ((window.BSRAddrValidate && BSRAddrValidate.attachLive) || _valTries > 25) {
    clearInterval(_valTimer);
    try {
      var shipSec = document.getElementById('ship-section');
      if (window.BSRAddrValidate && BSRAddrValidate.attachLive && shipSec) {
        BSRAddrValidate.attachLive(shipSec);
      }
    } catch(e) {}
  }
}, 200);

var cart=[]; try{cart=(window.BSR&&BSR.cart)?BSR.cart.list():JSON.parse(localStorage.getItem('bsr-cart-v1')||'[]');}catch(e){}

// ---- Order summary (items only; shipping adds up below) ----
(function(){
  var sumLines=document.getElementById('sum-lines');
  sumLines.innerHTML='<p>Loading&hellip;</p>';
  if(!cart.length){sumLines.innerHTML='<p>Cart empty</p>';return;}
  BSR.api('/api/catalog/products').then(function(j){
    var all=(j&&j.ok&&j.products)?j.products:[];
    var bySlug={};
    all.forEach(function(p){bySlug[p.slug]=p;});
    var t=0,html='';
    cart.forEach(function(slug){
      var p=bySlug[slug]||{slug:slug,title:slug,price_cents:0};
      var cents=p.price_cents||0;t+=cents;
      html+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>'+BSR.esc(p.title||p.slug)+'</span><span>'+BSR.money(cents)+'</span></div>';
    });
    sumLines.innerHTML=html;
    document.getElementById('sum-total').textContent=BSR.money(t);
  }).catch(function(){
    sumLines.innerHTML=cart.map(function(slug){
      return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>'+BSR.esc(slug)+'</span><span>&mdash;</span></div>';
    }).join('');
  });
})();

// ---- Saved shipping addresses (signed-in only) ----
function getBilling(){
  try{ var b=JSON.parse(sessionStorage.getItem('bsr-billing')||'null'); if(b&&b.address) return b; }catch(e){}
  return null;
}
function fillShipForm(a) {
  BSRCheckout.setV('f-ship-name', a.name); BSRCheckout.setV('f-ship-company', a.company);
  BSRCheckout.setV('f-ship-email', a.email); BSRCheckout.setV('f-ship-phone', a.phone);
  BSRCheckout.setV('f-ship-line1', a.address1); BSRCheckout.setV('f-ship-line2', a.address2);
  BSRCheckout.setV('f-ship-city', a.city); BSRCheckout.setV('f-ship-state', a.state);
  BSRCheckout.setV('f-ship-postal', a.postal); BSRCheckout.setSel('f-ship-country', a.country);
}
function clearShipForm() {
  ['f-ship-name','f-ship-company','f-ship-email','f-ship-phone','f-ship-line1','f-ship-line2','f-ship-city','f-ship-state','f-ship-postal'].forEach(function(id){ BSRCheckout.setV(id,''); });
  BSRCheckout.setSel('f-ship-country','US');
}
function addrLabel(a) {
  var street = [a.address1, a.address2].filter(Boolean).join(', ');
  var city = [a.city, a.state].filter(Boolean).join(', ');
  if (a.postal) city += (city ? ' ' : '') + a.postal;
  var loc = [street, city].filter(Boolean).join(', ');
  var who = ((a.nickname || '').trim()) || ((a.name || '').trim());
  return (who ? who + ' \u2014 ' : '') + loc;
}
function initShipPicker() {
  if (!window.BSR || !BSR.api) return;
  BSR.api('/api/account/addresses').then(function(j) {
    if (!(j && j.ok && Array.isArray(j.addresses) && j.addresses.length)) {
      var lp = document.getElementById('login-prompt');
      if (lp && !(j && j.ok)) lp.style.display = '';
      return;
    }
    var list = j.addresses, byId = {};
    list.forEach(function(a){ byId[String(a.id)] = a; });
    var defShip = null;
    list.forEach(function(a){
      if (a.is_default_shipping && !defShip) defShip = a;
    });
    var opts = function(selId) {
      return '<option value="">Use a new address\u2026</option>' + list.map(function(a){
        return '<option value="' + String(a.id).replace(/"/g,'&quot;') + '"' +
          (selId && String(a.id) === String(selId) ? ' selected' : '') + '>' +
          addrLabel(a).replace(/</g,'&lt;') + '</option>';
      }).join('');
    };
    document.getElementById('ship-addr-picker').innerHTML =
      '<div class="field"><label for="ship-saved">Saved addresses</label>' +
      '<select id="ship-saved" class="input">' + opts(defShip && defShip.id) + '</select></div>';
    if (defShip) fillShipForm(defShip);
    document.getElementById('ship-saved').addEventListener('change', function(){
      var a = byId[String(this.value)]; clearShipForm(); if (a) fillShipForm(a);
      invalidateRates();
    });
  }).catch(function(){});
}

// ---- Same as billing (starts unchecked) ----
function onSameChange(){
  var same=document.getElementById('f-ship-same').checked;
  document.getElementById('ship-fields').style.display=same?'none':'';
  document.getElementById('ship-addr-picker').style.display=same?'none':'';
  invalidateRates();
}
document.getElementById('f-ship-same').addEventListener('change', onSameChange);

// ---- Effective shipping address for rates/validation ----
function shipAddrPayload(){
  if(document.getElementById('f-ship-same').checked){
    var b=getBilling(); var a=b&&b.address?b.address:{};
    return {address1:a.line1||'',address2:a.line2||'',city:a.city||'',state:a.state||'',postal:a.postal||'',country:a.country||'US'};
  }
  return {
    address1:BSRCheckout.val('f-ship-line1'),address2:BSRCheckout.val('f-ship-line2'),
    city:BSRCheckout.val('f-ship-city'),state:BSRCheckout.val('f-ship-state'),
    postal:BSRCheckout.val('f-ship-postal'),country:BSRCheckout.val('f-ship-country')||'US'
  };
}
function normKey(a){
  return JSON.stringify([a.address1,a.address2,a.city,a.state,a.postal,a.country].map(function(x){return String(x||'').trim().toLowerCase();}));
}

// ---- Shipping rates (automatic, no button) ----
var shipOptions=[], selectedShipIdx=-1, selectedShipOption=null, lastRatesKey='', shipRateTimer=null, ratesInFlight=false;
function renderRates(){
  var list=document.getElementById('ship-methods-list');
  if(!shipOptions.length){ list.innerHTML=''; return; }
  var html=shipOptions.map(function(o,i){
    var eta=o.eta?'<div style="font-size:12px;color:#666;">'+BSR.esc(o.eta)+'</div>':'';
    var label=[o.carrier,o.service].filter(Boolean).join(' \u2014 ')||'Shipping';
    return '<label class="ship-opt" style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;">'+
      '<input type="radio" name="ship-method" value="'+i+'"'+(i===selectedShipIdx?' checked':'')+'>'+
      '<div style="flex:1;"><div style="font-weight:600;">'+BSR.esc(label)+'</div>'+eta+'</div>'+
      '<div style="font-weight:700;white-space:nowrap;">'+BSR.money(o.cents||0)+'</div></label>';
  }).join('');
  list.innerHTML=html;
  var radios=list.querySelectorAll('input[name="ship-method"]');
  for(var k=0;k<radios.length;k++){
    radios[k].addEventListener('change',function(){
      selectedShipIdx=parseInt(this.value,10);
      selectedShipOption=shipOptions[selectedShipIdx]||null;
      updateShipTotal();
    });
  }
}
function updateShipTotal(){
  var el=document.getElementById('sum-ship');
  if(el) el.textContent=selectedShipOption?BSR.money(selectedShipOption.cents||0):'Calculated below';
}
function fetchShipRates(done){
  var loading=document.getElementById('ship-methods-loading');
  var errDiv=document.getElementById('ship-methods-error');
  errDiv.style.display='none';
  var a=shipAddrPayload();
  var key=normKey(a);
  if(!a.postal){ loading.style.display='none'; if(done) done(); return; }
  if(!cart.length){ if(done) done(); return; }
  loading.style.display='block';
  ratesInFlight=true;
  var items=[];
  for(var i=0;i<cart.length;i++) items.push({title:'Collectible 35mm slide',quantity:1,unit_price:500});
  var params=new URLSearchParams({country:a.country||'US',postal:a.postal.trim(),street:a.address1||'',city:a.city||'',state:a.state||'',items:JSON.stringify(items)});
  BSR.api('/api/shipping/rates?'+params.toString(),{method:'GET'}).then(function(j){
    loading.style.display='none'; ratesInFlight=false;
    if(!j||!j.ok||!j.options||!j.options.length){
      errDiv.textContent=(j&&j.error)||'Could not get shipping rates. You can still continue \u2014 the cheapest option will be used.';
      errDiv.style.display='';
      shipOptions=[]; selectedShipIdx=-1; selectedShipOption=null; lastRatesKey=key;
      renderRates(); updateShipTotal();
      if(done) done(); return;
    }
    // Preserve the previously selected rate across refetches when possible.
    var prevRef=selectedShipOption&&selectedShipOption.ref;
    shipOptions=j.options;
    selectedShipIdx=0;
    if(prevRef){
      for(var k=0;k<shipOptions.length;k++){ if(shipOptions[k].ref===prevRef){ selectedShipIdx=k; break; } }
    }
    selectedShipOption=shipOptions[selectedShipIdx]||null;
    lastRatesKey=key;
    renderRates(); updateShipTotal();
    if(done) done();
  }).catch(function(){
    loading.style.display='none'; ratesInFlight=false;
    errDiv.textContent='Could not get shipping rates. You can still continue \u2014 the cheapest option will be used.';
    errDiv.style.display='';
    if(done) done();
  });
}
function scheduleRates(){
  if(shipRateTimer) clearTimeout(shipRateTimer);
  shipRateTimer=setTimeout(function(){ fetchShipRates(); },800);
}
function invalidateRates(){
  selectedShipOption=null; selectedShipIdx=-1; shipOptions=[];
  document.getElementById('ship-methods-list').innerHTML='';
  updateShipTotal();
  scheduleRates();
}
['f-ship-postal','f-ship-city','f-ship-state','f-ship-line1','f-ship-line2','f-ship-country'].forEach(function(id){
  var el=document.getElementById(id);
  if(el) el.addEventListener('input', invalidateRates);
});
// Initial auto-load if the form already has a postal code (saved address)
setTimeout(function(){ fetchShipRates(); },1500);

// ---- Postal code autofill (1-second polling, country auto-detect) ----
(function(){
  var countryMap={'united states':'us','usa':'us','canada':'ca','united kingdom':'gb','uk':'gb','great britain':'gb','germany':'de','france':'fr','australia':'au','mexico':'mx','japan':'jp','ireland':'ie','netherlands':'nl','spain':'es','italy':'it'};
  var lastShipZip='';
  function detectCountry(zip){
    var z=zip.trim().toUpperCase();
    if(/^[A-Z]\d[A-Z]\s?\d[A-Z]\d$/.test(z)) return 'ca';
    if(/^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/.test(z)) return 'gb';
    if(/^\d{4}$/.test(z)) return 'au';
    if(/^\d{5}(-?\d{4})?$/.test(z)) return 'us';
    return null;
  }
  function lookup(zip){
    var countryEl=document.getElementById('f-ship-country');
    var countryRaw=countryEl?countryEl.value.trim().toLowerCase():'us';
    var countryCode=countryMap[countryRaw]||countryRaw;
    if(!/^[a-z]{2}$/.test(countryCode)) countryCode='us';
    var detected=detectCountry(zip);
    if(detected&&detected!==countryCode){
      countryCode=detected;
      if(countryEl) countryEl.value=detected.toUpperCase();
    }
    var apiZip=zip;
    if(countryCode==='us'){
      var m5=/^(\d{5})(-?\d{4})?$/.exec(zip.trim());
      if(m5) apiZip=m5[1];
    }
    fetch('https://api.zippopotam.us/'+countryCode+'/'+encodeURIComponent(apiZip))
      .then(function(r){ if(!r.ok) throw new Error('not found'); return r.json(); })
      .then(function(data){
        var place=data.places&&data.places[0];
        if(!place) return;
        var cityEl=document.getElementById('f-ship-city');
        var stateEl=document.getElementById('f-ship-state');
        if(cityEl) cityEl.value=place['place name']||'';
        if(stateEl) stateEl.value=place['state abbreviation']||place['state']||'';
        if(countryEl&&data['country abbreviation']) countryEl.value=data['country abbreviation'];
      })
      .catch(function(){});
  }
  setInterval(function(){
    var sZipEl=document.getElementById('f-ship-postal');
    if(!sZipEl) return;
    var sZip=sZipEl.value.trim();
    if(sZip&&sZip!==lastShipZip){ lastShipZip=sZip; lookup(sZip); }
    if(!sZip) lastShipZip='';
  }, 1000);
})();

// ---- Validation + Continue to payment ----
function validateShipFields(){
  var err=document.getElementById('continue-err');
  BSRCheckout.clearFieldErrs('#ship-section');
  if(document.getElementById('f-ship-same').checked) return true; // address came from billing
  var required=[
    ['f-ship-name','Full name'],
    ['f-ship-email','Email'],
    ['f-ship-phone','Phone'],
    ['f-ship-line1','Street address'],
    ['f-ship-city','City'],
    ['f-ship-state','State'],
    ['f-ship-postal','ZIP'],
    ['f-ship-country','Country']
  ];
  for(var i=0;i<required.length;i++){
    var id=required[i][0], label=required[i][1];
    var el=document.getElementById(id);
    if(el && !el.value.trim()){
      BSRCheckout.fieldErr(id, label+' is required');
      err.textContent='Please fill in all required fields';
      err.style.display='block';
      el.focus();
      return false;
    }
  }
  var sEmail=BSRCheckout.val('f-ship-email');
  if(!BSRCheckout.emailOk(sEmail)){
    BSRCheckout.fieldErr('f-ship-email','Enter a valid email');
    err.textContent='Please fix the highlighted fields';
    err.style.display='block';
    return false;
  }
  return true;
}

function writeBackShip(addr){
  if(!addr) return;
  var set=function(id, v){ if(v!==undefined) BSRCheckout.setV(id, v); };
  set('f-ship-line1', addr.address1); set('f-ship-line2', addr.address2);
  set('f-ship-city', addr.city); set('f-ship-state', addr.state);
  set('f-ship-postal', addr.postal || addr.zip); set('f-ship-country', addr.country);
}

function afterShipValidation(finalAddr, b, resetBtn){
  var same=document.getElementById('f-ship-same').checked;
  // If the validator changed the address while "same as billing" was on,
  // shipping now differs from billing — switch to manual shipping.
  if(same && normKey(finalAddr)!==normKey({address1:b.address.line1||'',address2:b.address.line2||'',city:b.address.city||'',state:b.address.state||'',postal:b.address.postal||'',country:b.address.country||'US'})){
    document.getElementById('f-ship-same').checked=false;
    onSameChange();
  }
  writeBackShip(finalAddr);
  var go=function(){ resetBtn(); buildPayloadAndGo(); };
  // The confirmation modal comes before rates are used: refetch for the
  // final (possibly corrected) address before locking in the selected rate.
  if(normKey(finalAddr)!==lastRatesKey){ fetchShipRates(go); }
  else { go(); }
}

function buildPayloadAndGo(){
  var err=document.getElementById('continue-err');
  var b=getBilling();
  if(!b){ err.textContent='Please complete the billing step first.'; err.style.display='block'; return; }
  var same=document.getElementById('f-ship-same').checked;
  var saddr=same?b.address:{
    line1:BSRCheckout.val('f-ship-line1'),line2:BSRCheckout.val('f-ship-line2'),
    city:BSRCheckout.val('f-ship-city'),state:BSRCheckout.val('f-ship-state'),
    postal:BSRCheckout.val('f-ship-postal'),country:BSRCheckout.val('f-ship-country')||'US'
  };
  var ship={
    name: same?b.name:BSRCheckout.val('f-ship-name'),
    company: same?b.company:BSRCheckout.val('f-ship-company'),
    email: same?b.email:BSRCheckout.val('f-ship-email'),
    phone: BSRCheckout.cleanPhone(same?b.phone:BSRCheckout.val('f-ship-phone')),
    address:{line1:saddr.line1||'',line2:saddr.line2||'',city:saddr.city||'',state:saddr.state||'',postal:saddr.postal||'',country:saddr.country||'US'}
  };
  if(selectedShipOption){
    ship.rate_ref=selectedShipOption.ref||'';
    ship.provider=selectedShipOption.provider||'';
    ship.carrier=selectedShipOption.carrier||'';
    ship.service=selectedShipOption.service||'';
    ship.rate_cents=selectedShipOption.cents||0;
  }
  var billing={
    name:b.name,company:b.company,email:b.email,phone:b.phone,
    same_as_shipping:same,address:b.address
  };
  var p={slugs:cart,billing:billing,shipping:ship};
  try{ sessionStorage.setItem('bsr-checkout-payload', JSON.stringify(p)); }catch(e){}
  window.location.href='/checkout/payment/';
}

document.getElementById('continue-to-payment').addEventListener('click',function(){
  var btn=this;
  var err=document.getElementById('continue-err'); err.style.display='none';
  if(!cart.length){ err.textContent='Cart is empty'; err.style.display='block'; return; }
  var b=getBilling();
  if(!b){ err.textContent='Please complete the billing step first.'; err.style.display='block'; return; }
  if(!validateShipFields()){ return; }
  var resetBtn=function(){ btn.disabled=false; btn.innerHTML='Continue to payment &rarr;'; };
  var addrPayload=shipAddrPayload();
  // Our address validator runs independently on the shipping page, with its
  // own confirmation modal — before rates are locked in and before payment.
  if(window.BSRAddrValidate && BSRAddrValidate.validate){
    btn.disabled=true; btn.textContent='Validating address\u2026';
    BSRCheckout.runValidationFlow('ship', addrPayload, { continueLabel: 'Continue to payment \u2192' }, function(finalAddr){
      afterShipValidation(finalAddr, b, resetBtn);
    }, resetBtn);
  } else {
    afterShipValidation(addrPayload, b, resetBtn);
  }
});
});
</script>
<div id="bsr-val-modal-root"></div></body>
</html>
