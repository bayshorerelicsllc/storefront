<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — Bay Shore Relics LLC</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="payment-root"></div>
<script src="/assets/js/bsr.js"></script>
<script>
(function () {
  BSR.init({ active: '' });
  var root = document.getElementById('payment-root');
  
  // Get the checkout payload from sessionStorage
  var payload = null;
  try {
    var stored = sessionStorage.getItem('bsr-checkout-payload');
    if (stored) payload = JSON.parse(stored);
  } catch (e) {}
  
  if (!payload || !payload.slugs || !payload.slugs.length) {
    root.innerHTML =
      '<div class="card" style="text-align:center;max-width:560px;margin:40px auto;padding:40px 32px">' +
      '<h2>No checkout in progress</h2>' +
      '<p class="hint">Please start from the checkout page.</p>' +
      '<a class="btn btn-primary" href="/checkout/">Back to checkout</a></div>';
    return;
  }
  
  // Build the payment page
  root.innerHTML =
    '<div style="max-width:680px;margin:0 auto;padding:20px">' +
    '<h1>Choose payment method</h1>' +
    '<p class="hint">Your order details are confirmed. Choose how to pay:</p>' +
    
    '<section class="card" style="margin:20px 0">' +
    '<h2>Pay with PayPal</h2>' +
    '<p class="hint" style="margin-bottom:16px">Secure checkout via PayPal — pay with your balance, bank, or card.</p>' +
    '<button type="button" id="paypal-hosted-pay" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;height:52px;box-sizing:border-box;background:#FFC439;color:#003087;border:none;border-radius:8px;padding:0 16px;font-size:1.05rem;font-weight:700;cursor:pointer;margin:0 auto">' +
    '<img src="/assets/img/payments/paypal-official.svg" alt="" style="height:22px;width:auto"><span>Continue to PayPal</span></button>' +
    '<div class="error" id="paypal-hosted-err" style="display:none;margin-top:12px"></div>' +
    '</section>' +
    
    '<section class="card" style="margin:20px 0">' +
    '<h2>Pay with card</h2>' +
    '<p class="hint" style="margin-bottom:16px">Secure checkout via Stripe — all major cards accepted.</p>' +
    '<button type="button" id="stripe-hosted-pay" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;height:52px;box-sizing:border-box;background:#635BFF;color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:1.05rem;font-weight:700;cursor:pointer;margin:0 auto">' +
    '<img src="/assets/img/payments/stripe-official.svg" alt="" style="height:22px;width:auto;filter:brightness(0) invert(1)"><span>Continue to Stripe</span></button>' +
    '<div class="error" id="hosted-err" style="display:none;margin-top:12px"></div>' +
    '</section>' +
    
    '<div style="text-align:center;margin-top:20px">' +
    '<a href="/checkout/" style="color:#6c757d">&larr; Back to checkout</a>' +
    '</div></div>';
  
  // Wire up the buttons
  function wireButton(btnId, errId, apiPath, loadingText) {
    var btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener('click', function () {
      btn.disabled = true;
      var origText = btn.innerHTML;
      btn.innerHTML = '<span>' + loadingText + '</span>';
      var timedOut = false;
      var timer = setTimeout(function () {
        timedOut = true;
        btn.disabled = false;
        btn.innerHTML = origText;
        var errEl = document.getElementById(errId);
        if (errEl) {
          errEl.textContent = 'Taking too long. Please try again.';
          errEl.style.display = '';
        }
      }, 20000);
      BSR.api(apiPath, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      }).then(function (j) {
        if (timedOut) return;
        clearTimeout(timer);
        var url = j && (j.url || j.approval_url);
        if (url) {
          window.location.href = url;
        } else {
          throw new Error((j && j.error) || 'Could not start checkout.');
        }
      }).catch(function (e) {
        if (timedOut) return;
        clearTimeout(timer);
        btn.disabled = false;
        btn.innerHTML = origText;
        var errEl = document.getElementById(errId);
        if (errEl) {
          errEl.textContent = e.message || 'Checkout failed. Please try again.';
          errEl.style.display = '';
        }
      });
    });
  }
  
  wireButton('paypal-hosted-pay', 'paypal-hosted-err', '/api/checkout/create', 'Redirecting to PayPal&hellip;');
  wireButton('stripe-hosted-pay', 'hosted-err', '/api/stripe/create-checkout-session', 'Creating secure checkout&hellip;');
})();
</script>
</body>
</html>
