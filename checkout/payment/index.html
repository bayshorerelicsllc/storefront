<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — Bay Shore Relics LLC</title>
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods9">
<style>
.payment-wrap{max-width:680px;margin:0 auto;}
.payment-card{background:#fff;border:1px solid var(--line,#e0dccf);border-radius:12px;padding:24px;margin:20px 0;}
.payment-card h2{margin:0 0 12px 0;font-size:1.25rem;color:#1a3c22;}
.pay-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;height:54px;box-sizing:border-box;border:none;border-radius:10px;padding:0 16px;font-size:1.05rem;font-weight:700;cursor:pointer;margin:16px auto 0;}
.pay-btn:disabled{opacity:0.6;cursor:not-allowed;}
.pay-btn-paypal{background:#FFC439;color:#003087;}
.pay-btn-stripe{background:#533AFD;color:#fff;border:none;}
.promo-row{display:flex;gap:8px;}
.promo-row input{flex:1;}
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
<div class="page-head">
<h1>Payment</h1>
<p>Your order details are confirmed. Choose how to pay.</p>
</div>
<div class="payment-wrap" id="payment-root">
<p>Loading…</p>
</div>
</div>
</main>
<div id="bsr-footer"></div>
<script src="/assets/js/bsr.js"></script>
<script>
(function () {
  BSR.init({ active: '' });
  var root = document.getElementById('payment-root');

  var payload = null;
  try {
    var stored = sessionStorage.getItem('bsr-checkout-payload');
    if (stored) payload = JSON.parse(stored);
  } catch (e) {}

  if (!payload || !payload.slugs || !payload.slugs.length) {
    root.innerHTML =
      '<div class="payment-card" style="text-align:center;">' +
      '<h2>No checkout in progress</h2>' +
      '<p class="hint">Please start from the checkout page.</p>' +
      '<a class="btn btn-primary" href="/checkout/">Back to checkout</a></div>';
    return;
  }

  root.innerHTML =
    '<section class="payment-card">' +
    '<h2><span class="step-num">1</span> Promo code</h2>' +
    '<div class="promo-row">' +
    '<input type="text" id="f-promo" class="input" placeholder="Enter code">' +
    '<button class="btn btn-secondary" id="promo-apply" type="button">Apply</button></div>' +
    '<div class="hint" id="promo-ok" style="display:none;color:#28a745;margin-top:8px;"></div>' +
    '<div class="field-error" id="promo-err" style="display:none;margin-top:8px;"></div></section>' +

    '<section class="payment-card">' +
    '<h2><span class="step-num">2</span> Pay with PayPal</h2>' +
    '<p class="hint">Secure checkout via PayPal — pay with your balance, bank, or card.</p>' +
    '<button type="button" id="paypal-hosted-pay" class="pay-btn pay-btn-paypal">' +
    '<img src="/assets/img/payments/paypal-official.svg" alt="" style="height:24px;width:auto"><span>Continue to PayPal</span></button>' +
    '<div class="field-error" id="paypal-hosted-err" style="display:none;margin-top:12px;"></div>' +
    '</section>' +

    '<section class="payment-card">' +
    '<h2><span class="step-num">3</span> Pay with card</h2>' +
    '<p class="hint">Secure checkout via Stripe — all major cards accepted.</p>' +
    '<button type="button" id="stripe-hosted-pay" class="pay-btn pay-btn-stripe">' +
    '<span>Continue to Stripe</span></button>' +
    '<div class="field-error" id="hosted-err" style="display:none;margin-top:12px;"></div>' +
    '</section>' +

    '<div style="text-align:center;margin:24px 0;">' +
    '<a href="/checkout/" class="hint">&larr; Back to checkout</a>' +
    '</div>';

  var promoInput = document.getElementById('f-promo');
  var promoApply = document.getElementById('promo-apply');
  var promoOk = document.getElementById('promo-ok');
  var promoErr = document.getElementById('promo-err');
  if (payload.promo_code && promoInput) promoInput.value = payload.promo_code;
  if (promoApply) {
    promoApply.addEventListener('click', function () {
      var code = promoInput.value.trim();
      if (promoOk) promoOk.style.display = 'none';
      if (promoErr) promoErr.style.display = 'none';
      if (!code) return;
      promoApply.disabled = true;
      BSR.api('/api/promo/validate', {
        method: 'POST',
        body: { code: code, slugs: payload.slugs },
      }).then(function (j) {
        promoApply.disabled = false;
        if (j && j.ok) {
          payload.promo_code = code;
          try { sessionStorage.setItem('bsr-checkout-payload', JSON.stringify(payload)); } catch (e) {}
          if (promoOk) { promoOk.textContent = 'Code applied: ' + (j.description || code); promoOk.style.display = ''; }
        } else { throw new Error((j && j.error) || 'Invalid code.'); }
      }).catch(function (e) {
        promoApply.disabled = false;
        if (promoErr) { promoErr.textContent = e.message || 'Invalid code.'; promoErr.style.display = ''; }
      });
    });
  }

  function getPayload() {
    try {
      var s = sessionStorage.getItem('bsr-checkout-payload');
      if (s) return JSON.parse(s);
    } catch (e) {}
    return payload;
  }
  function wireButton(btnId, errId, apiPath, loadingText) {
    var btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener('click', function () {
      btn.disabled = true;
      var orig = btn.innerHTML;
      btn.innerHTML = '<span>' + loadingText + '</span>';
      var timedOut = false;
      var timer = setTimeout(function () {
        timedOut = true; btn.disabled = false; btn.innerHTML = orig;
        var el = document.getElementById(errId);
        if (el) { el.textContent = 'Taking too long. Please try again.'; el.style.display = ''; }
      }, 20000);
      BSR.api(apiPath, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(getPayload()),
      }).then(function (j) {
        if (timedOut) return;
        clearTimeout(timer);
        var url = j && (j.url || j.approval_url);
        if (url) { window.location.href = url; }
        else { throw new Error((j && j.error) || 'Could not start checkout.'); }
      }).catch(function (e) {
        if (timedOut) return;
        clearTimeout(timer);
        btn.disabled = false; btn.innerHTML = orig;
        var el = document.getElementById(errId);
        if (el) { el.textContent = e.message || 'Checkout failed. Please try again.'; el.style.display = ''; }
      });
    });
  }

  wireButton('paypal-hosted-pay', 'paypal-hosted-err', '/api/checkout/create', 'Redirecting to PayPal…');
  wireButton('stripe-hosted-pay', 'hosted-err', '/api/stripe/create-checkout-session', 'Creating secure checkout…');
})();
</script>
</body>
</html>
