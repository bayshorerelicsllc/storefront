<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Bay Shore Relics LLC</title>
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods3">
<script src="/assets/js/bsr.js?v=20260926m" defer></script>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap">
<div id="thanks-root"></div>
</div>
</main>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: '' });
  var root = document.getElementById('thanks-root');
  var params = new URLSearchParams(window.location.search);
  var piSecret = params.get('payment_intent_client_secret');
  var redirectStatus = params.get('redirect_status');

  function showSuccess(ref) {
    BSR.cart.clear(true);
    try { sessionStorage.removeItem('bsr-last-order'); } catch (e) {}
    root.innerHTML =
      '<div class="card" style="text-align:center;max-width:560px;margin:40px auto;padding:40px 32px">' +
      '<div class="empty-icon">' + BSR.icon('check') + '</div>' +
      '<h1>Thank you — order confirmed!</h1>' +
      (ref ? '<p>Your order reference is <strong>' + BSR.esc(ref) + '</strong>.</p>' : '') +
      '<p class="hint">A confirmation email is on its way. Each slide is a single physical item, sold once — your slides are reserved for you.</p>' +
      '<div class="promo-row" style="justify-content:center">' +
      '<a class="btn btn-primary" href="/track/">' + BSR.icon('truck', 'ic-sm') + ' Track your order</a>' +
      '<a class="btn btn-secondary" href="/shop/">Keep shopping</a></div></div>';
  }
  function showEmpty() {
    root.innerHTML =
      '<div class="empty"><div class="empty-icon">' + BSR.icon('check') + '</div>' +
      '<h2>Thanks for shopping!</h2>' +
      '<p>No recent order found. Browse the collection — every slide is one of a kind.</p>' +
      '<div class="promo-row" style="justify-content:center">' +
      '<a class="btn btn-primary" href="/shop/">Browse slides</a>' +
      '<a class="btn btn-ghost" href="/track/">Track an order</a></div></div>';
  }

  // PayPal hosted redirect return: capture the approved order
  var ppProvider = params.get('provider');
  var ppToken = params.get('token');
  if (ppProvider === 'paypal' && ppToken) {
    root.innerHTML = '<div class="empty"><p>Confirming your PayPal payment…</p></div>';
    BSR.api('/api/checkout/capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderID: ppToken }),
    }).then(function (j) {
      if (j && j.ok) {
        try { sessionStorage.setItem('bsr-last-order', j.order_ref || ppToken); } catch (e) {}
        showSuccess(j.order_ref || ppToken);
      } else {
        root.innerHTML = '<div class="empty"><h2>Payment didn\'t go through</h2><p>' +
          BSR.esc((j && j.error) || 'Please try checkout again.') +
          '</p><div class="promo-row" style="justify-content:center"><a class="btn btn-primary" href="/checkout/">Back to checkout</a></div></div>';
      }
    }).catch(function () {
      root.innerHTML = '<div class="empty"><h2>Payment didn\'t go through</h2><p>Please try checkout again.</p><div class="promo-row" style="justify-content:center"><a class="btn btn-primary" href="/checkout/">Back to checkout</a></div></div>';
    });
    return;
  }

  // Redirect return (e.g. Amazon Pay): verify the payment intent
  if (piSecret) {
    root.innerHTML = '<div class="empty"><p>Confirming your payment…</p></div>';
    BSR.api('/api/catalog/config').then(function (cfg) {
      var pk = cfg && cfg.ok ? cfg.stripe_publishable_key : null;
      if (!pk) throw new Error('no key');
      var s = document.createElement('script');
      s.src = 'https://js.stripe.com/v3/';
      s.onload = function () {
        window.Stripe(pk).retrievePaymentIntent(piSecret).then(function (res) {
          var pi = res && res.paymentIntent;
          if (pi && pi.status === 'succeeded') {
            showSuccess(pi.id);
          } else if (pi && pi.status === 'processing') {
            root.innerHTML = '<div class="empty"><h2>Payment processing</h2><p>Your payment is on its way — we\'ll email your confirmation shortly.</p></div>';
          } else {
            root.innerHTML = '<div class="empty"><h2>Payment didn\'t go through</h2><p>Please try checkout again.</p><div class="promo-row" style="justify-content:center"><a class="btn btn-primary" href="/checkout/">Back to checkout</a></div></div>';
          }
        });
      };
      s.onerror = function () { showEmpty(); };
      document.head.appendChild(s);
    }).catch(function () { showEmpty(); });
    return;
  }

  BSR.cart.clear(true);
  var orderRef = null;
  try { orderRef = sessionStorage.getItem('bsr-last-order'); } catch (e) {}
  if (orderRef) {
    root.innerHTML =
      '<div class="card" style="text-align:center;max-width:560px;margin:40px auto;padding:40px 32px">' +
      '<div class="empty-icon">' + BSR.icon('check') + '</div>' +
      '<h1>Thank you — order confirmed!</h1>' +
      '<p>Your order reference is <strong>' + BSR.esc(orderRef) + '</strong>.</p>' +
      '<p class="hint">A confirmation email is on its way. Each slide is a single physical item, sold once — your slides are reserved for you.</p>' +
      '<div class="promo-row" style="justify-content:center">' +
      '<a class="btn btn-primary" href="/track/">' + BSR.icon('truck', 'ic-sm') + ' Track your order</a>' +
      '<a class="btn btn-secondary" href="/shop/">Keep shopping</a></div></div>';
  } else {
    showEmpty();
  }
});
</script>
</body>
</html>
