<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Bay Shore Relics LLC</title>
<meta name="description" content="Search the Bay Shore Relics LLC catalog of vintage 35mm railroad slides.">
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods5">
<script src="/assets/js/bsr.js?v=20260925n" defer></script>
<style>
.search-page .search-box { display: flex; gap: 10px; margin: 18px 0 26px; max-width: 640px; }
.search-page .search-box input { flex: 1; padding: 13px 16px; border: 1px solid var(--line);
  border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 1rem; }
.search-page .search-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.search-page .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
</style>
</head>
<body>
<div id="bsr-header"></div>
<main id="content">
<div class="wrap search-page">
<header class="page-head">
<h1>Search slides</h1>
<p class="lede" id="search-lede">Search by railroad, location, locomotive, or keyword.</p>
</header>
<form class="search-box" id="search-form" action="/search/" method="get">
<input type="search" id="search-input" name="q" placeholder="Search slides…" aria-label="Search slides" autocomplete="off">
<button class="btn btn-primary" type="submit">Search</button>
</form>
<div class="chips" id="search-chips" aria-label="Try searching for">
<button class="btn btn-secondary btn-sm" type="button" data-q="steam">Steam</button>
<button class="btn btn-secondary btn-sm" type="button" data-q="diesel">Diesel</button>
<button class="btn btn-secondary btn-sm" type="button" data-q="depot">Depot</button>
<button class="btn btn-secondary btn-sm" type="button" data-q="Chicago">Chicago</button>
<button class="btn btn-secondary btn-sm" type="button" data-q="yard">Yard</button>
</div>
<div class="grid" id="search-grid"></div>
<div id="search-state"></div>
</div>
</main>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  BSR.init({ active: '' });
  var grid = document.getElementById('search-grid');
  var state = document.getElementById('search-state');
  var input = document.getElementById('search-input');
  var lede = document.getElementById('search-lede');

  function card(p) {
    var img = p.image
      ? '<img src="' + BSR.esc(p.image) + '" alt="' + BSR.esc(p.title) + '" loading="lazy">'
      : '<span class="no-photo">' + BSR.icon('eye', 'ic-lg') + '</span>';
    var sale = (p.compare_at_cents > p.price_cents) ? ' <s>' + BSR.money(p.compare_at_cents) + '</s>' : '';
    return '<div class="card"><a class="card-link" href="/product.html?slug=' + encodeURIComponent(p.slug) + '">' +
      '<div class="card-img">' + img + '</div><div class="card-body">' +
      '<p class="card-title">' + BSR.esc(p.title) + '</p>' +
      '<p class="card-meta">' + BSR.esc(p.railroad || '') + (p.item_number ? ' · #' + BSR.esc(p.item_number) : '') + '</p>' +
      '<p class="card-price">' + BSR.money(p.price_cents) + sale + '</p>' +
      '</div></a></div>';
  }

  function emptyState(q) {
    state.innerHTML = '<div class="empty">' + BSR.icon('search', '') +
      '<h2>No slides found' + (q ? ' for &ldquo;' + BSR.esc(q) + '&rdquo;' : '') + '</h2>' +
      '<p>Try a different keyword — a railroad name, a town, or "steam". Remember: sold slides are removed from the shop, so they won\'t appear here.</p>' +
      '<a class="btn btn-primary" href="/shop/">Browse all slides</a></div>';
  }

  function runQuery(q) {
    input.value = q || '';
    if (!q) {
      grid.innerHTML = '';
      state.innerHTML = '<div class="empty">' + BSR.icon('search', '') +
        '<h2>What are you looking for?</h2><p>Type a keyword above, or tap one of the suggestions.</p></div>';
      lede.textContent = 'Search by railroad, location, locomotive, or keyword.';
      return;
    }
    lede.textContent = 'Results for "' + q + '".';
    grid.innerHTML = '';
    state.innerHTML = '<div class="empty"><p>Searching…</p></div>';
    BSR.api('/api/catalog/products?q=' + encodeURIComponent(q)).then(function (j) {
      var items = (j && j.ok && j.products) ? j.products : [];
      if (!items.length) { grid.innerHTML = ''; emptyState(q); return; }
      state.innerHTML = '';
      grid.innerHTML = items.map(card).join('');
    }).catch(function () {
      grid.innerHTML = '';
      state.innerHTML = '<div class="empty">' + BSR.icon('info', '') +
        '<h2>Search is unavailable right now</h2><p>Please try again in a moment.</p>' +
        '<a class="btn btn-primary" href="/shop/">Browse all slides</a></div>';
    });
  }

  var params = new URLSearchParams(window.location.search);
  var initial = (params.get('q') || '').trim();
  runQuery(initial);

  document.getElementById('search-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = input.value.trim();
    var url = new URL(window.location.href);
    if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
    window.history.replaceState(null, '', url.toString());
    runQuery(q);
  });
  document.getElementById('search-chips').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-q]');
    if (!b) return;
    var q = b.getAttribute('data-q');
    var url = new URL(window.location.href);
    url.searchParams.set('q', q);
    window.history.replaceState(null, '', url.toString());
    runQuery(q);
  });
});
</script>
</body>
</html>
