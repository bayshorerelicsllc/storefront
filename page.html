<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bay Shore Relics LLC</title>
<meta name="description" content="">
<link rel="icon" href="/assets/img/logo-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css?v=northwoods5">
<script src="/assets/js/bsr.js?v=20260926g" defer></script>
</head>
<body>
<div id="bsr-header"></div>
<main id="content"><div class="wrap"><div class="page-narrow" id="page-body"><p class="muted">Loading…</p></div></div></main>
<div id="bsr-footer"></div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  BSR.init();
  var slug = new URLSearchParams(location.search).get('slug') || '';
  var box = document.getElementById('page-body');
  BSR.api('/api/catalog/pages/' + encodeURIComponent(slug)).then(function (j) {
    if (j && j.ok && j.page) {
      document.title = j.page.seo_title || j.page.title;
      box.innerHTML = '<h1>' + BSR.esc(j.page.title) + '</h1><div class="rich-text">' + (j.page.body || '') + '</div>';
    } else {
      box.innerHTML = '<h1>Page not found</h1><p class="muted">That page doesn\'t exist.</p>';
    }
  }).catch(function () {
    box.innerHTML = '<h1>Something went wrong</h1><p class="muted">Please try again.</p>';
  });
});
</script>
</body>
</html>
